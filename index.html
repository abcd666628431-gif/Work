        window.getMemberColorClass = (name) => {

            for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
            return memberColorPalettes[Math.abs(seed) % memberColorPalettes.length];
        };

        window.openAsPopout = () => {

        let crRecords = [], crItemTypes = ['海鮮', '肉類', '蔬果', '包裝冰', '其他'], crCurrentSelectedType = '', crCurrentTab = 'active';

        // 雪房超時通知系統 (雙頻率提示音效放慢鳴響 10 秒 + 10 秒倒數彈窗 + 桌面原生推播)
        window.crNotifiedSet = new Set();
        let crAudioCtx = null, crSoundIntervalId = null, crBannerTimeoutId = null;

        // 雙音節提示音（880Hz -> 1174.66Hz），每 1.2 秒一組，持續 10 秒
        window.playAlertSound = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                
                if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                
                const ctx = new AudioCtx();
                crAudioCtx = ctx;

                const playDualBeep = () => {
                    if (!ctx || ctx.state === 'closed') return;
                    const now = ctx.currentTime;
                    // 第一音階: 880Hz
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(880, now);
                    gain1.gain.setValueAtTime(0.3, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.18);

                    // 第二音階: 1174.66Hz
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1174.66, now + 0.22);
                    gain2.gain.setValueAtTime(0.3, now + 0.22);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + 0.22);
                    osc2.stop(now + 0.48);
                };

                playDualBeep();
                crSoundIntervalId = setInterval(playDualBeep, 1200);

                setTimeout(() => {
                    if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                }, 10000);
            } catch (e) {}
        };

        window.stopOverdueAlarm = () => {
            if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
            if (crBannerTimeoutId) { clearTimeout(crBannerTimeoutId); crBannerTimeoutId = null; }
            if (crAudioCtx && crAudioCtx.state !== 'closed') {
                try { crAudioCtx.close(); } catch(e){}
            }
            const banner = document.getElementById('crOverdueAlertBanner');
            if (banner) {
                banner.style.opacity = '0';
                banner.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => banner.classList.add('hidden'), 300);
            }
        };

        window.showOverdueAlertBanner = (itemsText) => {
            let banner = document.getElementById('crOverdueAlertBanner');

                banner = document.createElement('div');
                banner.id = 'crOverdueAlertBanner';

                banner.onclick = window.stopOverdueAlarm;
                document.body.appendChild(banner);
            }
            banner.innerHTML = `
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 animate-pulse"><i data-lucide="bell-ring" class="w-4 h-4 text-white"></i></div>

                        <div class="text-xs font-black tracking-wide flex items-center space-x-1.5"><span>⚠️ 雪房存貨超時警報！</span><span class="bg-white text-red-600 text-[9px] px-1.5 py-0.2 rounded font-bold">10秒</span></div>
                        <div class="text-[10px] text-red-100 font-bold truncate mt-0.5">${itemsText}</div>
                    </div>
                </div>
                <button onclick="event.stopPropagation(); window.stopOverdueAlarm();" class="ml-2 bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-lg text-[10px] font-black shrink-0 border border-white/40 active:scale-95 transition-all">關閉/靜音</button>
            `;
            banner.style.opacity = '1';
            banner.style.transform = 'translate(-50%, 0)';
            banner.classList.remove('hidden');
            lucide.createIcons({ root: banner });

            if (crBannerTimeoutId) clearTimeout(crBannerTimeoutId);
            crBannerTimeoutId = setTimeout(window.stopOverdueAlarm, 10000);
        };

        window.checkColdRoomOverdueAlerts = () => {
            const isEnabled = getLocal('work_cache_cr_notify', false);
            if (!isEnabled) return;
            const now = window.getNow().getTime();
            let newOverdueList = [];

            crRecords.forEach(r => {
                if (r.status === 'active' && r.type !== '包裝冰') {
                    const isOverdue = now > (r.depositTime + CR_TIME_LIMIT_MS);
                    if (isOverdue) {
                        if (!window.crNotifiedSet.has(r.id)) {
                            window.crNotifiedSet.add(r.id);
                            newOverdueList.push(r);
                            if ("Notification" in window && Notification.permission === "granted") {
                                const overdueMs = now - (r.depositTime + CR_TIME_LIMIT_MS);
                                const h = Math.floor(overdueMs / 3600000);
                                const m = Math.floor((overdueMs % 3600000) / 60000);
                                const timeStr = h > 0 ? `${h}小時 ${m}分` : `${m}分`;
                                try {
                                    new Notification("⚠️ 雪房存貨超時警報！", {
                                        body: `檔主【${r.tenant}】(${r.type}) 存放已超過 24 小時（已超時 ${timeStr}）！`,
                                        icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
                                    });
                                } catch(e) {}
                            }
                        }
                    }
                }
            });

            if (newOverdueList.length > 0) {
                const summary = newOverdueList.map(x => `${x.tenant}(${x.type})`).join('、');
                window.playAlertSound();
                window.showOverdueAlertBanner(summary);
            }

                        btn.classList.remove('hidden');

            const currentTab = localStorage.getItem('activeTab') || 'daily';

        window.showConfirm = (title, message, onConfirm) => {

        window.renderDailySchedule = () => {

                const done = !!taskCompletionState[task.id];

                return `

        function setupPureRealtimeSync() {
            if (!currentUser) return;
            const bindSync = (key, localKey, onUpdate) => {
                onSnapshot(cfgDoc(key), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        const val = data[Object.keys(data)[0]] !== undefined ? data[Object.keys(data)[0]] : data;
                        safeSetLocal(localKey, val);
                        onUpdate(data);
                    }
                }, console.error);
            };

            bindSync('schedule', 'work_cache_schedule', d => { if (d.tasks) { dailyScheduleData = d.tasks; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); } });
            bindSync('task_states', 'work_cache_task_states', d => { taskCompletionState = d.states || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('subtask_states', 'work_cache_subtask_states', d => { subTaskCompletionState = d.states || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('task_extras', 'work_cache_daily_extras', d => { taskExtrasState = d.extras || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('gallery_categories', 'work_cache_gallery_categories', d => { galleryCategories = d.categories || galleryCategories; if (!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件'); window.renderGallery(); });
            bindSync('future_memos', 'work_cache_future_memos', d => { futureMemos = d.memos || []; if (!document.getElementById('memoPage')?.classList.contains('hidden')) window.renderMemos(); });
            bindSync('team_members', 'work_cache_team_members', d => { teamMembers = d.members || []; if (document.getElementById('scheduleManageModal')?.classList.contains('flex')) window.renderScheduleManager(); });
            bindSync('member_schedules', 'work_cache_member_schedules', d => {
                memberSchedules = d.schedules || [];
                if (d.date) safeSetLocal('work_cache_schedule_date', d.date);
                checkAndResetDailySchedule();
                if (!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
                if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
            });
            bindSync('coldRoom', 'coldRoomRecords', d => {
                if (d.records) { crRecords = d.records; safeSetLocal('coldRoomRecords', crRecords); }
                if (d.types) { crItemTypes = d.types; safeSetLocal('coldRoomTypes', crItemTypes); }
                if (!document.getElementById('coldRoomPage')?.classList.contains('hidden')) window.crRenderList();
                window.checkColdRoomOverdueAlerts();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items'), (snap) => {
                let items = []; snap.forEach(d => items.push(d.data()));
                items.sort((a,b) => (b.id || '').localeCompare(a.id || ''));
                galleryItems = items;
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (document.getElementById('galleryPage') && !document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
                if (document.getElementById('dailySchedulePage') && !document.getElementById('dailySchedulePage').classList.contains('hidden')) window.renderDailySchedule();
            }, console.error);
        }

        window.renderMap = () => {
            const c = document.getElementById('mapPointsContainer');
            if (c) c.innerHTML = '';
            window.updateMapSimulation();
        };

        window.updateMapSimulation = () => {
            if (document.getElementById('mapPage')?.classList.contains('hidden')) return;
            const container = document.getElementById('mapPointsContainer');
            if (!container) return;
            const now = window.getNow(), nowTime = now.getTime(), curMins = now.getHours() * 60 + now.getMinutes();
            let activeMembers = {}, incomingMembers = {};

            memberSchedules.forEach(sched => {
                const s = parseTime(sched.start).getTime(), e = parseTime(sched.end).getTime();
                if (nowTime >= s && nowTime <= e) {
                    activeMembers[sched.name] = sched.locationId;
                    const [endH, endM] = sched.end.split(':').map(Number);
                    const remainMins = (endH * 60 + endM) - curMins;
                    if (remainMins > 0 && remainMins <= 10) {
                        const nextSched = memberSchedules.find(ns => ns.locationId === sched.locationId && ns.name !== sched.name && ns.start === sched.end);
                        if (nextSched) {
                            incomingMembers[sched.locationId] = incomingMembers[sched.locationId] || [];
                            if (!incomingMembers[sched.locationId].includes(nextSched.name)) incomingMembers[sched.locationId].push(nextSched.name);
                        }
                    }
                }

                if (sched.locationId === 'pt_7') {
                    const [sH, sM] = sched.start.split(':').map(Number);
                    const diffToRest = (sH * 60 + sM) - curMins;
                    if (diffToRest > 0 && diffToRest <= 15) {
                        incomingMembers['pt_7'] = incomingMembers['pt_7'] || [];
                        if (!incomingMembers['pt_7'].includes(sched.name)) incomingMembers['pt_7'].push(sched.name);
                    }
                }
            });

            let locGroups = {};
            Object.entries(activeMembers).forEach(([n, loc]) => { (locGroups[loc] = locGroups[loc] || []).push(n); });

            // 渲染外圍站點 (一樓、地面層、休息中)
            ['pt_2', 'pt_6', 'pt_7'].forEach(locId => {
                const names = locGroups[locId] || [], incoming = incomingMembers[locId] || [];
                const card = document.getElementById(`station-${locId}`);
                if (card) {
                    let box = card.querySelector('.ext-members-box');
                    if (!box) {
                        box = document.createElement('div');
                        box.className = 'ext-members-box flex flex-wrap items-center justify-center gap-1.5 -mt-1 pt-0';
                        card.appendChild(box);
                    } else box.innerHTML = '';

                    // 當前在崗人員
                    names.forEach(n => box.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col items-center justify-center m-0.5">
                            <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center"><i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${n}</div>
                            <div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div>
                        </div>`));
                    
                    // 待接班人員
                    incoming.forEach(n => box.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col items-center justify-center m-0.5 animate-flag-in">
                            <div class="bg-amber-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center"><i data-lucide="user-plus" class="w-3 h-3 mr-1 text-white"></i>待:${n}</div>
                            <div class="w-5 h-5 bg-amber-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div>
                        </div>`));
                }
            });

            // 渲染今日人員上下班動態 (優先順序: 準備下班 > 準備上班 > 下班了，已下班人員按最近下班排序，名字 11px)
            const staffStatusListEl = document.getElementById('todayDutyStaffList');
            if (staffStatusListEl) {
                const uniqueScheduledMembers = Array.from(new Set(memberSchedules.filter(s => s.name && !s.name.includes('休')).map(s => s.name)));
                if (uniqueScheduledMembers.length === 0) {
                    staffStatusListEl.innerHTML = '<div class="text-[10px] text-slate-400 text-center py-3 font-bold">今日尚無排班資料</div>';
                } else {
                    const memberDutyList = uniqueScheduledMembers.map(name => {
                        const shifts = memberSchedules.filter(s => s.name === name);
                        const earliestStart = shifts.reduce((min, s) => s.start < min ? s.start : min, "23:59");
                        const latestEnd = shifts.reduce((max, s) => s.end > max ? s.end : max, "00:00");
                        const [esH, esM] = earliestStart.split(':').map(Number);
                        const [leH, leM] = latestEnd.split(':').map(Number);
                        const eMins = esH * 60 + esM, lMins = leH * 60 + leM;
                        const col = window.getMemberColorClass(name);

                        let rank = 3, subSort = lMins, statusBadge = '';
                        if (eMins <= curMins && curMins < lMins) {
                            rank = 1; // 優先級 1: 準備下班
                            const diff = lMins - curMins;
                            subSort = diff; // 由少到多
                            const h = Math.floor(diff / 60), m = diff % 60;
                            const timeStr = `${h > 0 ? h + '小時' : ''}${m}分`;
                            statusBadge = `<div class="bg-emerald-50 border border-emerald-300 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-md flex items-center shadow-xs whitespace-nowrap"><i data-lucide="timer" class="w-3 h-3 mr-1 text-emerald-600"></i>剩 ${timeStr} 下班</div>`;
                        } else if (curMins < eMins) {
                            rank = 2; // 優先級 2: 準備上班
                            const diff = eMins - curMins;
                            subSort = diff; // 由少到多
                            const h = Math.floor(diff / 60), m = diff % 60;
                            const timeStr = `${h > 0 ? h + '小時' : ''}${m}分`;
                            statusBadge = `<div class="bg-amber-50 border border-amber-300 text-amber-700 font-bold text-[10px] px-2 py-0.5 rounded-md flex items-center shadow-xs whitespace-nowrap"><i data-lucide="clock" class="w-3 h-3 mr-1 text-amber-600"></i>再過 ${timeStr} 上班</div>`;
                        } else {
                            rank = 3; // 優先級 3: 下班了
                            subSort = -lMins; // 負值排序使得越晚下班 (越接近現在) 的越靠前
                            statusBadge = `<div class="bg-slate-100 border border-slate-200 text-slate-400 font-medium text-[10px] px-2 py-0.5 rounded-md flex items-center whitespace-nowrap"><i data-lucide="check" class="w-3 h-3 mr-1 text-slate-400"></i>下班了</div>`;
                        }

                        return { name, rank, subSort, col, statusBadge };
                    });

                    // 排序：準備下班 > 準備上班 > 下班了 (最近下班的排在最前)
                    memberDutyList.sort((a, b) => a.rank - b.rank || a.subSort - b.subSort || a.name.localeCompare(b.name));

                    staffStatusListEl.innerHTML = memberDutyList.map(item => `
                        <div class="bg-white border border-slate-200/80 rounded-lg p-1.5 px-2.5 flex items-center justify-between shadow-xs hover:border-slate-300 transition-colors">
                            <div class="flex items-center min-w-0 pr-2">
                                <div class="w-2 h-2 rounded-full ${item.col.activeBg} mr-2 shrink-0"></div>
                                <span class="font-black text-[11px] text-slate-800 tracking-wide truncate">${item.name}</span>
                            </div>
                            <div class="shrink-0">${item.statusBadge}</div>
                        </div>`).join('');
                }
            }

            document.querySelectorAll('.member-dynamic-marker').forEach(el => el.dataset.active = "false");
            Object.entries(locGroups).forEach(([locId, names]) => {
                if (['pt_2', 'pt_6', 'pt_7'].includes(locId) || !mapData.points[locId]) return;
                const loc = mapData.points[locId], incoming = incomingMembers[locId] || [];

                // 當前在崗人員（上層 z-40）
                names.forEach((name, idx) => {
                    let marker = document.getElementById(`dyn-marker-${name}-${locId}-current`) || document.createElement('div');
                    marker.id = `dyn-marker-${name}-${locId}-current`;
                    marker.innerHTML = `
                        <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-lg whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center"><i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${name}</div>
                        <div class="relative flex items-center justify-center"><div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md z-10 relative flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div><div class="absolute w-8 h-8 bg-blue-400/40 rounded-full radar-slow z-0"></div></div>`;
                    if (marker.parentNode !== container) container.appendChild(marker);
                    const off = names.length > 1 ? (idx - (names.length - 1) / 2) * 75 : 0;
                    marker.style.left = `calc(${loc.x}% + ${off}px - 20px)`;
                    marker.style.top = `calc(${loc.y}% - 50px)`;
                    let seed = 0; for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
                    marker.className = `member-dynamic-marker absolute flex flex-col items-center justify-center transform -translate-x-1/2 pointer-events-none z-40 drop-shadow-xl ${['animate-float-a', 'animate-float-b', 'animate-float-c'][seed % 3]}`;
                    marker.style.animationDelay = `${(seed % 5) * -3}s`;
                    marker.dataset.active = "true";
                });

                    const text = e.target.result;
                    const rows = [];
                    let row = [], cur = '', inQuotes = false;

                    for (let i = 0; i < text.length; i++) {
                        const c = text[i], next = text[i+1];
                        if (c === '"') {
                            if (inQuotes && next === '"') { cur += '"'; i++; }
                            else { inQuotes = !inQuotes; }
                        } else if (c === ',' && !inQuotes) {
                            row.push(cur.trim()); cur = '';

                    }

                        '休息中': 'pt_7', '人員休息中': 'pt_7', '休息': 'pt_7'
                    };

                    const isHalfHourFormat = headers.some(h => h.includes('07:30') || h.includes('08:30'));

                    for (let rowIdx = 1; rowIdx < validRows.length; rowIdx++) {
                        const cols = validRows[rowIdx];
                        if (!cols.length) continue;
                        const stationRaw = (cols[0] || '').replace(/\s+/g, '');
                        let matchedLocId = null;
                        for (let [k, v] of Object.entries(locMap)) {

                            for (let c = 1; c < headers.length; c++) {
                                const timeCol = headers[c];
                                if (!timeCol || !timeCol.includes('-')) continue;
                                const val = cols[c] ? cols[c].replace(/^"+|"+$/g, '').trim() : '';

                                        delete window._tempGridValues[`${matchedLocId}_${hStr}:00_${hStr}:30`];

            r.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height, max = 800;
                    if (w > h && w > max) { h *= max / w; w = max; }
                    else if (h > max) { w *= max / h; h = max; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = () => reject(new Error("解析失敗"));
            };
            r.onerror = () => reject(new Error("讀取失敗"));
        });

        window.updateCurrentTimeIndicator = () => {
            const ind = document.getElementById('nowTimeMarker');

            const tasks = [...dailyScheduleData].sort((a, b) => parseTime(a.start) - parseTime(b.start));
            if (!tasks.length) { ind.style.display = 'none'; return; }

            const nowMs = window.getNow().getTime();

            const getCardY = (taskId, isBottom = false) => {
                const w = document.getElementById(`tl-task-wrapper-${taskId}`);
                if (!w) return null;
                const card = w.querySelector('.timeline-card') || w;
                const cardTop = w.offsetTop + card.offsetTop;
                return isBottom ? (cardTop + card.offsetHeight / 2) : (cardTop + 18);
            };

            const firstStart = parseTime(tasks[0].start).getTime();
            let currentY = null;

            if (nowMs <= firstStart) {
                currentY = getCardY(tasks[0].id, false);
            } else {
                let lastStartedIdx = -1;
                for (let i = 0; i < tasks.length; i++) {
                    if (nowMs >= parseTime(tasks[i].start).getTime()) {
                        lastStartedIdx = i;
                    }
                }

                if (lastStartedIdx !== -1) {
                    const curTask = tasks[lastStartedIdx];
                    const curStart = parseTime(curTask.start).getTime();
                    const curY = getCardY(curTask.id, false);

                    let nextTask = null;
                    for (let i = lastStartedIdx + 1; i < tasks.length; i++) {
                        if (parseTime(tasks[i].start).getTime() > curStart) {
                            nextTask = tasks[i];
                            break;
                        }
                    }

                    if (nextTask) {
                        const nextStart = parseTime(nextTask.start).getTime();
                        const nextY = getCardY(nextTask.id, false);
                        if (curY !== null && nextY !== null) {
                            const ratio = Math.min(1, Math.max(0, (nowMs - curStart) / (nextStart - curStart)));
                            currentY = curY + (nextY - curY) * ratio;
                        }
                    } else {
                        const curEnd = parseTime(curTask.end).getTime();
                        const bottomY = getCardY(curTask.id, true);
                        if (curY !== null && bottomY !== null) {
                            const ratio = curEnd > curStart ? Math.min(1, Math.max(0, (nowMs - curStart) / (curEnd - curStart))) : 1;
                            currentY = curY + (bottomY - curY) * ratio;
                        }
                    }
                }

            syncConfig('subtask_states', { states: {} });
            document.getElementById('resetOptionsModal')?.remove();
            window.showToast("🌅 已清空任務狀態，新的一天開始！");
            window.renderDailySchedule();
            if (!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(true);
        };

        setInterval(() => {
            if (!isFastForwarding) {
                window.updateClockUI();
            }
        }, 1000);

        setInterval(() => {
            checkAndResetDailySchedule();
            if (!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
            if (!document.getElementById('memoPage')?.classList.contains('hidden')) window.updateMemoCountdowns();
            if (!document.getElementById('coldRoomPage')?.classList.contains('hidden')) window.crRenderList();
            window.checkColdRoomOverdueAlerts();
        }, 60000);

        function parseTime(tStr) { const [h, m] = tStr.split(':').map(Number), d = window.getNow(); d.setHours(h, m, 0, 0); return d; }
        function calculateTaskStatus(startStr, endStr) {
            const now = window.getNow(), s = parseTime(startStr), e = parseTime(endStr);
            const fmt = (diff) => `${Math.floor(diff/60) > 0 ? Math.floor(diff/60) + '小時' : ''}${diff % 60}分`;
            if (now < s) return { state: 'waiting', text: `未開始 (約 ${fmt(Math.floor((s - now) / 60000))}後)` };
            if (now >= s && now <= e) return { state: 'active', text: `進行中 (剩餘 ${fmt(Math.floor((e - now) / 60000))})` };
            return { state: 'overdue', text: `已結束 (超時 ${fmt(Math.floor((now - e) / 60000))})` };
        }

        window.openFullscreenImg = (src) => {
            const v = document.getElementById('imageViewer');
            document.getElementById('imageViewerImg').src = src;
            v.classList.replace('hidden', 'flex');
        };

        window.switchTab = (tab) => {
            const pages = { daily: 'dailySchedulePage', gallery: 'galleryPage', timeline: 'timelinePage', memo: 'memoPage', map: 'mapPage', coldRoom: 'coldRoomPage' };
            const btns = { daily: 'tabDaily', timeline: 'tabTimeline', memo: 'tabMemo', map: 'tabMap', gallery: 'tabGallery', coldRoom: 'tabColdRoom' };
            const actCls = "flex-1 py-1.5 px-2 text-xs rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all uppercase tracking-widest text-center whitespace-nowrap";
            const inactCls = "flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap";

            Object.values(pages).forEach(id => { const el = document.getElementById(id); if (el) { el.classList.add('hidden'); el.classList.remove('flex', 'block'); } });
            Object.values(btns).forEach(id => { const el = document.getElementById(id); if (el) el.className = inactCls; });

            const targetPage = document.getElementById(pages[tab]), targetBtn = document.getElementById(btns[tab]);
            if (targetPage) { targetPage.classList.remove('hidden'); targetPage.classList.add(['map', 'gallery', 'coldRoom'].includes(tab) ? 'flex' : 'block'); }
            if (targetBtn) targetBtn.className = actCls;

            ({ daily: window.renderDailySchedule, gallery: window.renderGallery, timeline: () => window.renderTimeline(true), memo: window.renderMemos, map: window.renderMap, coldRoom: window.crRenderList })[tab]?.();
            localStorage.setItem('activeTab', tab);
        };

        window.renderMemos = () => {
            const container = document.getElementById('memoContainer');
            if (!container) return;
            let sorted = [...futureMemos].sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`) - new Date(`${b.date}T${b.time || '00:00'}`));
            if (!sorted.length) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-slate-400"><i data-lucide="inbox" class="w-12 h-12 mb-3 opacity-30"></i><span class="text-xs font-bold tracking-widest text-center">目前沒有未來的備忘任務</span></div>';
                lucide.createIcons(); return;
            }
            container.innerHTML = sorted.map(m => `
                <div onclick="window.openMemoEditorForEdit('${m.id}')" title="點擊可修改備忘" class="memo-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative overflow-hidden cursor-pointer hover:border-blue-300 transition-colors" data-datetime="${m.date}T${m.time || '00:00'}">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-400 opacity-80"></div>
                    <div class="flex justify-between items-start pl-2">
                        <div class="flex-1">
                            <h3 class="text-sm font-bold text-slate-800 mb-1">${m.title}</h3>
                            <p class="text-xs text-slate-600 leading-relaxed mb-3 break-words whitespace-pre-wrap">${m.content || ''}</p>
                            <div class="inline-flex items-center bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-[10px] font-bold border border-indigo-100"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${m.date} ${m.time || ''}</div>
                        </div>
                        <div class="flex flex-col items-end shrink-0 ml-3">
                            <button onclick="window.deleteMemo('${m.id}'); event.stopPropagation();" class="text-slate-400 hover:text-red-500 p-1.5 rounded active:scale-95 transition-all bg-slate-50 hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            <div class="memo-countdown text-[11px] font-bold text-amber-600 mt-3 text-right whitespace-nowrap">計算中...</div>
                        </div>
                    </div>
                </div>`).join('');
            lucide.createIcons();
            window.updateMemoCountdowns();
        };

        window.updateMemoCountdowns = () => {
            const now = window.getNow();
            document.querySelectorAll('.memo-card').forEach(card => {
                const diff = new Date(card.dataset.datetime) - now, cdEl = card.querySelector('.memo-countdown');
                if (!cdEl) return;
                if (diff <= 0) { cdEl.textContent = '已過期 / 進行中'; cdEl.className = 'memo-countdown text-[11px] font-bold text-red-500 mt-3 text-right animate-pulse whitespace-nowrap'; }
                else {
                    const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000);
                    cdEl.textContent = `⏳ ${d > 0 ? d + '天 ' : ''}${h}小時 ${m}分`;
                }
            });
        };

        window.openMemoEditor = () => {
            const { date, time } = getNowInputStrs();
            const modalHtml = `
                <div id="memoEditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-4">
                    <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative">
                        <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center"><i data-lucide="calendar-plus" class="w-5 h-5 mr-2 text-blue-500"></i>新增備忘錄</h3>
                        <div class="space-y-3">
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">任務標題</label><input type="text" id="memoTitle" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">詳細內容 (選填)</label><textarea id="memoContent" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none h-20 resize-none"></textarea></div>
                            <div class="flex gap-2">
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">日期</label><input type="date" id="memoDate" value="${date}" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-blue-500 focus:outline-none text-center"></div>
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="memoTime" value="${time}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-4">
                            <button onclick="document.getElementById('memoEditModal').remove()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold active:scale-95 transition-colors">取消</button>
                            <button onclick="window.saveMemo()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-colors">儲存</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        };

        window.openMemoEditorForEdit = (id) => {
            const m = futureMemos.find(x => x.id === id);
            if (!m) return;
            const modalHtml = `
                <div id="memoEditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-4">
                    <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative" onclick="event.stopPropagation()">
                        <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center"><i data-lucide="edit" class="w-5 h-5 mr-2 text-blue-500"></i>修改備忘錄</h3>
                        <div class="space-y-3">
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">任務標題</label><input type="text" id="memoTitle" value="${m.title}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center font-bold"></div>
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">詳細內容 (選填)</label><textarea id="memoContent" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none h-20 resize-none">${m.content || ''}</textarea></div>
                            <div class="flex gap-2">
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">日期</label><input type="date" id="memoDate" value="${m.date}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="memoTime" value="${m.time || '09:00'}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-between items-center border-t border-slate-100 pt-4">
                            <button onclick="window.deleteMemo('${m.id}'); document.getElementById('memoEditModal').remove();" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg text-xs font-bold transition-colors">刪除</button>
                            <div class="space-x-2 flex">
                                <button onclick="document.getElementById('memoEditModal').remove()" class="px-3 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                                <button onclick="window.saveEditMemo('${m.id}')" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        };

        window.saveMemo = () => {
            const title = document.getElementById('memoTitle').value.trim(), content = document.getElementById('memoContent').value.trim();
            const date = document.getElementById('memoDate').value, time = document.getElementById('memoTime').value;
            if (!title || !date) return window.showToast('請填寫標題與日期', true);
            futureMemos.push({ id: 'm_' + Date.now(), title, content, date, time });
            syncConfig('future_memos', { memos: futureMemos });
            document.getElementById('memoEditModal').remove();
            window.renderMemos(); window.showToast('已新增備忘錄');
        };

        window.saveEditMemo = (id) => {
            const m = futureMemos.find(x => x.id === id);
            if (!m) return;
            const title = document.getElementById('memoTitle').value.trim(), content = document.getElementById('memoContent').value.trim();
            const date = document.getElementById('memoDate').value, time = document.getElementById('memoTime').value;
            if (!title || !date) return window.showToast('請填寫標題與日期', true);
            m.title = title; m.content = content; m.date = date; m.time = time;
            syncConfig('future_memos', { memos: futureMemos });
            document.getElementById('memoEditModal').remove();
            window.renderMemos(); window.showToast('已更新備忘錄');
        };

        window.deleteMemo = (id) => {
            window.showConfirm('刪除備忘', '確定要刪除這筆未來備忘任務嗎？', () => {
                futureMemos = futureMemos.filter(m => m.id !== id);
                syncConfig('future_memos', { memos: futureMemos });
                window.renderMemos();
            });
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) { window.showToast("連線驗證失敗", true); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const dot = document.getElementById('connectionDot'), st = document.getElementById('connectionStatus');
            if (user) {
                dot.classList.replace('bg-red-500', 'bg-green-500'); st.textContent = '系統已連線並同步';
                setupPureRealtimeSync();
            } else {
                dot.classList.replace('bg-green-500', 'bg-red-500'); st.textContent = '連線中或驗證失敗...';
            }
        });

        loadLocalFastCache();
        initAuth();

        if (getLocal('work_cache_dark_mode', false)) {
            document.body.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                const icon = document.getElementById('darkModeIcon');
                if (icon) { icon.setAttribute('data-lucide', 'sun'); lucide.createIcons(); }
            });
        }
    </script>
</head>

<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 bg-[#f0ebe1]">
    <!-- 統一卡片容器：尺寸在獨立視窗與網頁皆 100% 保持相同比例 -->

        <header class="bg-[#fdfbf7]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#e5dfd3] p-4 pt-6 shadow-sm shrink-0">

                <div class="w-8"></div>
                <div class="flex items-center justify-center space-x-2 shrink-0">
                    <h1 class="text-xl text-slate-800 tracking-widest font-black">工作記錄本</h1>
                    <div class="flex items-center space-x-1.5 bg-white/70 px-2 py-0.5 rounded-full border border-slate-200 shadow-sm">

                <!-- 單一齒輪設定鍵與延伸下拉選單 -->
                <div class="relative shrink-0">
                    <button id="settingsMenuBtn" type="button" onclick="window.toggleSettingsMenu(event)" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 text-slate-600 hover:text-blue-600 hover:border-blue-300 flex items-center justify-center transition-colors active:scale-95 shadow-sm" title="設定與更多選項">
                        <i data-lucide="settings" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                    
                    <!-- 下拉延伸選單 -->
                    <div id="settingsDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 p-1.5 z-50 flex flex-col space-y-1 animate-flag-in">
                        <button onclick="window.openAsPopout(); window.toggleSettingsMenu();" class="w-full flex items-center px-3 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                            <i data-lucide="external-link" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 以獨立視窗開啟
                        </button>
                        <button onclick="window.toggleDarkMode()" class="w-full flex items-center px-3 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                            <i id="darkModeIcon" data-lucide="moon" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 切換深色模式
                        </button>
                        <button onclick="window.openTabVisibilityModal()" class="w-full flex items-center px-3 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                            <i data-lucide="layout-grid" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 調整分頁顯示
                        </button>
                        <div class="border-t border-slate-100 my-1"></div>
                        <input type="file" id="importInput" accept=".json" class="hidden" onchange="window.importData(event)">
                        <button onclick="document.getElementById('importInput').click()" class="w-full flex items-center px-3 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                            <i data-lucide="upload" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 導入資料 (JSON)
                        </button>
                        <button onclick="window.exportData()" class="w-full flex items-center px-3 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors text-left">
                            <i data-lucide="download" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 導出資料備份
                        </button>
                    </div>
                </div>
            </div>

            <!-- 分頁切換列 -->
            <div id="tabBarContainer" class="mt-3 flex bg-[#f0ebe1] rounded-lg p-1 shadow-inner border border-[#e5dfd3] relative z-20 overflow-x-auto scrollbar-hide">
                <button id="tabDaily" onclick="window.switchTab('daily')" class="flex-1 py-1.5 px-2 text-xs rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all uppercase tracking-widest text-center whitespace-nowrap">排程</button>
                <button id="tabTimeline" onclick="window.switchTab('timeline')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">動態</button>
                <button id="tabMemo" onclick="window.switchTab('memo')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">備忘</button>
                <button id="tabMap" onclick="window.switchTab('map')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">地圖</button>
                <button id="tabGallery" onclick="window.switchTab('gallery')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">圖庫</button>
                <button id="tabColdRoom" onclick="window.switchTab('coldRoom')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">雪房</button>
            </div>
        </header>
        
        <main id="dailySchedulePage" class="flex-1 min-h-0 p-4 space-y-2 block transition-opacity relative z-10 overflow-y-auto scrollbar-hide">
            <div class="flex justify-end mb-2 px-1">
                <label class="flex items-center cursor-pointer space-x-2 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-sm active:scale-95 transition-transform">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest transition-colors duration-300" id="editModeLabel">一般檢視模式</span>
                    <div class="relative flex items-center">
                        <input type="checkbox" id="editModeToggle" class="sr-only" onchange="window.toggleEditMode(this.checked)">
                        <div class="block bg-slate-300 w-9 h-5 rounded-full border border-slate-300 transition-colors duration-300 shadow-inner" id="editToggleBg"></div>
                        <div class="dot absolute left-1 bg-white w-3 h-3 rounded-full transition-transform duration-300 shadow-sm" id="editToggleDot"></div>
                    </div>
                </label>
            </div>

            <div id="hudContainer" class="flex flex-col items-center justify-center mb-5 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                <div class="relative w-28 h-28 mb-2 z-10">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" class="text-slate-100" stroke-width="8"></circle>
                        <circle id="hudProgressRing" cx="50" cy="50" r="40" fill="none" stroke="currentColor" class="text-blue-500 hud-ring drop-shadow-sm" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span id="hudPercentage" class="text-2xl text-slate-800 font-black tracking-wider mt-1">0%</span>
                        <span class="text-[9px] text-slate-500 tracking-widest font-bold mt-0.5">達成率</span>

                </div>
                <div class="text-[11px] text-slate-600 tracking-wide flex items-center justify-center space-x-2 bg-slate-50 px-3.5 py-1.5 rounded-full border border-slate-200 z-10">

            </div>
            <div id="scheduleContainer" class="space-y-3 pb-8"></div>
        </main>

        <main id="timelinePage" class="hidden flex-1 min-h-0 overflow-y-auto relative z-10 bg-[#fdfbf7] scrollbar-hide scroll-smooth">
            <div id="timelineStickyHeader" class="sticky top-0 z-50 w-full bg-gradient-to-b from-[#fdfbf7] via-[#fdfbf7]/95 to-transparent pt-3 pb-6 px-4 flex flex-col items-center justify-center pointer-events-none transition-all">
                <div class="flex items-center justify-center gap-2 w-full max-w-[500px]">
                    <div class="flex items-center gap-1.5 justify-end flex-1">

                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="crInputTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-blue-500 focus:outline-none text-center"></div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">經手客服人員</label><select id="crInputStaff" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center"></select></div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">貨物類型</label>
                    <div id="crTypeContainer" class="flex flex-wrap gap-1 mb-1.5 justify-center"></div>
                    <div class="flex items-center mt-1 max-w-[160px] mx-auto">
                        <input type="text" id="crInputNewType" placeholder="新類型..." class="w-20 border border-slate-300 rounded-l-lg px-2 py-1 text-[10px] focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center">
                        <button onclick="window.crAddNewType()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded-r-lg border-y border-r border-slate-300 transition-colors shadow-sm text-[10px] font-bold shrink-0">新增</button>
                    </div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">存放數量 (件/箱)</label><input type="number" id="crInputQuantity" placeholder="請輸入數量" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center"></div>
            </div>
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseAddModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitAddRecord()" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm active:scale-95 transition-colors">確認存入</button>
            </div>
        </div>
    </div>

    <div id="crWithdrawModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[300px] shadow-2xl relative scrollbar-hide">
            <h3 class="font-bold text-base mb-3 text-slate-800 flex items-center border-b pb-2"><i data-lucide="package-minus" class="w-4 h-4 mr-2 text-amber-500"></i> 取出貨物</h3>
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 mb-3 shadow-inner">
                <div class="text-[10px] text-slate-500 mb-0.5">檔主: <span id="crWithdrawTenantDisplay" class="font-bold text-slate-700 text-xs"></span></div>
                <div class="text-[10px] text-slate-500">目前剩餘數量: <span id="crWithdrawRemainDisplay" class="font-bold text-blue-600 text-xs"></span></div>
            </div>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">提取日期</label><input type="date" id="crInputWithdrawDate" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-amber-500 focus:outline-none text-center"></div>
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="crInputWithdrawTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-amber-500 focus:outline-none text-center"></div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">本次取出數量</label><input type="number" id="crInputWithdrawQty" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-lg focus:border-amber-500 focus:outline-none font-bold text-slate-700 text-center bg-white shadow-inner"></div>
            </div>
            <input type="hidden" id="crCurrentActionId">
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseWithdrawModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitWithdraw()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold shadow-sm active:scale-95 transition-colors">確認取出</button>
            </div>
        </div>
    </div>
</body>
</html>
