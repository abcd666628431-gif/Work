        window.getMemberColorClass = (name) => {
            if (!name) return { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', activeBg: 'bg-blue-500' };
            let seed = 0;
            for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
            return memberColorPalettes[Math.abs(seed) % memberColorPalettes.length];
        };

        window.openAsPopout = () => {
            const w = 480, h = 950, l = Math.max(0, (window.screen.width - w) / 2), t = Math.max(0, (window.screen.height - h) / 2);
            window.open(window.location.href, 'WorkRecordPopup', `width=${w},height=${h},left=${l},top=${t},menubar=no,status=no,toolbar=no,location=no,scrollbars=no,resizable=yes`);

        let crRecords = [], crItemTypes = ['海鮮', '肉類', '蔬果', '包裝冰', '其他'], crCurrentSelectedType = '', crCurrentTab = 'active';
        const CR_TIME_LIMIT_MS = 24 * 60 * 60 * 1000;

        // 雪房超時通知系統 (雙頻率提示音效放慢鳴響 10 秒 + 10 秒倒數彈窗 + 桌面原生推播)
        window.crNotifiedSet = new Set();
        let crAudioCtx = null, crSoundIntervalId = null, crBannerTimeoutId = null;

        // 雙音節提示音（880Hz -> 1174.66Hz），每 1.2 秒一組，持續 10 秒
        window.playAlertSound = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                
                if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                
                const ctx = new AudioCtx();
                crAudioCtx = ctx;

                const playDualBeep = () => {
                    if (!ctx || ctx.state === 'closed') return;
                    const now = ctx.currentTime;
                    // 第一音階: 880Hz
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(880, now);
                    gain1.gain.setValueAtTime(0.3, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.18);

                    // 第二音階: 1174.66Hz
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1174.66, now + 0.22);
                    gain2.gain.setValueAtTime(0.3, now + 0.22);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + 0.22);
                    osc2.stop(now + 0.48);
                };

                playDualBeep();
                crSoundIntervalId = setInterval(playDualBeep, 1200);

                setTimeout(() => {
                    if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                }, 10000);
            } catch (e) {}
        };

        window.stopOverdueAlarm = () => {
            if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
            if (crBannerTimeoutId) { clearTimeout(crBannerTimeoutId); crBannerTimeoutId = null; }
            if (crAudioCtx && crAudioCtx.state !== 'closed') {
                try { crAudioCtx.close(); } catch(e){}
            }
            const banner = document.getElementById('crOverdueAlertBanner');
            if (banner) {
                banner.style.opacity = '0';
                banner.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => banner.classList.add('hidden'), 300);
            }
        };

        window.showOverdueAlertBanner = (itemsText) => {
            let banner = document.getElementById('crOverdueAlertBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'crOverdueAlertBanner';

                banner.onclick = window.stopOverdueAlarm;
                document.body.appendChild(banner);
            }
            banner.innerHTML = `
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 animate-pulse"><i data-lucide="bell-ring" class="w-4 h-4 text-white"></i></div>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-black tracking-wide flex items-center space-x-1.5"><span>⚠️ 雪房存貨超時警報！</span><span class="bg-white text-red-600 text-[9px] px-1.5 py-0.2 rounded font-bold">10秒</span></div>
                        <div class="text-[10px] text-red-100 font-bold truncate mt-0.5">${itemsText}</div>
                    </div>
                </div>
                <button onclick="event.stopPropagation(); window.stopOverdueAlarm();" class="ml-2 bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-lg text-[10px] font-black shrink-0 border border-white/40 active:scale-95 transition-all">關閉/靜音</button>
            `;
            banner.style.opacity = '1';
            banner.style.transform = 'translate(-50%, 0)';
            banner.classList.remove('hidden');
            lucide.createIcons({ root: banner });

            if (crBannerTimeoutId) clearTimeout(crBannerTimeoutId);
            crBannerTimeoutId = setTimeout(window.stopOverdueAlarm, 10000);
        };

        window.checkColdRoomOverdueAlerts = () => {
            const isEnabled = getLocal('work_cache_cr_notify', false);
            if (!isEnabled) return;
            const now = window.getNow().getTime();
            let newOverdueList = [];

            crRecords.forEach(r => {
                if (r.status === 'active' && r.type !== '包裝冰') {
                    const isOverdue = now > (r.depositTime + CR_TIME_LIMIT_MS);
                    if (isOverdue) {
                        if (!window.crNotifiedSet.has(r.id)) {
                            window.crNotifiedSet.add(r.id);
                            newOverdueList.push(r);
                            if ("Notification" in window && Notification.permission === "granted") {
                                const overdueMs = now - (r.depositTime + CR_TIME_LIMIT_MS);
                                const h = Math.floor(overdueMs / 3600000);
                                const m = Math.floor((overdueMs % 3600000) / 60000);
                                const timeStr = h > 0 ? `${h}小時 ${m}分` : `${m}分`;
                                try {
                                    new Notification("⚠️ 雪房存貨超時警報！", {
                                        body: `檔主【${r.tenant}】(${r.type}) 存放已超過 24 小時（已超時 ${timeStr}）！`,
                                        icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
                                    });
                                } catch(e) {}
                            }
                        }
                    }
                }
            });

            if (newOverdueList.length > 0) {
                const summary = newOverdueList.map(x => `${x.tenant}(${x.type})`).join('、');
                window.playAlertSound();
                window.showOverdueAlertBanner(summary);
            }
        };

        // 齒輪選單展開/收合
        window.toggleSettingsMenu = (e) => {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('settingsDropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        };

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('settingsDropdown');
            const btn = document.getElementById('settingsMenuBtn');
            if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && e.target !== btn) {
                dropdown.classList.add('hidden');
            }
        });

        // 分頁顯示/隱藏管理
        window.applyTabVisibility = () => {
            tabMetadata.forEach(tab => {
                const btn = document.getElementById(tab.btnId);
                const isVisible = tabVisibilityState[tab.id] !== false;
                if (btn) {
                    if (isVisible) {
                        btn.classList.remove('hidden');
                    } else {
                        btn.classList.add('hidden');
                    }
                }
            });

            // 若當前啟動的分頁被隱藏，自動切換至第一個可見分頁
            const currentTab = localStorage.getItem('activeTab') || 'daily';
            if (tabVisibilityState[currentTab] === false) {
                const firstVisible = tabMetadata.find(t => tabVisibilityState[t.id] !== false);
                if (firstVisible) window.switchTab(firstVisible.id);
            }
        };

        window.openTabVisibilityModal = () => {
            const dropdown = document.getElementById('settingsDropdown');
            if (dropdown) dropdown.classList.add('hidden');

            const list = document.getElementById('tabVisibilityList');
            if (!list) return;
            list.innerHTML = tabMetadata.map(tab => {
                const isChecked = tabVisibilityState[tab.id] !== false;
                return `
                <label class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition-colors select-none">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="${tab.icon}" class="w-4 h-4 text-slate-500"></i>
                        <span class="text-xs font-bold text-slate-800">${tab.name}</span>
                    </div>
                    <input type="checkbox" data-tab-id="${tab.id}" ${isChecked ? 'checked' : ''} class="tab-vis-checkbox w-4 h-4 rounded text-blue-600 focus:ring-0 cursor-pointer">
                </label>`;
            }).join('');
            lucide.createIcons({ root: list });

            const modal = document.getElementById('tabVisibilityModal');
            modal.classList.replace('hidden', 'flex');
        };

        window.closeTabVisibilityModal = () => {
            const modal = document.getElementById('tabVisibilityModal');
            modal.classList.replace('flex', 'hidden');
        };

        window.saveTabVisibility = () => {
            const checkboxes = document.querySelectorAll('.tab-vis-checkbox');
            let hasAtLeastOne = false;
            let newState = {};

            checkboxes.forEach(cb => {
                const id = cb.dataset.tabId;
                newState[id] = cb.checked;
                if (cb.checked) hasAtLeastOne = true;
            });

            if (!hasAtLeastOne) {
                return window.showToast("至少需保留一個可見分頁！", true);
            }

            tabVisibilityState = newState;
            safeSetLocal('work_cache_tab_visibility', tabVisibilityState);
            syncConfig('tab_visibility', { visibility: tabVisibilityState });
            window.applyTabVisibility();
            window.closeTabVisibilityModal();
            window.showToast("分頁設定已儲存並線上同步");
        };

        const getNowInputStrs = (targetMs) => {
            const d = targetMs ? new Date(targetMs) : window.getNow();
            return {
                date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
                time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
            };
        };

        function checkAndResetDailySchedule() {
            const todayStr = getNowInputStrs().date;
            const lastSavedDate = getLocal('work_cache_schedule_date', todayStr);
            if (lastSavedDate !== todayStr) {
                memberSchedules = [];
                safeSetLocal('work_cache_member_schedules', memberSchedules);
                safeSetLocal('work_cache_schedule_date', todayStr);
                syncConfig('member_schedules', { schedules: [], date: todayStr });
                if (!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
            }
        }

        window.saveStateSnapshot = () => {
            actionHistory.push({ tasks: { ...taskCompletionState }, subtasks: JSON.parse(JSON.stringify(subTaskCompletionState || {})) });
            if (actionHistory.length > 30) actionHistory.shift();
        };

        window.toggleDarkMode = () => {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('work_cache_dark_mode', isDark);
            const icon = document.getElementById('darkModeIcon');
            if (icon) { icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }
            const dropdown = document.getElementById('settingsDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        };

        window.showToast = (msg, isErr = false) => {
            const t = document.createElement('div');
            t.className = `fixed top-16 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-full shadow-lg text-sm font-bold z-[9999] transition-all duration-300 ${isErr ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, -20px)'; setTimeout(() => t.remove(), 300); }, 3000);
        };

        window.showConfirm = (title, message, onConfirm) => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmModalTitle').innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> ${title}`;
            document.getElementById('confirmModalMessage').innerHTML = message;
            const cancelBtn = document.getElementById('confirmBtnCancel'), okBtn = document.getElementById('confirmBtnOk');
            const cleanup = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); okBtn.removeEventListener('click', okHandler); cancelBtn.removeEventListener('click', cleanup); };
            const okHandler = () => { cleanup(); if (typeof onConfirm === 'function') onConfirm(); };
            okBtn.addEventListener('click', okHandler);
            cancelBtn.addEventListener('click', cleanup);
            lucide.createIcons();
            modal.classList.remove('hidden'); modal.classList.add('flex');
        };

        window.renderDailySchedule = () => {
            const container = document.getElementById('scheduleContainer');
            if (!container) return;
            const total = dailyScheduleData.length, completed = dailyScheduleData.filter(t => taskCompletionState[t.id]).length;
            const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
            const pctEl = document.getElementById('hudPercentage'), cntEl = document.getElementById('hudTaskCount'), ringEl = document.getElementById('hudProgressRing');
            if (pctEl) pctEl.textContent = `${pct}%`;
            if (cntEl) cntEl.textContent = `${completed}/${total}`;
            if (ringEl) ringEl.style.strokeDashoffset = 251.2 - (251.2 * pct) / 100;

            container.innerHTML = dailyScheduleData.map(task => {
                const done = !!taskCompletionState[task.id];
                const groupBadge = task.group ? `<span class="text-[10px] px-1.5 py-0.5 rounded border font-bold mr-1.5 ${window.getGroupColor(task.group)}">${task.group}組</span>` : '';
                return `
                <div class="daily-task-card bg-white rounded-xl p-3 border border-slate-200 shadow-sm relative transition-all ${done ? 'opacity-60 bg-slate-50' : ''}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 flex-1 min-w-0">
                            <input type="checkbox" ${done ? 'checked' : ''} onchange="window.toggleTask('${task.id}')" class="w-4 h-4 rounded text-blue-600 focus:ring-0 cursor-pointer">
                            <span class="font-mono text-xs font-bold text-slate-500">${task.start} - ${task.end}</span>
                            ${groupBadge}
                            <span class="font-bold text-sm text-slate-800 truncate ${done ? 'line-through text-slate-400' : ''}">${task.title}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        function loadLocalFastCache() {
            dailyScheduleData = getLocal('work_cache_schedule', []);
            taskCompletionState = getLocal('work_cache_task_states', {});
            taskExtrasState = getLocal('work_cache_daily_extras', {});
            taskArchiveState = getLocal('work_cache_daily_archive', {});
            subTaskCompletionState = getLocal('work_cache_subtask_states', {});
            galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
            galleryItems = getLocal('work_cache_gallery_items', []);
            splitHoursState = getLocal('work_cache_split_hours', {});
            futureMemos = getLocal('work_cache_future_memos', []);
            mapData = getLocal('work_cache_map_data', { points: {} });
            teamMembers = getLocal('work_cache_team_members', ['周靜儀', '蔣開紅', '何雪芬', '黃美濃', '林浩霆', '黃永超', '李頌瑤', '譚建安', '甘永寧', '陳麗嬋', '姚桂菊', '嚴飛菲']);
            crRecords = getLocal('coldRoomRecords', []);
            crItemTypes = getLocal('coldRoomTypes', ['海鮮', '肉類', '蔬果', '包裝冰', '其他']);
            if (!crItemTypes.includes('包裝冰')) crItemTypes.push('包裝冰');
            if (!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');

            if (!mapData.points || Object.keys(mapData.points).length === 0) {
                mapData.points = JSON.parse(JSON.stringify(defaultMapPoints));
            } else {
                Object.keys(defaultMapPoints).forEach(k => {
                    if (mapData.points[k]) { mapData.points[k].x = defaultMapPoints[k].x; mapData.points[k].y = defaultMapPoints[k].y; }
                });
            }
            memberSchedules = getLocal('work_cache_member_schedules', []);
            checkAndResetDailySchedule();
            window.applyTabVisibility();
            const curTab = localStorage.getItem('activeTab') || 'daily';
            window.switchTab(curTab);
        }

        function setupPureRealtimeSync() {
            if (!currentUser) return;
            const bindSync = (key, localKey, onUpdate) => {
                onSnapshot(cfgDoc(key), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        const val = data[Object.keys(data)[0]] !== undefined ? data[Object.keys(data)[0]] : data;
                        safeSetLocal(localKey, val);
                        onUpdate(data);
                    }
                }, console.error);
            };

            bindSync('schedule', 'work_cache_schedule', d => { if (d.tasks) { dailyScheduleData = d.tasks; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); } });
            bindSync('task_states', 'work_cache_task_states', d => { taskCompletionState = d.states || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('subtask_states', 'work_cache_subtask_states', d => { subTaskCompletionState = d.states || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('task_extras', 'work_cache_daily_extras', d => { taskExtrasState = d.extras || {}; window.renderDailySchedule(); if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false); });
            bindSync('gallery_categories', 'work_cache_gallery_categories', d => { galleryCategories = d.categories || galleryCategories; if (!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件'); window.renderGallery(); });
            bindSync('future_memos', 'work_cache_future_memos', d => { futureMemos = d.memos || []; if (!document.getElementById('memoPage')?.classList.contains('hidden')) window.renderMemos(); });
            bindSync('team_members', 'work_cache_team_members', d => { teamMembers = d.members || []; if (document.getElementById('scheduleManageModal')?.classList.contains('flex')) window.renderScheduleManager(); });
            bindSync('member_schedules', 'work_cache_member_schedules', d => {
                memberSchedules = d.schedules || [];
                if (d.date) safeSetLocal('work_cache_schedule_date', d.date);
                checkAndResetDailySchedule();
                if (!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
                if (!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
            });
            bindSync('tab_visibility', 'work_cache_tab_visibility', d => {
                if (d.visibility) {
                    tabVisibilityState = { ...defaultTabVisibility, ...d.visibility };
                    safeSetLocal('work_cache_tab_visibility', tabVisibilityState);
                    window.applyTabVisibility();
                }
            });
            bindSync('coldRoom', 'coldRoomRecords', d => {
                if (d.records) { crRecords = d.records; safeSetLocal('coldRoomRecords', crRecords); }
                if (d.types) { crItemTypes = d.types; safeSetLocal('coldRoomTypes', crItemTypes); }
                if (!document.getElementById('coldRoomPage')?.classList.contains('hidden')) window.crRenderList();
                window.checkColdRoomOverdueAlerts();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items'), (snap) => {
                let items = []; snap.forEach(d => items.push(d.data()));
                items.sort((a,b) => (b.id || '').localeCompare(a.id || ''));
                galleryItems = items;
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (document.getElementById('galleryPage') && !document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
                if (document.getElementById('dailySchedulePage') && !document.getElementById('dailySchedulePage').classList.contains('hidden')) window.renderDailySchedule();
            }, console.error);
        }

        loadLocalFastCache();
        initAuth();
    </script>
</body>
</html>
