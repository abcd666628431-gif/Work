<!DOCTYPE html>
<html lang="zh-TW" class="bg-[#f0ebe1]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圖庫管理系統 - 1000px 0.65畫質版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        html, body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0ebe1 !important; color: #334155; margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
        @keyframes flag-fade-in { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: flag-fade-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs", 
            authDomain: "work-eb62f.firebaseapp.com",
            projectId: "work-eb62f", 
            storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706", 
            appId: "1:428210130706:web:142207595423bdf661adcb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'default-app-id';
        let currentUser = null;

        // ==========================================
        // 🌟 1. 本地大容量資料庫 (IndexedDB)
        // ==========================================
        const IDB_NAME = 'Gallery_HD_Fast_DB_V4';
        const IDB_STORE = 'hd_images';

        const openIDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const idbSet = async (key, val) => {
            const idb = await openIDB();
            return new Promise((res, rej) => {
                const tx = idb.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(val, key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        };

        const idbGet = async (key) => {
            const idb = await openIDB();
            return new Promise((res, rej) => {
                const tx = idb.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get(key);
                req.onsuccess = () => res(req.result);
                req.onerror = () => rej(tx.error);
            });
        };

        const idbDel = async (key) => {
            const idb = await openIDB();
            return new Promise((res, rej) => {
                const tx = idb.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete(key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        };

        // ==========================================
        // 🌟 2. 輔助快取與工具函式
        // ==========================================
        const getLocal = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
        const safeSetLocal = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch(e) {} };
        const pad = (n) => String(n).padStart(2, '0');
        
        const yieldToMain = () => new Promise(resolve => setTimeout(resolve, 0));

        let galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
        let galleryItems = getLocal('work_cache_gallery_items', []);
        let currentGalleryCategory = '全部';
        window.pendingUploadImages = [];

        window.getNow = () => new Date();
        const getNowInputStrs = () => {
            const d = window.getNow();
            return { date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
        };

        window.showToast = (msg, isErr = false) => {
            const t = document.createElement('div');
            t.className = `fixed top-6 left-1/2 transform -translate-x-1/2 px-5 py-2.5 rounded-full shadow-lg text-xs font-bold z-[9999] transition-all duration-300 pointer-events-none ${isErr ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, -15px)'; setTimeout(() => t.remove(), 300); }, 2500);
        };

        window.setUploadProgress = (percent, text) => {
            const bar = document.getElementById('globalProgressBar');
            const container = document.getElementById('globalProgressContainer');
            const textEl = document.getElementById('globalProgressText');
            if (!bar || !container || !textEl) return;

            if (percent < 0) {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
                bar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
                textEl.textContent = text;
            }
        };

        // 🌟 3. 調整為 1000px 與 0.65 畫質的壓縮核心
        const compressImageOptimizedAsync = async (file, maxDim = 1000) => {
            let bitmap;
            try {
                if ('createImageBitmap' in window) {
                    bitmap = await createImageBitmap(file);
                }
            } catch (e) {
                bitmap = null;
            }

            return new Promise((resolve, reject) => {
                const processImg = (sourceWidth, sourceHeight, drawCallback) => {
                    let w = sourceWidth;
                    let h = sourceHeight;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    drawCallback(ctx, w, h);

                    // 🌟 畫質設定為 0.65
                    let quality = 0.65;
                    let result = canvas.toDataURL('image/webp', quality);

                    while (result.length > 800000 && quality > 0.25) {
                        quality -= 0.05;
                        result = canvas.toDataURL('image/webp', quality);
                    }

                    canvas.width = 0;
                    canvas.height = 0;
                    resolve(result);
                };

                if (bitmap) {
                    processImg(bitmap.width, bitmap.height, (ctx, w, h) => {
                        ctx.drawImage(bitmap, 0, 0, w, h);
                        bitmap.close();
                    });
                } else {
                    const r = new FileReader();
                    r.readAsDataURL(file);
                    r.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            processImg(img.width, img.height, (ctx, w, h) => ctx.drawImage(img, 0, 0, w, h));
                            img.src = '';
                        };
                        img.onerror = () => reject(new Error("圖片載入失敗"));
                    };
                    r.onerror = () => reject(new Error("檔案讀取失敗"));
                }
            });
        };

        window.handleGalleryUpload = async (input) => {
            const files = Array.from(input.files || []);
            if (!files.length) return;
            window.pendingUploadImages = [];

            const { time } = getNowInputStrs();
            const defaultCat = currentGalleryCategory === '全部' ? '未分類' : currentGalleryCategory;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                window.setUploadProgress(Math.round(((i + 1) / files.length) * 100), `正在優化第 ${i + 1} / ${files.length} 張圖片...`);
                
                await yieldToMain();

                try {
                    const src = await compressImageOptimizedAsync(file, 1000);
                    const tempId = 'img_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2, 4);

                    window.pendingUploadImages.push({
                        tempId,
                        src,
                        title: "",
                        time: time,
                        category: defaultCat
                    });
                } catch (e) {
                    console.error("處理失敗:", e);
                }
            }
            
            window.setUploadProgress(-1, "");
            input.value = '';

            if (window.pendingUploadImages.length > 0) {
                window.openUploadBatchModal();
            } else {
                window.showToast("無法讀取選取的圖片", true);
            }
        };

        window.renderGallery = () => {
            const sidebar = document.getElementById('gallerySidebar'), grid = document.getElementById('galleryGrid');
            if (!sidebar || !grid) return;
            const query = (document.getElementById('gallerySearchInput')?.value || '').trim().toLowerCase();

            sidebar.innerHTML = `
                <div class="p-2 border-b border-slate-200 w-full flex justify-between items-center bg-slate-100"><span class="text-[10px] font-bold text-slate-500">分類</span><button onclick="window.openCategoryManager()" class="text-slate-400 hover:text-blue-500 p-0.5"><i data-lucide="settings" class="w-3.5 h-3.5"></i></button></div>
                ${galleryCategories.map(cat => `<button onclick="window.setGalleryCategory('${cat}')" class="w-full text-center py-2 px-1 text-[11px] font-bold rounded-md transition-colors truncate ${currentGalleryCategory === cat ? 'bg-blue-500 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}">${cat}</button>`).join('')}`;

            const filtered = galleryItems.filter(item => (currentGalleryCategory === '全部' || item.category === currentGalleryCategory) && (!query || (item.title && item.title.toLowerCase().includes(query)) || (item.time && item.time.toLowerCase().includes(query))));

            const cameraSlotHtml = `
                <label class="relative group bg-white/80 hover:bg-blue-50/60 border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-xl overflow-hidden shadow-xs flex flex-col items-center justify-center cursor-pointer min-h-[175px] h-full active:scale-95 transition-all">
                    <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform shadow-xs">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-black text-slate-700 tracking-wider">拍照記錄</span>
                    <span class="text-[10px] font-bold text-slate-400 mt-0.5">點擊即時拍攝</span>
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            `;

            grid.innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                    ${cameraSlotHtml}
                    ${filtered.map(i => `
                        <div class="relative group bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                            <div class="px-2 py-1.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                <span class="text-[9.5px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 truncate max-w-[100px]">${i.category || '未分類'}</span>
                                <div class="flex items-center shrink-0">
                                    <button onclick="window.deleteGalleryItem('${i.id}')" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-colors active:scale-95" title="刪除圖片"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                            </div>
                            <div class="w-full h-28 bg-slate-100 overflow-hidden cursor-pointer" onclick="window.openFullscreenImg('${i.src}')">
                                <img src="${i.src}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${i.title || '圖片'}">
                            </div>
                            <div class="p-2 flex justify-between items-center bg-white border-t border-slate-100 text-xs gap-1.5">
                                <span class="text-[11px] text-slate-500 font-mono font-bold shrink-0 flex items-center">
                                    <i data-lucide="clock" class="w-3 h-3 mr-1 text-slate-400"></i>${i.time || '12:00'}
                                </span>
                                <span onclick="window.editGalleryItemTitle('${i.id}', event)" class="text-[11px] font-bold text-slate-800 truncate text-right flex-1 cursor-pointer hover:text-blue-600" title="點擊可修改名稱">${i.title || '無標題'}</span>
                            </div>
                        </div>`).join('')}
                </div>`;

            lucide.createIcons({ root: grid });
            lucide.createIcons({ root: sidebar });
        };

        window.setGalleryCategory = (c) => { currentGalleryCategory = c; window.renderGallery(); };

        window.openFullscreenImg = (src) => {
            const imgEl = document.getElementById('imageViewerImg');
            if (imgEl) imgEl.src = src;
            document.getElementById('imageViewer')?.classList.replace('hidden', 'flex');
            lucide.createIcons();
        };

        window.editGalleryItemTitle = (id, e) => {
            if (e) e.stopPropagation();
            const item = galleryItems.find(x => x.id === id);
            if (!item) return;
            const newTitle = prompt('請輸入新的圖片名稱：', item.title || '');
            if (newTitle !== null && newTitle.trim()) {
                item.title = newTitle.trim();
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id), item, { merge: true });
                window.renderGallery(); window.showToast('圖片名稱已更新');
            }
        };

        window.deleteGalleryItem = async (id) => {
            galleryItems = galleryItems.filter(i => i.id !== id);
            idbDel(id);
            safeSetLocal('work_cache_gallery_items', galleryItems);
            
            if (currentUser) {
                deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id));
            }
            window.renderGallery();
            window.showToast("已刪除圖片");
        };

        window.exportAllGalleryImages = async () => {
            if (!galleryItems || galleryItems.length === 0) return window.showToast('目前圖庫內沒有任何圖片可導出', true);
            window.showToast(`開始導出共 ${galleryItems.length} 張圖片，請稍候...`);
            for (let i = 0; i < galleryItems.length; i++) {
                const item = galleryItems[i];
                if (!item.src) continue;
                const safeName = (item.title && item.title.trim() ? item.title.trim() : `圖片_${i + 1}`).replace(/[\\/:*?"<>|]/g, '_');
                const link = document.createElement('a'); link.href = item.src; link.download = `${safeName}.webp`;
                document.body.appendChild(link); link.click(); link.remove();
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            window.showToast(`✅ 全部 ${galleryItems.length} 張圖片已導出完成！`);
        };

        window.openUploadBatchModal = () => {
            const modal = document.getElementById('uploadBatchModal');
            if (!modal) return;
            window.renderUploadBatchList();
            modal.classList.replace('hidden', 'flex');
            lucide.createIcons();
        };

        window.closeUploadBatchModal = () => {
            window.pendingUploadImages = [];
            document.getElementById('uploadBatchModal')?.classList.replace('flex', 'hidden');
        };

        window.updatePendingItemCategory = (tempId, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (item) item.category = val;
        };

        window.updatePendingItemTitle = (tempId, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (item) item.title = val.trim();
        };

        window.updatePendingItemTimePart = (tempId, part, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;
            let [h, m] = (item.time || '00:00').split(':');
            if (part === 'h') h = val; if (part === 'm') m = val;
            item.time = `${h}:${m}`;
        };

        window.setPendingItemTimeToNow = (tempId) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;
            const now = window.getNow();
            const h = pad(now.getHours()), m = pad(now.getMinutes());
            item.time = `${h}:${m}`;
            const hSelect = document.getElementById(`h-select-${tempId}`);
            const mSelect = document.getElementById(`m-select-${tempId}`);
            if (hSelect) hSelect.value = h;
            if (mSelect) mSelect.value = m;
        };

        window.removePendingUploadItem = (tempId) => {
            window.pendingUploadImages = window.pendingUploadImages.filter(x => x.tempId !== tempId);
            window.renderUploadBatchList();
        };

        window.renderUploadBatchList = () => {
            const list = document.getElementById('uploadBatchList');
            const cntEl = document.getElementById('uploadBatchCount');
            if (cntEl) cntEl.textContent = window.pendingUploadImages.length;
            if (!list) return;
            if (!window.pendingUploadImages.length) { window.closeUploadBatchModal(); return; }

            const selectableCategories = galleryCategories.filter(c => c !== '全部');

            list.innerHTML = window.pendingUploadImages.map((item) => {
                const [hStr, mStr] = (item.time || '00:00').split(':');
                return `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col space-y-2.5 relative group shadow-xs">
                    <div class="relative w-full h-36 bg-slate-200 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center">
                        <img src="${item.src}" class="w-full h-full object-cover">
                        <button onclick="window.removePendingUploadItem('${item.tempId}')" class="absolute top-2 right-2 text-slate-500 hover:text-red-500 p-1.5 rounded-full bg-white/90 shadow-md border border-slate-200 transition-colors active:scale-95" title="移除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">分類</label>
                        <select onchange="window.updatePendingItemCategory('${item.tempId}', this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500">
                            ${selectableCategories.map(cat => `<option value="${cat}" ${item.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                        </select>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-[155px] shrink-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">時間</label>
                            <div class="flex items-center justify-between bg-white border border-slate-300 rounded-lg px-2.5 py-1.5">
                                <div class="flex items-center font-mono font-bold text-sm text-slate-800 shrink-0">
                                    <select id="h-select-${item.tempId}" onchange="window.updatePendingItemTimePart('${item.tempId}', 'h', this.value)" class="bg-transparent text-center cursor-pointer outline-none hover:text-blue-600 font-mono font-bold">
                                        ${Array.from({length: 24}, (_, i) => `<option value="${pad(i)}" ${pad(i) === hStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}
                                    </select>
                                    <span class="text-slate-400 mx-1 font-bold">:</span>
                                    <select id="m-select-${item.tempId}" onchange="window.updatePendingItemTimePart('${item.tempId}', 'm', this.value)" class="bg-transparent text-center cursor-pointer outline-none hover:text-blue-600 font-mono font-bold">
                                        ${Array.from({length: 60}, (_, i) => `<option value="${pad(i)}" ${pad(i) === mStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}
                                    </select>
                                </div>
                                <button type="button" onclick="window.setPendingItemTimeToNow('${item.tempId}')" class="text-slate-400 hover:text-blue-500 active:scale-95 transition-all flex items-center text-[10px] font-bold ml-1 whitespace-nowrap shrink-0">
                                    <i data-lucide="clock" class="w-3 h-3 mr-0.5 shrink-0"></i>現在
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">名稱</label>
                            <input type="text" value="${item.title || ''}" oninput="window.updatePendingItemTitle('${item.tempId}', this.value)" placeholder="例如:R-099" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500 text-center h-[34px]">
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons({ root: list });
        };

        window.confirmBatchUpload = async () => {
            const itemsToUpload = [...window.pendingUploadImages];
            if (!itemsToUpload.length) return;

            window.closeUploadBatchModal();

            try {
                if (!currentUser || !db) throw new Error("系統尚未完成驗證授權，請重新整理頁面。");

                const total = itemsToUpload.length;
                const newDocs = [];
                const batch = writeBatch(db);
                const idbPromises = [];

                for (let i = 0; i < total; i++) {
                    const item = itemsToUpload[i];
                    const docId = item.tempId;

                    const percent = Math.round(((i + 1) / total) * 100);
                    window.setUploadProgress(percent, `正在儲存第 ${i + 1} / ${total} 張圖片 (${percent}%)`);

                    idbPromises.push(idbSet(docId, item.src));

                    const docData = {
                        id: docId,
                        src: item.src,
                        title: item.title || '無標題',
                        category: item.category || '未分類',
                        time: item.time || '12:00',
                        createdAt: Date.now()
                    };

                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', docId);
                    batch.set(docRef, docData);
                    newDocs.push(docData);
                }

                window.setUploadProgress(100, "正在提交至雲端資料庫...");
                await Promise.all([batch.commit(), ...idbPromises]);

                window.setUploadProgress(-1, "");

                const mergedMap = new Map();
                [...newDocs, ...galleryItems].forEach(item => {
                    if (item && item.id) mergedMap.set(item.id, item);
                });
                galleryItems = Array.from(mergedMap.values());
                galleryItems.sort((a,b) => (b.id || '').localeCompare(a.id || ''));

                safeSetLocal('work_cache_gallery_items', galleryItems);
                window.renderGallery();
                window.showToast(`✅ 成功上傳 ${newDocs.length} 張圖片！`);
            } catch (err) {
                window.setUploadProgress(-1, "");
                console.error("上傳錯誤:", err);
                window.showToast(`❌ 上傳失敗：${err.message}`, true);
            }
        };

        window.openCategoryManager = () => {
            const modal = document.getElementById('categoryManageModal'), list = document.getElementById('categoryManageList');
            if (!modal || !list) return;
            list.innerHTML = `
                <div class="flex gap-2 mb-3"><input type="text" id="newCatInput" placeholder="新增分類名稱..." class="flex-1 border border-slate-300 rounded-lg p-1.5 text-xs focus:outline-none focus:border-blue-500"><button onclick="window.addCategoryAction()" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold">新增</button></div>
                <div class="space-y-1.5">${galleryCategories.map((c, idx) => `
                    <div class="flex justify-between items-center p-2 bg-white rounded-lg border border-slate-200 text-xs font-bold text-slate-700">
                        <span>${c}</span>${!['全部', '任務附件', '未分類'].includes(c) ? `<button onclick="window.removeCategoryAction(${idx})" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : '<span class="text-[9px] text-slate-400 font-normal">系統預設</span>'}
                    </div>`).join('')}</div>`;
            modal.classList.replace('hidden', 'flex'); lucide.createIcons({ root: list });
        };

        window.closeCategoryManager = () => document.getElementById('categoryManageModal')?.classList.replace('flex', 'hidden');
        window.addCategoryAction = () => {
            const val = document.getElementById('newCatInput').value.trim();
            if (!val || galleryCategories.includes(val)) return;
            galleryCategories.push(val); safeSetLocal('work_cache_gallery_categories', galleryCategories);
            if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };
        window.removeCategoryAction = (idx) => {
            galleryCategories.splice(idx, 1); safeSetLocal('work_cache_gallery_categories', galleryCategories);
            if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };

        async function initAuthAndSync() {
            try { await signInAnonymously(auth); } catch(e) {}
            onAuthStateChanged(auth, (user) => {
                currentUser = user; if (!user) return;
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), (snap) => {
                    if (snap.exists() && snap.data().categories) {
                        galleryCategories = snap.data().categories; safeSetLocal('work_cache_gallery_categories', galleryCategories); window.renderGallery();
                    }
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items'), (snap) => {
                    let items = []; snap.forEach(d => items.push(d.data()));
                    
                    const mergedMap = new Map();
                    items.forEach(item => { if (item && item.id) mergedMap.set(item.id, item); });
                    galleryItems = Array.from(mergedMap.values());
                    
                    galleryItems.sort((a,b) => (b.id || '').localeCompare(a.id || ''));
                    safeSetLocal('work_cache_gallery_items', galleryItems);
                    window.renderGallery();
                });
            });
        }

        window.renderGallery(); initAuthAndSync();
    </script>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 bg-[#f0ebe1]">
    <div class="w-full max-w-[430px] h-[910px] max-h-[100vh] sm:max-h-[96vh] bg-[#fdfbf7] sm:rounded-[2.5rem] shadow-2xl sm:border-[6px] border-[#d6d0c4] overflow-hidden relative flex flex-col mx-auto my-auto">
        
        <div id="globalProgressContainer" class="hidden absolute top-0 left-0 right-0 z-[300] bg-slate-900/95 backdrop-blur-md p-3 text-white border-b border-blue-500 shadow-2xl transition-all">
            <div class="flex justify-between items-center text-xs font-bold mb-1.5">
                <span id="globalProgressText" class="text-blue-300">正在處理...</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="globalProgressBar" class="bg-blue-500 h-full w-0 transition-all duration-200"></div>
            </div>
        </div>

        <header class="bg-[#fdfbf7]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#e5dfd3] p-4 pt-6 shadow-xs shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-blue-500 text-white flex items-center justify-center shadow-xs"><i data-lucide="image" class="w-4 h-4"></i></div>
                    <h1 class="text-lg text-slate-800 tracking-wider font-black">圖庫管理系統</h1>
                </div>
                <button type="button" onclick="window.exportAllGalleryImages()" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-xs font-bold tracking-wide transition-all shadow-xs" title="一次導出圖庫所有圖片">
                    <i data-lucide="download" class="w-3.5 h-3.5 mr-1"></i> 導出全部
                </button>
            </div>
        </header>

        <main class="flex-1 min-h-0 flex flex-col relative z-10 bg-[#fdfbf7]">
            <div class="p-2.5 border-b border-[#e6e2d6] flex items-center space-x-2 bg-white shrink-0 shadow-xs z-20 relative">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                    <input type="text" id="gallerySearchInput" placeholder="搜尋圖片..." oninput="window.renderGallery()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-2.5 py-1.5 text-xs text-slate-700 placeholder-slate-400 focus:border-blue-400 focus:bg-white focus:outline-none tracking-wide text-center">
                </div>
                <label class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-xs font-bold tracking-wide transition-all shadow-xs shrink-0" title="點擊直接拍照">
                    <i data-lucide="camera" class="w-3.5 h-3.5 mr-1"></i> 拍照
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
                <label class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-xs font-bold tracking-wide transition-colors shadow-xs shrink-0" title="選取相簿現有圖片">
                    <i data-lucide="upload" class="w-3.5 h-3.5 mr-1"></i> 上傳
                    <input type="file" accept="image/*" multiple class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            </div>
            <div class="flex flex-1 min-h-0 overflow-hidden relative z-10">
                <div class="w-[70px] shrink-0 border-r border-[#e6e2d6] bg-[#f4f1eb] overflow-y-auto flex flex-col items-center space-y-1.5 scrollbar-hide" id="gallerySidebar"></div>
                <div class="flex-1 p-2.5 overflow-y-auto bg-[#fdfbf7] relative scrollbar-hide" id="galleryGrid"></div>
            </div>
        </main>
    </div>

    <!-- 彈窗群 -->
    <div id="uploadBatchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[260] hidden flex-col items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-[420px] shadow-2xl relative max-h-[88vh] flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-3 mb-2 border-b border-slate-100 shrink-0">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="images" class="w-5 h-5"></i></div>
                    <h3 class="font-bold text-base text-slate-800 tracking-wide">確認上傳圖片</h3>
                </div>
                <button onclick="window.closeUploadBatchModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-2.5 text-center text-xs font-bold text-blue-700 shrink-0 mb-3">
                📸 已選取 <span id="uploadBatchCount" class="text-blue-900 font-black text-sm">0</span> 張圖片
            </div>
            <div id="uploadBatchList" class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-hide mb-3"></div>
            <div class="flex justify-end space-x-2.5 pt-3 border-t border-slate-100 shrink-0">
                <button onclick="window.closeUploadBatchModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-colors active:scale-95">取消</button>
                <button onclick="window.confirmBatchUpload()" class="px-5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-xs transition-colors active:scale-95 flex items-center"><i data-lucide="check" class="w-4 h-4 mr-1.5"></i>確認發布</button>
            </div>
        </div>
    </div>

    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col items-center justify-center p-4">
        <button onclick="document.getElementById('imageViewer').classList.replace('flex', 'hidden')" class="absolute top-6 right-6 text-white bg-slate-800/80 p-2 rounded-full active:scale-95 shadow-lg border border-slate-600 hover:bg-red-600 transition-colors" title="關閉"><i data-lucide="x" class="w-6 h-6"></i></button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" />
    </div>

    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="settings-2" class="w-4 h-4 mr-2 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[55vh] bg-[#fdfbf7] space-y-2 scrollbar-hide"></div>
        </div>
    </div>
</body>
</html>
