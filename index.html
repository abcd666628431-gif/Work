        .dark-mode .text-slate-500 { color: #475569 !important; }
        .dark-mode .border-slate-200, .dark-mode .border-slate-300, .dark-mode .border-\[\#d6d0c4\] { border-color: #334155 !important; }

        .dark-mode #tlBigClock { background-color: rgba(30, 41, 59, 0.9) !important; color: #f8fafc !important; border-color: #334155 !important; }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs", authDomain: "work-eb62f.firebaseapp.com",
            databaseURL: "https://work-eb62f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "work-eb62f", storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706", appId: "1:428210130706:web:142207595423bdf661adcb"
        };

        const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let currentUser = null;

        const getLocal = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
        const safeSetLocal = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch(e) {} };
        const cfgDoc = (key) => doc(db, 'artifacts', appId, 'public', 'data', 'config', key);
        const syncConfig = (key, data, merge = false) => { if (currentUser) setDoc(cfgDoc(key), data, { merge }); };
        const pad = (n) => String(n).padStart(2, '0');

        let dailyScheduleData = [], taskCompletionState = {}, taskExtrasState = {}, taskArchiveState = {}, subTaskCompletionState = {}, expandedTasksState = {};
        let galleryCategories = ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他'], galleryItems = [], futureMemos = [];
        const defaultTabVisibility = { daily: true, timeline: true, memo: true, map: true, gallery: true, coldRoom: true };
        let tabVisibilityState = getLocal('work_cache_tab_visibility', defaultTabVisibility);

        const tabMetadata = [
            { id: 'daily', name: '排程', btnId: 'tabDaily', pageId: 'dailySchedulePage', icon: 'clipboard-list' },
            { id: 'timeline', name: '動態', btnId: 'tabTimeline', pageId: 'timelinePage', icon: 'activity' },
            { id: 'memo', name: '備忘', btnId: 'tabMemo', pageId: 'memoPage', icon: 'calendar-clock' },
            { id: 'map', name: '地圖', btnId: 'tabMap', pageId: 'mapPage', icon: 'map' },
            { id: 'gallery', name: '圖庫', btnId: 'tabGallery', pageId: 'galleryPage', icon: 'image' },
            { id: 'coldRoom', name: '雪房', btnId: 'tabColdRoom', pageId: 'coldRoomPage', icon: 'snowflake' }
        ];

        const defaultMapPoints = {
            'pt_1': { name: '客服室', x: 50, y: 16 }, 'pt_2': { name: '一樓大清點', x: 0, y: 0 },
            'pt_3': { name: '花園仔', x: 27.5, y: 64 }, 'pt_4': { name: '魚檔', x: 72.5, y: 64 },
            'pt_5': { name: '整體巡邏', x: 50, y: 88 }, 'pt_6': { name: '地面層 大清點', x: 0, y: 0 },
            'pt_7': { name: '休息中', x: 0, y: 0 }
        };
        let mapData = { points: JSON.parse(JSON.stringify(defaultMapPoints)) }, memberSchedules = [], teamMembers = [];
        let activeGridMember = null, isEditingMembers = false, isGridDragging = false, gridDragAction = null, splitHoursState = {};
        window.lastTouchedEl = null;

        const memberColorPalettes = [
            { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-300', activeBg: 'bg-rose-500' },
            { bg: 'bg-sky-100', text: 'text-sky-700', border: 'border-sky-300', activeBg: 'bg-sky-500' },
            { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-300', activeBg: 'bg-emerald-500' },
            { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', activeBg: 'bg-amber-500' },
            { bg: 'bg-violet-100', text: 'text-violet-700', border: 'border-violet-300', activeBg: 'bg-violet-500' },
            { bg: 'bg-teal-100', text: 'text-teal-700', border: 'border-teal-300', activeBg: 'bg-teal-500' },
            { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300', activeBg: 'bg-orange-500' },
            { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-300', activeBg: 'bg-indigo-500' },
            { bg: 'bg-pink-100', text: 'text-pink-700', border: 'border-pink-300', activeBg: 'bg-pink-500' },
            { bg: 'bg-lime-100', text: 'text-lime-800', border: 'border-lime-300', activeBg: 'bg-lime-500' },
            { bg: 'bg-cyan-100', text: 'text-cyan-800', border: 'border-cyan-300', activeBg: 'bg-cyan-500' },
            { bg: 'bg-fuchsia-100', text: 'text-fuchsia-700', border: 'border-fuchsia-300', activeBg: 'bg-fuchsia-500' }
        ];

        window.getMemberColorClass = (name) => {
            if (!name) return { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', activeBg: 'bg-blue-500' };
            let seed = 0; for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
            return memberColorPalettes[Math.abs(seed) % memberColorPalettes.length];
        };

        window.openAsPopout = () => {
            const w = 480, h = 950, l = Math.max(0, (window.screen.width - w) / 2), t = Math.max(0, (window.screen.height - h) / 2);
            window.open(window.location.href, 'WorkRecordPopup', `width=${w},height=${h},left=${l},top=${t},menubar=no,status=no,toolbar=no,location=no,scrollbars=no,resizable=yes`);
        };

        let crRecords = [], crItemTypes = ['海鮮', '肉類', '蔬果', '包裝冰', '其他'], crCurrentSelectedType = '', crCurrentTab = 'active';
        const CR_TIME_LIMIT_MS = 24 * 60 * 60 * 1000;
        let actionHistory = [], currentGalleryCategory = '全部', timeOffset = 0, isFastForwarding = false, simInterval = null, timelineUpdateInterval;
        window.isEditMode = false;
        window.getNow = () => new Date(Date.now() + timeOffset);

        function parseTime(tStr) {
            const d = window.getNow();
            if (!tStr || typeof tStr !== 'string' || !tStr.includes(':')) {
                d.setHours(0, 0, 0, 0);
                return d;
            }
            const [h, m] = tStr.split(':').map(Number);
            d.setHours(isNaN(h) ? 0 : h, isNaN(m) ? 0 : m, 0, 0);
            return d;
        }

        function calculateTaskStatus(startStr, endStr) {
            const now = window.getNow(), s = parseTime(startStr), e = parseTime(endStr);
            const fmt = (diff) => `${Math.floor(diff/60) > 0 ? Math.floor(diff/60) + '小時' : ''}${diff % 60}分`;
            if (now < s) return { state: 'waiting', text: `未開始 (約 ${fmt(Math.floor((s - now) / 60000))}後)` };
            if (now >= s && now <= e) return { state: 'active', text: `進行中 (剩餘 ${fmt(Math.floor((e - now) / 60000))})` };
            return { state: 'overdue', text: `已結束 (超時 ${fmt(Math.floor((now - e) / 60000))})` };
        }

        window.crNotifiedSet = new Set();
        window.memoNotifiedSet = new Set();
        let crAudioCtx = null, crSoundIntervalId = null, crBannerTimeoutId = null;

        window.playAlertSound = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                const ctx = new AudioCtx();
                crAudioCtx = ctx;

                const playDualBeep = () => {
                    if (!ctx || ctx.state === 'closed') return;
                    const now = ctx.currentTime;
                    const o1 = ctx.createOscillator(), g1 = ctx.createGain();
                    o1.type = 'sine'; o1.frequency.setValueAtTime(880, now);
                    g1.gain.setValueAtTime(0.3, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    o1.connect(g1); g1.connect(ctx.destination);
                    o1.start(now); o1.stop(now + 0.18);

                    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
                    o2.type = 'sine'; o2.frequency.setValueAtTime(1174.66, now + 0.22);
                    g2.gain.setValueAtTime(0.3, now + 0.22); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
                    o2.connect(g2); g2.connect(ctx.destination);
                    o2.start(now + 0.22); o2.stop(now + 0.48);
                };

                playDualBeep();
                crSoundIntervalId = setInterval(playDualBeep, 1200);
                setTimeout(() => { if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; } }, 10000);
            } catch (e) {}
        };

        window.stopOverdueAlarm = () => {
            if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
            if (crBannerTimeoutId) { clearTimeout(crBannerTimeoutId); crBannerTimeoutId = null; }
            if (crAudioCtx && crAudioCtx.state !== 'closed') { try { crAudioCtx.close(); } catch(e){} }
            const banner = document.getElementById('crOverdueAlertBanner');
            if (banner) {
                banner.style.opacity = '0'; banner.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => banner.classList.add('hidden'), 300);
            }
        };

        window.showOverdueAlertBanner = (itemsText, title = "⚠️ 雪房存貨超時警報！") => {
            let banner = document.getElementById('crOverdueAlertBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'crOverdueAlertBanner';
                banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[10000] w-[92%] max-w-[390px] bg-red-600 text-white p-3.5 rounded-2xl shadow-2xl flex items-center justify-between border-2 border-white/90 backdrop-blur-md transition-all duration-300 animate-bounce cursor-pointer';
                banner.onclick = window.stopOverdueAlarm;
                document.body.appendChild(banner);
            }
            banner.innerHTML = `
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 animate-pulse"><i data-lucide="bell-ring" class="w-4 h-4 text-white"></i></div>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-black tracking-wide flex items-center space-x-1.5"><span>${title}</span><span class="bg-white text-red-600 text-[9px] px-1.5 py-0.2 rounded font-bold">10秒</span></div>
                        <div class="text-[11px] text-red-100 font-bold truncate mt-0.5">${itemsText}</div>
                    </div>
                </div>
                <button onclick="event.stopPropagation(); window.stopOverdueAlarm();" class="ml-2 bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-lg text-[10px] font-black shrink-0 border border-white/40 active:scale-95 transition-all">關閉/靜音</button>`;
            banner.style.opacity = '1'; banner.style.transform = 'translate(-50%, 0)'; banner.classList.remove('hidden');
            lucide.createIcons({ root: banner });
            if (crBannerTimeoutId) clearTimeout(crBannerTimeoutId);
            crBannerTimeoutId = setTimeout(window.stopOverdueAlarm, 10000);
        };

        window.toggleNotificationState = async () => {
            let isEnabled = getLocal('work_cache_cr_notify', false);
            if (!isEnabled) {
                if ("Notification" in window) {
                    const perm = await Notification.requestPermission();
                    if (perm === "granted") {
                        safeSetLocal('work_cache_cr_notify', true);
                        window.showToast("✅ 已開啟超時與備忘推播提醒（響10秒）！");
                        window.playAlertSound();
                    } else {
                        safeSetLocal('work_cache_cr_notify', false);
                        window.showToast("❌ 瀏覽器通知未授權，無法開啟", true);
                    }
                } else {
                    safeSetLocal('work_cache_cr_notify', true);
                    window.showToast("✅ 已開啟站內雙頻提示音（響10秒）！");
                    window.playAlertSound();
                }
            } else {
                safeSetLocal('work_cache_cr_notify', false);
                window.stopOverdueAlarm();
                window.showToast("🔕 已關閉提醒");
            }
            window.crUpdateNotificationBtn();
        };

        window.crUpdateNotificationBtn = () => {
            const isEnabled = getLocal('work_cache_cr_notify', false);
            ['crNotifyToggleBtn', 'memoNotifyToggleBtn'].forEach(btnId => {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                if (isEnabled) {
                    btn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-emerald-100 border border-emerald-300 text-emerald-700 shadow-xs hover:bg-emerald-200 transition-all active:scale-95 cursor-pointer";
                    btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span><i data-lucide="bell" class="w-3.5 h-3.5 text-emerald-600 pointer-events-none"></i><span class="text-[10px] font-black">提醒中</span>`;
                    btn.title = "推播提醒已開啟，點擊可關閉";
                } else {
                    btn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-400 shadow-xs hover:bg-slate-200 transition-all active:scale-95 cursor-pointer";
                    btn.innerHTML = `<i data-lucide="bell-off" class="w-3.5 h-3.5 text-slate-400 pointer-events-none"></i><span class="text-[10px] font-bold">靜音</span>`;
                    btn.title = "點擊開啟推播通知與雙頻提示音";
                }
            });
            lucide.createIcons();
        };

        window.checkColdRoomOverdueAlerts = () => {
            if (!getLocal('work_cache_cr_notify', false)) return;
            const now = window.getNow().getTime();
            let newOverdueList = [];
            crRecords.forEach(r => {
                if (r.status === 'active' && r.type !== '包裝冰') {
                    if (now > (r.depositTime + CR_TIME_LIMIT_MS) && !window.crNotifiedSet.has(r.id)) {
                        window.crNotifiedSet.add(r.id);
                        newOverdueList.push(r);
                        if ("Notification" in window && Notification.permission === "granted") {
                            const diff = now - (r.depositTime + CR_TIME_LIMIT_MS);
                            const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
                            try { new Notification("⚠️ 雪房存貨超時警報！", { body: `檔主【${r.tenant}】(${r.type}) 存放已超時 ${h > 0 ? h+'小時 ' : ''}${m}分！` }); } catch(e){}
                        }
                    }
                }
            });
            if (newOverdueList.length > 0) {
                window.playAlertSound();
                window.showOverdueAlertBanner(newOverdueList.map(x => `${x.tenant}(${x.type})`).join('、'), "⚠️ 雪房存貨超時警報！");
            }
        };

        window.checkMemoAlerts = () => {
            if (!getLocal('work_cache_cr_notify', false)) return;
            const now = window.getNow().getTime();
            let newDueMemos = [];
            futureMemos.forEach(m => {
                const targetTime = new Date(`${m.date}T${m.time || '00:00'}`).getTime();
                if (now >= targetTime && !window.memoNotifiedSet.has(m.id)) {
                    window.memoNotifiedSet.add(m.id);
                    newDueMemos.push(m);
                    if ("Notification" in window && Notification.permission === "granted") {
                        try {
                            new Notification("📌 備忘任務到期提醒！", {
                                body: `備忘任務【${m.title}】時間已到！${m.content ? '內容: ' + m.content : ''}`
                            });
                        } catch(e){}
                    }
                }
            });
            if (newDueMemos.length > 0) {
                window.playAlertSound();
                window.showOverdueAlertBanner(newDueMemos.map(x => x.title).join('、'), "📌 備忘任務到期提醒！");
            }
        };

        window.toggleSettingsMenu = (e) => { if (e) e.stopPropagation(); document.getElementById('settingsDropdown')?.classList.toggle('hidden'); };
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('settingsDropdown'), btn = document.getElementById('settingsMenuBtn');
            if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && e.target !== btn) dropdown.classList.add('hidden');
        });

        window.applyTabVisibility = () => {
            tabMetadata.forEach(tab => {
                const btn = document.getElementById(tab.btnId), isVisible = tabVisibilityState[tab.id] !== false;
                if (btn) { btn.style.display = isVisible ? '' : 'none'; btn.classList.toggle('hidden', !isVisible); }
            });
            const cur = localStorage.getItem('activeTab') || 'daily';
            if (tabVisibilityState[cur] === false) {
                const first = tabMetadata.find(t => tabVisibilityState[t.id] !== false);
                if (first) { localStorage.setItem('activeTab', first.id); window.switchTab(first.id); }
            }
        };

        window.openTabVisibilityModal = () => {
            document.getElementById('settingsDropdown')?.classList.add('hidden');
            const list = document.getElementById('tabVisibilityList');
            if (!list) return;
            list.innerHTML = tabMetadata.map(t => `
                <label class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 cursor-pointer transition-colors select-none">
                    <div class="flex items-center space-x-2"><i data-lucide="${t.icon}" class="w-4 h-4 text-slate-500"></i><span class="text-xs font-bold text-slate-800">${t.name}</span></div>
                    <input type="checkbox" data-tab-id="${t.id}" ${tabVisibilityState[t.id] !== false ? 'checked' : ''} class="tab-vis-checkbox w-4 h-4 rounded text-blue-600 focus:ring-0 cursor-pointer">
                </label>`).join('');
            lucide.createIcons({ root: list });
            document.getElementById('tabVisibilityModal')?.classList.replace('hidden', 'flex');
        };

        window.closeTabVisibilityModal = () => document.getElementById('tabVisibilityModal')?.classList.replace('flex', 'hidden');

        window.saveTabVisibility = () => {
            const boxes = document.querySelectorAll('.tab-vis-checkbox');
            let hasOne = false, newState = {};

        window.updateMapSimulation = () => {
            if (document.getElementById('mapPage')?.classList.contains('hidden')) return;

            if (!container) return;
            const now = window.getNow(), nowTime = now.getTime(), curMins = now.getHours() * 60 + now.getMinutes();
            let activeMembers = {}, incomingMembers = {};

            memberSchedules.forEach(sched => {
                const s = parseTime(sched.start).getTime(), e = parseTime(sched.end).getTime();
                if (nowTime >= s && nowTime <= e) {
                    activeMembers[sched.name] = sched.locationId;
                    const [endH, endM] = sched.end.split(':').map(Number);
                    const remainMins = (endH * 60 + endM) - curMins;
                    if (remainMins > 0 && remainMins <= 10) {
                        const nextSched = memberSchedules.find(ns => ns.locationId === sched.locationId && ns.name !== sched.name && ns.start === sched.end);
                        if (nextSched) {
                            incomingMembers[sched.locationId] = incomingMembers[sched.locationId] || [];
                            if (!incomingMembers[sched.locationId].includes(nextSched.name)) incomingMembers[sched.locationId].push(nextSched.name);
                        }
                    }
                }
                if (sched.locationId === 'pt_7') {
                    const [sH, sM] = sched.start.split(':').map(Number);
                    const diffToRest = (sH * 60 + sM) - curMins;
                    if (diffToRest > 0 && diffToRest <= 15) {
                        incomingMembers['pt_7'] = incomingMembers['pt_7'] || [];
                        if (!incomingMembers['pt_7'].includes(sched.name)) incomingMembers['pt_7'].push(sched.name);
                    }
                }
            });

            let locGroups = {};
            Object.entries(activeMembers).forEach(([n, loc]) => { (locGroups[loc] = locGroups[loc] || []).push(n); });

            ['pt_2', 'pt_6', 'pt_7'].forEach(locId => {
                const names = locGroups[locId] || [], incoming = incomingMembers[locId] || [];
                const card = document.getElementById(`station-${locId}`);
                if (card) {
                    let box = card.querySelector('.ext-members-box') || document.createElement('div');
                    if (!box.parentNode) { box.className = 'ext-members-box flex flex-wrap items-center justify-center gap-1.5 -mt-1 pt-0'; card.appendChild(box); }
                    else box.innerHTML = '';

                    names.forEach(n => box.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col items-center justify-center m-0.5">
                            <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center"><i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${n}</div>
                            <div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div>
                        </div>`));
                    incoming.forEach(n => box.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col items-center justify-center m-0.5 animate-flag-in">
                            <div class="bg-amber-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/90 flex items-center shadow-amber-500/30"><i data-lucide="user-plus" class="w-3 h-3 mr-1 text-white"></i>待:${n}</div>
                            <div class="w-5 h-5 bg-amber-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div>
                        </div>`));

            });

            const staffStatusListEl = document.getElementById('todayDutyStaffList');
            if (staffStatusListEl) {
                const uniqueScheduled = Array.from(new Set(memberSchedules.filter(s => s.name && !s.name.includes('休')).map(s => s.name)));
                if (uniqueScheduled.length === 0) {
                    staffStatusListEl.innerHTML = '<div class="text-[10px] text-slate-400 text-center py-3 font-bold">今日尚無排班資料</div>';
                } else {
                    const memberDutyList = uniqueScheduled.map(name => {
                        const shifts = memberSchedules.filter(s => s.name === name);
                        const earliest = shifts.reduce((min, s) => s.start < min ? s.start : min, "23:59");
                        const latest = shifts.reduce((max, s) => s.end > max ? s.end : max, "00:00");
                        const [esH, esM] = earliest.split(':').map(Number), [leH, leM] = latest.split(':').map(Number);
                        const eMins = esH * 60 + esM, lMins = leH * 60 + leM, col = window.getMemberColorClass(name);
                        let rank = 3, subSort = lMins, statusBadge = '';

                        if (eMins <= curMins && curMins < lMins) {
                            rank = 1; const diff = lMins - curMins; subSort = diff;
                            const h = Math.floor(diff / 60), m = diff % 60;
                            statusBadge = `<div class="bg-emerald-50 border border-emerald-300 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-md flex items-center shadow-xs whitespace-nowrap"><i data-lucide="timer" class="w-3 h-3 mr-1 text-emerald-600"></i>剩 ${h>0?h+'小時':''}${m}分 下班</div>`;
                        } else if (curMins < eMins) {
                            rank = 2; const diff = eMins - curMins; subSort = diff;
                            const h = Math.floor(diff / 60), m = diff % 60;
                            statusBadge = `<div class="bg-amber-50 border border-amber-300 text-amber-700 font-bold text-[10px] px-2 py-0.5 rounded-md flex items-center shadow-xs whitespace-nowrap"><i data-lucide="clock" class="w-3 h-3 mr-1 text-amber-600"></i>再過 ${h>0?h+'小時':''}${m}分 上班</div>`;
                        } else {
                            rank = 3; subSort = -lMins;
                            statusBadge = `<div class="bg-slate-100 border border-slate-200 text-slate-400 font-medium text-[10px] px-2 py-0.5 rounded-md flex items-center whitespace-nowrap"><i data-lucide="check" class="w-3 h-3 mr-1 text-slate-400"></i>下班了</div>`;
                        }
                        return { name, rank, subSort, col, statusBadge };
                    });

                    memberDutyList.sort((a, b) => a.rank - b.rank || a.subSort - b.subSort || a.name.localeCompare(b.name));
                    staffStatusListEl.innerHTML = memberDutyList.map(item => `
                        <div class="bg-white border border-slate-200/80 rounded-lg p-1.5 px-2.5 flex items-center justify-between shadow-xs hover:border-slate-300 transition-colors">
                            <div class="flex items-center min-w-0 pr-2">
                                <div class="w-2 h-2 rounded-full ${item.col.activeBg} mr-2 shrink-0"></div>
                                <span class="font-black text-[11px] text-slate-800 tracking-wide truncate">${item.name}</span>
                            </div>
                            <div class="shrink-0">${item.statusBadge}</div>
                        </div>`).join('');
                }
            }

            document.querySelectorAll('.member-dynamic-marker').forEach(el => el.dataset.active = "false");
            Object.entries(locGroups).forEach(([locId, names]) => {
                if (['pt_2', 'pt_6', 'pt_7'].includes(locId) || !mapData.points[locId]) return;
                const loc = mapData.points[locId], incoming = incomingMembers[locId] || [];

                names.forEach((name, idx) => {
                    let marker = document.getElementById(`dyn-marker-${name}-${locId}-current`) || document.createElement('div');
                    marker.id = `dyn-marker-${name}-${locId}-current`;
                    marker.innerHTML = `
                        <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-lg whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center"><i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${name}</div>
                        <div class="relative flex items-center justify-center"><div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md z-10 relative flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div><div class="absolute w-8 h-8 bg-blue-400/40 rounded-full radar-slow z-0"></div></div>`;
                    if (marker.parentNode !== container) container.appendChild(marker);
                    const off = names.length > 1 ? (idx - (names.length - 1) / 2) * 75 : 0;

                    marker.style.animationDelay = `${(seed % 5) * -3}s`; marker.dataset.active = "true";
                });

                incoming.forEach((name, idx) => {
                    let marker = document.getElementById(`dyn-marker-${name}-${locId}-incoming`) || document.createElement('div');
                    marker.id = `dyn-marker-${name}-${locId}-incoming`;
                    marker.innerHTML = `
                        <div class="bg-amber-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-lg whitespace-nowrap mb-1 tracking-wider border border-white/90 flex items-center shadow-amber-500/30"><i data-lucide="user-plus" class="w-3 h-3 mr-1 text-white"></i>待: ${name}</div>
                        <div class="relative flex items-center justify-center"><div class="w-5 h-5 bg-amber-500 rounded-full border-[2px] border-white shadow-md z-10 relative flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 text-white"></i></div><div class="absolute w-8 h-8 bg-amber-400/40 rounded-full radar-slow z-0"></div></div>`;
                    if (marker.parentNode !== container) container.appendChild(marker);
                    const off = incoming.length > 1 ? (idx - (incoming.length - 1) / 2) * 55 : 0;
                    marker.style.left = `calc(${loc.x}% + ${off}px - 35px)`;
                    let topOff = locId === 'pt_1' ? '-45px' : (locId === 'pt_3' || locId === 'pt_4' ? '-90px' : '-70px');
                    marker.style.top = `calc(${loc.y}% + ${topOff})`;
                    marker.className = `member-dynamic-marker absolute flex flex-col items-center justify-center transform -translate-x-1/2 pointer-events-none z-20 drop-shadow-xl animate-flag-in`;
                    marker.dataset.active = "true";
                });
            });

            lucide.createIcons();
            document.querySelectorAll('.member-dynamic-marker[data-active="false"]').forEach(el => el.remove());
        };

        window.openScheduleManager = () => { window.renderScheduleManager(); document.getElementById('scheduleManageModal')?.classList.replace('hidden', 'flex'); };

                if (!div) return;
                if (isEraser) div.className = `px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-all flex items-center justify-center ${sel ? 'bg-pink-500 text-white border-pink-600 shadow-md scale-105' : 'bg-white text-pink-600 border-pink-200 hover:border-pink-400 hover:text-pink-600 shadow-sm'}`;

        const applyGridAction = (el) => {
            if (gridDragAction === 'erase') el.value = '';
            else {
                let names = (el.value || '').split(/[\n\s]+/).filter(Boolean);
                if (gridDragAction === 'add' && !names.includes(activeGridMember)) names.push(activeGridMember);
                else if (gridDragAction === 'remove') names = names.filter(n => n !== activeGridMember);
                el.value = names.join('\n');
            }
        };

        window.startGridDrag = (el) => {
            if (!activeGridMember) return;
            el.blur(); isGridDragging = true;
            if (activeGridMember === 'ERASER') { gridDragAction = 'erase'; el.value = ''; }
            else {
                let names = (el.value || '').split(/[\n\s]+/).filter(Boolean);
                gridDragAction = names.includes(activeGridMember) ? 'remove' : 'add';
                applyGridAction(el);

        const compressImageSafeAsync = (file, maxDim = 1920) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/webp', 0.85));
                };
                img.onerror = () => reject(new Error("解析失敗"));
            };
            r.onerror = () => reject(new Error("讀取失敗"));
        });

        window.pendingUploadImages = [];

        window.handleGalleryUpload = async (input) => {
            const files = Array.from(input.files || []);
            if (!files.length) return;
            window.showToast(`正在讀取圖片...`);
            window.pendingUploadImages = [];

            const { time } = getNowInputStrs();
            const defaultCat = currentGalleryCategory === '全部' ? '未分類' : currentGalleryCategory;

            for (const f of files) {
                try {
                    const src = await compressImageSafeAsync(f);
                    window.pendingUploadImages.push({
                        tempId: 'tmp_' + Date.now() + Math.random().toString(36).substr(2, 4),
                        src,
                        title: "",
                        time: time,
                        category: defaultCat
                    });
                } catch(e) {}
            }
            input.value = '';
            if (window.pendingUploadImages.length > 0) {
                window.openUploadBatchModal();
            } else {
                window.showToast("無法讀取選取的圖片", true);
            }
        };

        window.openFullscreenImg = (src) => {
            const imgEl = document.getElementById('imageViewerImg');
            if (imgEl) imgEl.src = src;
            document.getElementById('imageViewer')?.classList.replace('hidden', 'flex');
        };

        window.editGalleryItemTitle = (id, e) => {
            if (e) e.stopPropagation();
            const item = galleryItems.find(x => x.id === id);
            if (!item) return;
            const newTitle = prompt('請輸入新的圖片名稱：', item.title || '');
            if (newTitle !== null && newTitle.trim()) {
                item.title = newTitle.trim();
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', item.id), item);
                window.renderGallery();
                window.showToast('圖片名稱已更新');
            }
        };

        window.renderGallery = () => {
            const sidebar = document.getElementById('gallerySidebar'), grid = document.getElementById('galleryGrid');
            if (!sidebar || !grid) return;
            const query = (document.getElementById('gallerySearchInput')?.value || '').trim().toLowerCase();

            sidebar.innerHTML = `
                <div class="p-2 border-b border-slate-200 w-full flex justify-between items-center bg-slate-100"><span class="text-[10px] font-bold text-slate-500">分類</span><button onclick="window.openCategoryManager()" class="text-slate-400 hover:text-blue-500 p-0.5"><i data-lucide="settings" class="w-3 h-3"></i></button></div>
                ${galleryCategories.map(cat => `<button onclick="window.setGalleryCategory('${cat}')" class="w-full text-center py-2 px-1 text-[11px] font-bold rounded-md transition-colors truncate ${currentGalleryCategory === cat ? 'bg-blue-500 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}">${cat}</button>`).join('')}`;

            const filtered = galleryItems.filter(item => (currentGalleryCategory === '全部' || item.category === currentGalleryCategory) && (!query || (item.title && item.title.toLowerCase().includes(query)) || (item.time && item.time.toLowerCase().includes(query))));

            const cameraSlotHtml = `
                <label class="relative group bg-white/80 hover:bg-blue-50/60 border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-xl overflow-hidden shadow-xs flex flex-col items-center justify-center cursor-pointer min-h-[175px] h-full active:scale-95 transition-all">
                    <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform shadow-xs">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-black text-slate-700 tracking-wider">拍照記錄</span>
                    <span class="text-[10px] font-bold text-slate-400 mt-0.5">點擊即時拍攝</span>
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            `;

            grid.innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                    ${cameraSlotHtml}
                    ${filtered.map(i => `
                        <div class="relative group bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                            <div class="px-2 py-1.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                <span class="text-[9.5px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 truncate max-w-[100px]">${i.category || '未分類'}</span>
                                <div class="flex items-center shrink-0">
                                    <button onclick="window.deleteGalleryItem('${i.id}')" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-colors active:scale-95" title="刪除圖片"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                            </div>
                            <div class="w-full h-28 bg-slate-100 overflow-hidden cursor-pointer" onclick="window.openFullscreenImg('${i.src}')">
                                <img src="${i.src}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${i.title || '圖片'}">
                            </div>
                            <div class="p-2 flex justify-between items-center bg-white border-t border-slate-100 text-xs gap-1.5">
                                <span class="text-[11px] text-slate-500 font-mono font-bold shrink-0 flex items-center">
                                    <i data-lucide="clock" class="w-3 h-3 mr-1 text-slate-400"></i>${i.time || '15:35'}
                                </span>
                                <span onclick="window.editGalleryItemTitle('${i.id}', event)" class="text-[11px] font-bold text-slate-800 truncate text-right flex-1 cursor-pointer hover:text-blue-600" title="點擊可修改名稱">${i.title || '無標題'}</span>
                            </div>
                        </div>`).join('')}
                </div>`;

            lucide.createIcons({ root: grid });
            lucide.createIcons({ root: sidebar });
        };

        window.setGalleryCategory = (c) => { currentGalleryCategory = c; window.renderGallery(); };

        window.exportAllGalleryImages = async () => {
            if (!galleryItems || galleryItems.length === 0) {
                return window.showToast('目前圖庫內沒有任何圖片可導出', true);
            }

            if ('showDirectoryPicker' in window) {
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    window.showToast(`已選定資料夾，開始匯出共 ${galleryItems.length} 張圖片...`);

                    for (let i = 0; i < galleryItems.length; i++) {
                        const item = galleryItems[i];
                        if (!item.src) continue;

                        const safeName = (item.title && item.title.trim() ? item.title.trim() : `圖片_${i + 1}`)
                            .replace(/[\\/:*?"<>|]/g, '_');

                        const res = await fetch(item.src);
                        const blob = await res.blob();
                        const fileHandle = await dirHandle.getFileHandle(`${safeName}.webp`, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                    }

                    window.showToast(`✅ 全部 ${galleryItems.length} 張圖片已成功存入指定資料夾！`);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return window.showToast('已取消選取資料夾');
                    console.warn('showDirectoryPicker 失敗，切換為依序排程下載', err);
                }
            }

            window.showToast(`開始逐張導出共 ${galleryItems.length} 張圖片，請稍候...`);
            for (let i = 0; i < galleryItems.length; i++) {
                const item = galleryItems[i];
                if (!item.src) continue;

                const safeName = (item.title && item.title.trim() ? item.title.trim() : `圖片_${i + 1}`)
                    .replace(/[\\/:*?"<>|]/g, '_');

                const link = document.createElement('a');
                link.href = item.src;
                link.download = `${safeName}.webp`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                await new Promise(resolve => setTimeout(resolve, 250));
            }
            window.showToast(`✅ 全部 ${galleryItems.length} 張圖片已導出完成！`);
        };

        window.openUploadBatchModal = () => {
            const modal = document.getElementById('uploadBatchModal');
            if (!modal) return;
            window.renderUploadBatchList();
            modal.classList.replace('hidden', 'flex');
        };

        window.closeUploadBatchModal = () => {
            window.pendingUploadImages = [];
            document.getElementById('uploadBatchModal')?.classList.replace('flex', 'hidden');
        };

        window.updatePendingItemCategory = (tempId, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (item) item.category = val;
        };

        window.updatePendingItemTitle = (tempId, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (item) item.title = val.trim();
        };

        window.updatePendingItemTimePart = (tempId, part, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;
            let [h, m] = (item.time || '00:00').split(':');
            if (part === 'h') h = val;
            if (part === 'm') m = val;
            item.time = `${h}:${m}`;
        };

        window.setPendingItemTimeToNow = (tempId) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;
            const now = window.getNow();
            const h = pad(now.getHours()), m = pad(now.getMinutes());
            item.time = `${h}:${m}`;
            const hSelect = document.getElementById(`h-select-${tempId}`);
            const mSelect = document.getElementById(`m-select-${tempId}`);
            if (hSelect) hSelect.value = h;
            if (mSelect) mSelect.value = m;
        };

        window.removePendingUploadItem = (tempId) => {
            window.pendingUploadImages = window.pendingUploadImages.filter(x => x.tempId !== tempId);
            window.renderUploadBatchList();
        };

        window.renderUploadBatchList = () => {
            const list = document.getElementById('uploadBatchList');
            const cntEl = document.getElementById('uploadBatchCount');
            if (cntEl) cntEl.textContent = window.pendingUploadImages.length;
            if (!list) return;

            if (!window.pendingUploadImages.length) {
                window.closeUploadBatchModal();
                return;
            }

            const selectableCategories = galleryCategories.filter(c => c !== '全部');

            list.innerHTML = window.pendingUploadImages.map((item) => {
                const [hStr, mStr] = (item.time || '00:00').split(':');

                return `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col space-y-2.5 relative group shadow-xs">
                    <div class="relative w-full h-36 bg-slate-200 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center">
                        <img src="${item.src}" class="w-full h-full object-cover">
                        <button onclick="window.removePendingUploadItem('${item.tempId}')" class="absolute top-2 right-2 text-slate-500 hover:text-red-500 p-1.5 rounded-full bg-white/90 backdrop-blur-xs shadow-md border border-slate-200 transition-colors active:scale-95" title="移除此張圖片">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">分類</label>
                        <select onchange="window.updatePendingItemCategory('${item.tempId}', this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500 shadow-2xs">
                            ${selectableCategories.map(cat => `<option value="${cat}" ${item.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                        </select>
                    </div>

                    <div class="flex items-center space-x-2">
                        <div class="w-[155px] shrink-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">時間</label>
                            <div class="flex items-center justify-between bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 shadow-2xs">
                                <div class="flex items-center font-mono font-bold text-sm text-slate-800 shrink-0">
                                    <select id="h-select-${item.tempId}" onchange="window.updatePendingItemTimePart('${item.tempId}', 'h', this.value)" class="bg-transparent text-center cursor-pointer outline-none hover:text-blue-600 focus:text-blue-600 font-mono font-bold">
                                        ${Array.from({length: 24}, (_, i) => `<option value="${pad(i)}" ${pad(i) === hStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}
                                    </select>
                                    <span class="text-slate-400 mx-1 font-bold">:</span>
                                    <select id="m-select-${item.tempId}" onchange="window.updatePendingItemTimePart('${item.tempId}', 'm', this.value)" class="bg-transparent text-center cursor-pointer outline-none hover:text-blue-600 focus:text-blue-600 font-mono font-bold">
                                        ${Array.from({length: 60}, (_, i) => `<option value="${pad(i)}" ${pad(i) === mStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}
                                    </select>
                                </div>
                                <button type="button" onclick="window.setPendingItemTimeToNow('${item.tempId}')" title="設為當前時間" class="text-slate-400 hover:text-blue-500 active:scale-95 transition-all flex items-center text-[10px] font-bold ml-1 whitespace-nowrap shrink-0">
                                    <i data-lucide="clock" class="w-3 h-3 mr-0.5 shrink-0"></i>現在
                                </button>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">名稱</label>
                            <input type="text" value="${item.title || ''}" oninput="window.updatePendingItemTitle('${item.tempId}', this.value)" placeholder="例如:R-099" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500 shadow-2xs text-center h-[34px]">
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons({ root: list });
        };

        window.confirmBatchUpload = () => {
            if (!window.pendingUploadImages.length) return;
            window.showToast(`正在發布 ${window.pendingUploadImages.length} 張圖片...`);

            window.pendingUploadImages.forEach(item => {
                const galleryDoc = {
                    id: 'img_' + Date.now() + Math.random().toString(36).substr(2, 4),
                    src: item.src,
                    title: item.title || '無標題',
                    category: item.category || '未分類',
                    time: item.time || '15:35'
                };
                galleryItems.unshift(galleryDoc);
                if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', galleryDoc.id), galleryDoc);
            });

            safeSetLocal('work_cache_gallery_items', galleryItems);
            window.renderGallery();
            window.showToast(`已成功上傳 ${window.pendingUploadImages.length} 張圖片！`);
            window.closeUploadBatchModal();
        };

        window.deleteGalleryItem = (id) => {
            window.showConfirm('刪除圖片', '確定要刪除這張圖片嗎？', async () => {
                galleryItems = galleryItems.filter(i => i.id !== id);
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (currentUser) deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id));
                window.renderGallery(); window.showToast("已刪除圖片");
            });
        };

        window.openCategoryManager = () => {
            const modal = document.getElementById('categoryManageModal'), list = document.getElementById('categoryManageList');
            if (!modal || !list) return;
            list.innerHTML = `
                <div class="flex gap-2 mb-3"><input type="text" id="newCatInput" placeholder="新增分類名稱..." class="flex-1 border border-slate-300 rounded-lg p-1.5 text-xs focus:outline-none focus:border-blue-500"><button onclick="window.addCategoryAction()" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold">新增</button></div>
                <div class="space-y-1.5">${galleryCategories.map((c, idx) => `
                    <div class="flex justify-between items-center p-2 bg-white rounded-lg border border-slate-200 text-xs font-bold text-slate-700">
                        <span>${c}</span>${!['全部', '任務附件', '未分類'].includes(c) ? `<button onclick="window.removeCategoryAction(${idx})" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : '<span class="text-[9px] text-slate-400 font-normal">系統預設</span>'}
                    </div>`).join('')}</div>`;
            modal.classList.replace('hidden', 'flex');
            lucide.createIcons({ root: list });
        };

        window.closeCategoryManager = () => document.getElementById('categoryManageModal')?.classList.replace('flex', 'hidden');
        window.addCategoryAction = () => {
            const val = document.getElementById('newCatInput').value.trim();
            if (!val || galleryCategories.includes(val)) return;
            galleryCategories.push(val); safeSetLocal('work_cache_gallery_categories', galleryCategories);
            syncConfig('gallery_categories', { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };

        window.removeCategoryAction = (idx) => {
            galleryCategories.splice(idx, 1); safeSetLocal('work_cache_gallery_categories', galleryCategories);
            syncConfig('gallery_categories', { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) { window.showToast("連線驗證失敗", true); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const dot = document.getElementById('connectionDot'), st = document.getElementById('connectionStatus');
            if (user) {
                dot?.classList.replace('bg-red-500', 'bg-green-500');
                if (st) st.textContent = '系統已連線並同步';
                setupPureRealtimeSync();
            } else {
                dot?.classList.replace('bg-green-500', 'bg-red-500');
                if (st) st.textContent = '連線中或驗證失敗...';
            }
        });

        loadLocalFastCache();
        initAuth();
    </script>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 bg-[#f0ebe1]">
    <div class="w-full max-w-[430px] h-[910px] max-h-[100vh] sm:max-h-[96vh] bg-[#fdfbf7] sm:rounded-[2.5rem] shadow-2xl sm:border-[6px] border-[#d6d0c4] overflow-hidden relative flex flex-col mx-auto my-auto">
        <header class="bg-[#fdfbf7]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#e5dfd3] p-4 pt-6 shadow-sm shrink-0">
            <div class="flex items-center justify-between relative">
                <div class="w-8"></div>
                <div class="flex items-center justify-center space-x-2 shrink-0">
                    <h1 class="text-xl text-slate-800 tracking-widest font-black">工作記錄本</h1>
                    <div class="flex items-center space-x-1.5 bg-white/70 px-2 py-0.5 rounded-full border border-slate-200 shadow-sm">
                        <span id="connectionDot" class="w-2 h-2 rounded-full bg-red-500 transition-colors duration-300 shadow-inner"></span>
                        <span id="connectionStatus" class="text-[9px] font-bold text-slate-500 tracking-wider">連線中...</span>
                    </div>
                </div>
                <div class="w-8"></div>
            </div>
            <div id="tabBarContainer" class="mt-3 flex bg-[#f0ebe1] rounded-lg p-1 shadow-inner border border-[#e5dfd3] relative z-20 overflow-x-auto scrollbar-hide">
                <button id="tabDaily" onclick="window.switchTab('daily')" class="flex-1 py-1.5 px-2 text-xs rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all uppercase tracking-widest text-center whitespace-nowrap">排程</button>
                <button id="tabGallery" onclick="window.switchTab('gallery')" class="flex-1 py-1.5 px-2 text-xs text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">圖庫</button>
            </div>
        </header>

        <main id="galleryPage" class="flex-1 min-h-0 flex-col relative z-10 bg-[#fdfbf7]">
            <div class="p-2.5 border-b border-[#e6e2d6] flex items-center space-x-2 bg-white shrink-0 shadow-sm z-20 relative">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                    <input type="text" id="gallerySearchInput" placeholder="搜尋圖片..." oninput="window.renderGallery()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-2.5 py-1.5 text-xs text-slate-700 placeholder-slate-400 focus:border-blue-400 focus:bg-white focus:outline-none tracking-wide text-center">
                </div>
                <button type="button" onclick="window.exportAllGalleryImages()" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 px-2.5 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-[11px] font-bold tracking-wide transition-all shadow-sm shrink-0" title="一次導出圖庫所有圖片">
                    <i data-lucide="download" class="w-3.5 h-3.5 mr-1"></i> 導出全部
                </button>
                <label class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-2.5 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-[11px] font-bold tracking-wide transition-colors shadow-sm shrink-0" title="選取檔案上傳">
                    <i data-lucide="upload" class="w-3.5 h-3.5 mr-1"></i> 上傳
                    <input type="file" accept="image/*" multiple class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            </div>
            <div class="flex flex-1 min-h-0 overflow-hidden relative z-10">
                <div class="w-[70px] shrink-0 border-r border-[#e6e2d6] bg-[#f4f1eb] overflow-y-auto flex flex-col items-center space-y-1.5 scrollbar-hide" id="gallerySidebar"></div>
                <div class="flex-1 p-2.5 overflow-y-auto bg-[#fdfbf7] relative scrollbar-hide" id="galleryGrid"></div>
            </div>
        </main>
    </div>

    <!-- 彈窗群 -->
    <div id="uploadBatchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[260] hidden flex-col items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-[460px] shadow-2xl relative max-h-[88vh] flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-3 mb-2 border-b border-slate-100 shrink-0">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                        <i data-lucide="images" class="w-5 h-5"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-800 tracking-wide">上傳圖片預覽與確認</h3>
                </div>
                <button onclick="window.closeUploadBatchModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-2.5 text-center text-xs font-bold text-blue-700 shrink-0 mb-3">
                📸 已選取 <span id="uploadBatchCount" class="text-blue-900 font-black text-sm">0</span> 張圖片預覽（可自訂分類、名稱與時間）
            </div>
            <div id="uploadBatchList" class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-hide mb-3"></div>
            <div class="flex justify-end space-x-2.5 pt-3 border-t border-slate-100 shrink-0">
                <button onclick="window.closeUploadBatchModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-colors active:scale-95">取消</button>
                <button onclick="window.confirmBatchUpload()" class="px-5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-sm transition-colors active:scale-95 flex items-center"><i data-lucide="check" class="w-4 h-4 mr-1.5"></i>確認上傳</button>
            </div>
        </div>
    </div>

    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col items-center justify-center p-4">
        <button onclick="document.getElementById('imageViewer').classList.replace('flex', 'hidden')" class="absolute top-6 right-6 text-white bg-slate-800/80 p-2 rounded-full active:scale-95 shadow-lg border border-slate-600 hover:bg-red-600 transition-colors" title="關閉">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" />
    </div>

    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="settings-2" class="w-4 h-4 mr-2 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[55vh] bg-[#fdfbf7] space-y-2 scrollbar-hide"></div>
        </div>
    </div>

    <div id="customConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[10000] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[300px] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex items-center bg-slate-50">
                <h2 id="confirmModalTitle" class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="alert-triangle" class="w-4 h-4 mr-1.5 text-amber-500"></i> 確認</h2>
            </header>
            <div class="p-5 text-xs text-slate-600 tracking-wide leading-relaxed text-center" id="confirmModalMessage"></div>
            <div class="p-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/50">
                <button id="confirmBtnCancel" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-xs font-bold transition-colors active:scale-95 shadow-sm">取消</button>
                <button id="confirmBtnOk" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs font-bold transition-colors active:scale-95 shadow-sm">確定</button>
            </div>
        </div>
    </div>
</body>
</html>
