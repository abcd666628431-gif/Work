    <style>
        /* 筆記本風格樣式設定 */
        html, body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0ebe1; color: #334155; overflow-x: hidden; width: 100%; position: relative; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 手繪與筆記本彩色元素 */
        .marker-yellow { background: linear-gradient(104deg, transparent 0%, rgba(254, 240, 138, 0.8) 2%, rgba(253, 224, 71, 0.9) 98%, transparent 100%); background-size: 100% 38%; background-position: 0 85%; background-repeat: no-repeat; padding: 0 2px; }
        .marker-pink { background: linear-gradient(104deg, transparent 0%, rgba(254, 205, 211, 0.8) 2%, rgba(253, 164, 175, 0.9) 98%, transparent 100%); background-size: 100% 38%; background-position: 0 85%; background-repeat: no-repeat; padding: 0 2px; }
        .marker-blue { background: linear-gradient(104deg, transparent 0%, rgba(186, 230, 253, 0.8) 2%, rgba(125, 211, 252, 0.9) 98%, transparent 100%); background-size: 100% 38%; background-position: 0 85%; background-repeat: no-repeat; padding: 0 2px; }
        .marker-green { background: linear-gradient(104deg, transparent 0%, rgba(187, 247, 208, 0.8) 2%, rgba(134, 239, 172, 0.9) 98%, transparent 100%); background-size: 100% 38%; background-position: 0 85%; background-repeat: no-repeat; padding: 0 2px; }

        .sticky-note-1 { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-left: 3px solid #fbbf24; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }
        .sticky-note-2 { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-left: 3px solid #4ade80; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }
        .sticky-note-3 { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-left: 3px solid #60a5fa; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }

        .tape-strip { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 12px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 1px 2px rgba(0,0,0,0.05); backdrop-filter: blur(2px); z-index: 5; border-radius: 1px; }
        .tape-strip-1 { background-color: rgba(255, 255, 255, 0.6); }
        .tape-strip-2 { background-color: rgba(254, 240, 138, 0.5); }
        .tape-strip-3 { background-color: rgba(186, 230, 253, 0.5); }
        .tape-strip-blue { background-color: rgba(186, 230, 253, 0.5); }
        .tape-strip-red { background-color: rgba(254, 205, 211, 0.5); }

        /* 卡片滾動對焦特效 */
        .daily-task-card { transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-focused {
            border-color: #60a5fa !important;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25), 0 8px 10px -6px rgba(59, 130, 246, 0.1) !important;
            transform: scale(1.02) !important;
            z-index: 30;
        }

        /* 動態任務滑動消除過渡動畫 */
        .timeline-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* 堆疊卡片查看動畫 */
        .bring-to-front {
            z-index: 9999 !important;
        }
        .bring-to-front .timeline-card {
            transform: translateY(-20px) scale(1.03) !important;
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.25), 0 15px 15px -5px rgba(0, 0, 0, 0.1) !important;
            opacity: 1 !important;
        }

        /* 雪房超時動畫 */
        .timer-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }

        /* 深色模式覆寫 - 柔和文字與低光度線條設定 */
        body.dark-mode { background-color: #0f172a !important; color: #cbd5e1 !important; color-scheme: dark; }
        .dark-mode .bg-\[\#fdfbf7\] { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .bg-\[\#f0ebe1\] { background-color: #0f172a !important; }
        .dark-mode header.bg-\[\#fdfbf7\]\/95 { background-color: rgba(30, 41, 59, 0.95) !important; border-color: #334155 !important;}
        .dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .bg-slate-50, .dark-mode .bg-slate-100 { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode .text-slate-800 { color: #cbd5e1 !important; }
        .dark-mode .text-slate-700 { color: #94a3b8 !important; }
        .dark-mode .text-slate-600 { color: #64748b !important; }
        .dark-mode .text-slate-500 { color: #475569 !important; }
        .dark-mode .border-slate-200, .dark-mode .border-slate-300 { border-color: #334155 !important; }
        .dark-mode .border-\[\#d6d0c4\] { border-color: #334155 !important; }
        
        /* 專屬調整：左側狀態線條與光暈壓暗 */
        .dark-mode .daily-task-card .absolute.left-0 { opacity: 0.35 !important; mix-blend-mode: multiply; }
        .dark-mode .active-task .absolute.bg-green-400 { opacity: 0.2 !important; box-shadow: none !important; }
        .dark-mode .active-task .shadow-\[0_0_8px_rgba\(74\,222\,128\,1\)\] { box-shadow: none !important; background-color: #4ade80 !important; opacity: 0.5; }
        
        /* 其他螢光筆與裝飾壓暗 */
        .dark-mode .marker-yellow, .dark-mode .marker-pink, .dark-mode .marker-blue, .dark-mode .marker-green { filter: brightness(0.6) opacity(0.7); }
        .dark-mode .sticky-note-1, .dark-mode .sticky-note-2, .dark-mode .sticky-note-3 { background: #0f172a !important; border-color: #475569 !important; box-shadow: none !important; }
        .dark-mode .tape-strip { background-color: rgba(255,255,255,0.1) !important; border-color: rgba(255,255,255,0.05) !important; }
        
        /* Timeline 與輸入框特定樣式 */
        .dark-mode #timelineStickyHeader { background: linear-gradient(to bottom, #1e293b, rgba(30,41,59,0.95), transparent) !important; }
        .dark-mode #tlBigClock { background-color: rgba(30, 41, 59, 0.9) !important; color: #f8fafc !important; border-color: #334155 !important; }
        .dark-mode #tlBigDate { color: #94a3b8 !important; }
        .dark-mode .timeline-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .active-task .timeline-card { background-color: #172554 !important; border-color: #1e3a8a !important; }
        .dark-mode .active-task .timeline-card .bg-slate-100\/50 { background-color: #0f172a !important; }
        .dark-mode .timeline-card .bg-slate-100\/50 { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode input[type="time"], .dark-mode input[type="text"], .dark-mode input[type="number"], .dark-mode textarea { background-color: #334155 !important; color: #f8fafc !important; border-color: #475569 !important; }

        /* 地圖專屬深色模式調整 */
        .dark-mode #mapWrapper { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode .bg-blue-50\/60 { background-color: rgba(30, 58, 138, 0.2) !important; border-color: #334155 !important; }
        .dark-mode .bg-emerald-50\/60 { background-color: rgba(6, 78, 59, 0.2) !important; border-color: #334155 !important; }
        .dark-mode .text-blue-300\/80 { color: rgba(96, 165, 250, 0.4) !important; }
        .dark-mode .text-emerald-300\/80 { color: rgba(52, 211, 153, 0.4) !important; }
        .dark-mode .bg-\[\#f4f1eb\] { background-color: #1e293b !important; border-color: #334155 !important; }

        /* 調整時間輸入框內的時鐘圖示大小 */
        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            width: 22px;
            height: 22px;
            opacity: 0.85;
            transition: transform 0.2s ease;
        }
        input[type="time"]::-webkit-calendar-picker-indicator:active {
            transform: scale(0.9);
        }

    <script type="module">
        import { initializeApp } from "https://gs.jurieo.com/gemini/gstatic/firebasejs/11.6.1/firebase-app.js";

        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://gs.jurieo.com/gemini/gstatic/firebasejs/11.6.1/firebase-firestore.js";

        const userFirebaseConfig = {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs",
            authDomain: "work-eb62f.firebaseapp.com",
            databaseURL: "https://work-eb62f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "work-eb62f",
            storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706",
            appId: "1:428210130706:web:142207595423bdf661adcb"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let steps = [];
        let currentUser = null;

        const connectionStatus = document.getElementById('connectionStatus');
        const connectionDot = document.getElementById('connectionDot');
        const stepsContainer = document.getElementById('stepsContainer');
        const addBoxBtn = document.getElementById('addBoxBtn');

        let dailyScheduleData = [];
        let taskCompletionState = {};
        let taskExtrasState = {}; 
        let taskArchiveState = {}; 
        let subTaskCompletionState = {}; 
        let expandedTasksState = {}; 
        let galleryCategories = ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他'];
        let galleryItems = [];

        let futureMemos = []; 
        const defaultMapPoints = {
            'pt_1': { name: '客服室', x: 75, y: 12.5 },
            'pt_2': { name: '一樓大清點', x: 27.5, y: 35.5 },
            'pt_3': { name: '花園仔', x: 22.5, y: 64 },
            'pt_4': { name: '魚檔', x: 72.5, y: 64 },
            'pt_5': { name: '整體巡邏', x: 50, y: 50 },
            'pt_6': { name: '地面層 大清點', x: 25, y: 84 }
        };
        let mapData = { points: JSON.parse(JSON.stringify(defaultMapPoints)) }; 
        let memberSchedules = []; 

        // 雪房模組全域變數
        let crRecords = [];
        let crItemTypes = ['海鮮', '肉類', '蔬果', '其他'];
        let crCurrentSelectedType = '';
        let crCurrentTab = 'active'; 
        let crTimerInterval;
        const CR_TIME_LIMIT_MS = 24 * 60 * 60 * 1000; // 24 Hours

        let actionHistory = [];
        window.saveStateSnapshot = () => {
            actionHistory.push({
                tasks: JSON.parse(JSON.stringify(taskCompletionState)),
                subtasks: JSON.parse(JSON.stringify(subTaskCompletionState))
            });
            if (actionHistory.length > 30) actionHistory.shift(); 
        };

        let currentGalleryCategory = '全部';
        window.isEditMode = false;
        let timeUpdateInterval;
        let timelineUpdateInterval; 
        
        // 模擬模式全域變數
        let timeOffset = 0; 
        let isFastForwarding = false; 
        let simInterval = null;
        window.getNow = () => new Date(Date.now() + timeOffset);

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('work_cache_dark_mode', isDark);
            const icon = document.getElementById('darkModeIcon');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        };

        window.showToast = (message, isError = false) => {
            const toast = document.createElement('div');
            toast.className = `fixed top-16 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-full shadow-lg text-sm font-bold z-[9999] transition-all duration-300 ${isError ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.showConfirm = (title, message, onConfirmCallback) => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmModalTitle').innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> ${title}`;
            document.getElementById('confirmModalMessage').innerHTML = message;
            
            const cancelBtn = document.getElementById('confirmBtnCancel');
            const okBtn = document.getElementById('confirmBtnOk');
            
            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                okBtn.removeEventListener('click', okHandler);
                cancelBtn.removeEventListener('click', cleanup);
            };
            
            const okHandler = () => {
                onConfirmCallback();
                cleanup();
            };
            
            okBtn.addEventListener('click', okHandler);
            cancelBtn.addEventListener('click', cleanup);
            
            lucide.createIcons();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        const getLocal = (key, defaultVal) => {
            try { const val = localStorage.getItem(key); return val ? JSON.parse(val) : defaultVal; } 
            catch(e) { return defaultVal; }
        };

        const safeSetLocal = (key, data) => {
            try { localStorage.setItem(key, JSON.stringify(data)); } 
            catch(e) { console.warn(`手機端快取空間已滿，跳過本地備份: ${key}`); }
        };

        function loadLocalFastCache() {
            dailyScheduleData = getLocal('work_cache_schedule', []);
            taskCompletionState = getLocal('work_cache_task_states', {});
            taskExtrasState = getLocal('work_cache_daily_extras', {});
            taskArchiveState = getLocal('work_cache_daily_archive', {});
            subTaskCompletionState = getLocal('work_cache_subtask_states', {});
            galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
            galleryItems = getLocal('work_cache_gallery_items', []);
            
            futureMemos = getLocal('work_cache_future_memos', []);
            mapData = getLocal('work_cache_map_data', { points: {} });
            
            crRecords = getLocal('coldRoomRecords', []);
            crItemTypes = getLocal('coldRoomTypes', ['海鮮', '肉類', '蔬果', '其他']);

            if(!mapData.points) mapData.points = {};
            for (const [id, data] of Object.entries(defaultMapPoints)) {
                let exists = false;
                for (const key in mapData.points) {
                    if (mapData.points[key].name === data.name) exists = true;
                }
                if (!exists) mapData.points[id] = data;
            }
            
            memberSchedules = getLocal('work_cache_member_schedules', []);

            if (!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');

            if(document.getElementById('dailySchedulePage') && !document.getElementById('dailySchedulePage').classList.contains('hidden')) renderDailySchedule();
            if(document.getElementById('galleryPage') && !document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
            if(document.getElementById('timelinePage') && !document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
            if(document.getElementById('mapPage') && !document.getElementById('mapPage').classList.contains('hidden')) window.renderMap();
            if(document.getElementById('coldRoomPage') && !document.getElementById('coldRoomPage').classList.contains('hidden')) window.crRenderList();
        }

        function setupPureRealtimeSync() {
            if (!currentUser) return;
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), (docSnap) => {
                if(docSnap.exists() && docSnap.data().tasks) { 
                    const newData = docSnap.data().tasks;
                    if (JSON.stringify(dailyScheduleData) !== JSON.stringify(newData)) {
                        dailyScheduleData = newData;
                        safeSetLocal('work_cache_schedule', dailyScheduleData);
                        renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, (err) => console.error(err));
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().states || {};
                    if (JSON.stringify(taskCompletionState) !== JSON.stringify(newData)) {
                        taskCompletionState = newData;
                        safeSetLocal('work_cache_task_states', taskCompletionState);
                        renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, (err) => console.error(err));
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().states || {};
                    if (JSON.stringify(subTaskCompletionState) !== JSON.stringify(newData)) {
                        subTaskCompletionState = newData;
                        safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
                        renderDailySchedule(); 
                    }
                }
            }, (err) => console.error(err));

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_extras'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().extras || {};
                    if (JSON.stringify(taskExtrasState) !== JSON.stringify(newData)) {
                        taskExtrasState = newData;
                        safeSetLocal('work_cache_daily_extras', taskExtrasState);
                        renderDailySchedule(); 
                    }
                }
            }, (err) => console.error(err));

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), (docSnap) => {
                if(docSnap.exists()) { 
                    galleryCategories = docSnap.data().categories || ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他'];
                    if(!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');
                    safeSetLocal('work_cache_gallery_categories', galleryCategories);
                    window.renderGallery(); 
                }
            }, (err) => console.error(err));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items'), (snapshot) => {
                let newItems = [];
                snapshot.forEach(d => newItems.push(d.data()));
                newItems.sort((a,b) => {
                    const idA = a.id || '';
                    const idB = b.id || '';
                    return idB.localeCompare(idA);
                });
                
                if(JSON.stringify(galleryItems) !== JSON.stringify(newItems)) {
                    galleryItems = newItems;
                    safeSetLocal('work_cache_gallery_items', galleryItems);
                    if(document.getElementById('galleryPage') && !document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
                    if(document.getElementById('dailySchedulePage') && !document.getElementById('dailySchedulePage').classList.contains('hidden')) renderDailySchedule();
                }
            }, (err) => console.error(err));

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'future_memos'), (docSnap) => {
                if(docSnap.exists()) { 
                    futureMemos = docSnap.data().memos || [];
                    safeSetLocal('work_cache_future_memos', futureMemos);
                    if(!document.getElementById('memoPage')?.classList.contains('hidden')) window.renderMemos(); 
                }
            }, (err) => console.error(err));

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'map_data'), (docSnap) => {
                if(docSnap.exists()) {
                    mapData = docSnap.data().data || { points: {} };
                    if(!mapData.points || Object.keys(mapData.points).length === 0) mapData.points = JSON.parse(JSON.stringify(defaultMapPoints));
                    safeSetLocal('work_cache_map_data', mapData);
                    if(!document.getElementById('mapPage')?.classList.contains('hidden')) window.renderMap();
                }
            }, (err) => console.error(err));

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'member_schedules'), (docSnap) => {
                if(docSnap.exists()) {
                    memberSchedules = docSnap.data().schedules || [];
                    safeSetLocal('work_cache_member_schedules', memberSchedules);
                    if(!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
                }
            }, (err) => console.error(err));

            // Sync Cold Room Data
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'coldRoom'), (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    let needsRender = false;
                    if(data.records && JSON.stringify(crRecords) !== JSON.stringify(data.records)) {
                        crRecords = data.records;
                        safeSetLocal('coldRoomRecords', crRecords);
                        needsRender = true;
                    }
                    if(data.types && JSON.stringify(crItemTypes) !== JSON.stringify(data.types)) {
                        crItemTypes = data.types;
                        safeSetLocal('coldRoomTypes', crItemTypes);
                        needsRender = true;
                    }
                    if(needsRender && !document.getElementById('coldRoomPage')?.classList.contains('hidden')) {
                        window.crRenderList();
                    }
                }
            }, (err) => console.error(err));
        }

        function compressImageSafeAsync(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; 
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; 
                        ctx.fillRect(0, 0, width, height);
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'medium';
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.onerror = () => reject(new Error("圖片解析失敗"));
                };
                reader.onerror = () => reject(new Error("檔案讀取失敗"));
            });
        }

        function compressBase64ImageSafeAsync(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'medium';
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = () => resolve(base64Str); 
                img.src = base64Str;
            });
        }

        window.exportData = async () => {

        window.importData = (event) => {
            const file = event.target.files[0];

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    window.showToast("正在讀取並智能壓縮轉檔...(若照片多請稍候)");
                    const importedData = JSON.parse(e.target.result);
                    
                    let impSchedule = importedData.dailyScheduleData || dailyScheduleData;
                    let impTaskStates = importedData.taskCompletionState || taskCompletionState;
                    let impExtras = importedData.taskExtrasState || taskExtrasState;
                    let impSubStates = importedData.subTaskCompletionState || subTaskCompletionState;
                    let impGalCats = importedData.galleryCategories || galleryCategories;
                    let impGalItems = importedData.galleryItems || galleryItems;
                    let impCrRecords = importedData.crRecords || crRecords;
                    let impCrItemTypes = importedData.crItemTypes || crItemTypes;

                    if(!impGalCats.includes('任務附件')) impGalCats.push('任務附件');

                    let hasMigrated = false;
                    for (const taskId of Object.keys(impExtras)) {
                        let extra = impExtras[taskId];
                        if (extra.currentPhotos && extra.currentPhotos.length > 0) {
                            for (let i = 0; i < extra.currentPhotos.length; i++) {
                                const compressedUrl = await compressBase64ImageSafeAsync(extra.currentPhotos[i]);
                                const photoId = `mig_imp_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
                                impGalItems.unshift({ id: photoId, url: compressedUrl, title: '舊版任務紀錄 (已轉檔)', category: '任務附件', taskId, timestamp: new Date().toLocaleString('zh-TW') });
                            }
                            extra.currentPhotos = []; 
                            hasMigrated = true;
                        }
                        if (extra.subTasks) {
                            for (const subIdx of Object.keys(extra.subTasks)) {
                                if (extra.subTasks[subIdx].photos && extra.subTasks[subIdx].photos.length > 0) {
                                    for (let i = 0; i < extra.subTasks[subIdx].photos.length; i++) {
                                        const compressedUrl = await compressBase64ImageSafeAsync(extra.subTasks[subIdx].photos[i]);
                                        const photoId = `migs_imp_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
                                        impGalItems.unshift({ id: photoId, url: compressedUrl, title: '舊版子任務紀錄 (已轉檔)', category: '任務附件', taskId, subIdx: parseInt(subIdx), timestamp: new Date().toLocaleString('zh-TW') });
                                    }
                                    extra.subTasks[subIdx].photos = []; 
                                    hasMigrated = true;
                                }
                            }
                        }
                    }

                    dailyScheduleData = impSchedule;
                    taskCompletionState = impTaskStates;
                    taskExtrasState = impExtras;
                    subTaskCompletionState = impSubStates;
                    galleryCategories = impGalCats;
                    galleryItems = impGalItems;
                    crRecords = impCrRecords;
                    crItemTypes = impCrItemTypes;

                    safeSetLocal('work_cache_schedule', dailyScheduleData);
                    safeSetLocal('work_cache_task_states', taskCompletionState);
                    safeSetLocal('work_cache_daily_extras', taskExtrasState);
                    safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
                    safeSetLocal('work_cache_gallery_categories', galleryCategories);
                    safeSetLocal('work_cache_gallery_items', galleryItems);
                    safeSetLocal('coldRoomRecords', crRecords);
                    safeSetLocal('coldRoomTypes', crItemTypes);

                    if (currentUser) {
                        window.showToast("資料轉檔完畢，正在同步至雲端...");
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), { tasks: dailyScheduleData });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), { states: taskCompletionState });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), { states: subTaskCompletionState });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_extras'), { extras: taskExtrasState });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'coldRoom'), { records: crRecords, types: crItemTypes });
                        
                        const batchLimit = 200;
                        for (let i = 0; i < galleryItems.length; i += batchLimit) {
                            const batch = writeBatch(db);
                            const chunk = galleryItems.slice(i, i + batchLimit);
                            chunk.forEach(item => {
                                batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', item.id), item);
                            });
                            await batch.commit();
                        }
                    }

                    renderDailySchedule();
                    if(!document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
                    if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
                    if(!document.getElementById('coldRoomPage').classList.contains('hidden')) window.crRenderList();
                    
                    window.showToast("導入與轉檔全部成功！");
                    
                } catch (error) {
                    console.error(error);
                    window.showToast("導入失敗，可能是備份檔照片容量超過系統負荷", true);
                }

            reader.readAsText(file);

                event.stopPropagation();

        window.updateConveyorBelt = () => {
            if(document.getElementById('timelinePage').classList.contains('hidden')) return;
            const now = window.getNow();
            let previousTime = now;
            
            document.querySelectorAll('.active-task').forEach(wrapper => {
                 const startStr = wrapper.dataset.start;
                 const endStr = wrapper.dataset.end;
                 const status = calculateTaskStatus(startStr, endStr);
                 if (status.state !== 'active') {
                     window.renderTimeline(false); 
                     return;
                 }
                 
                 const startTime = parseTime(startStr);
                 const endTime = parseTime(endStr);
                 const progress = Math.min(1, Math.max(0, (now - startTime) / (endTime - startTime)));
                 const dashoffset = 251.2 * progress;

                 const timeTextEl = wrapper.querySelector('.time-text');
                 if (timeTextEl) {
                     timeTextEl.innerHTML = `<span class="text-green-600 font-bold flex items-center">
                        <svg class="w-3.5 h-3.5 mr-1.5 shrink-0 transform -rotate-90 drop-shadow-sm" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="#dcfce7" stroke-width="16"></circle>
                            <circle cx="50" cy="50" r="40" fill="none" stroke="#16a34a" stroke-width="16" stroke-dasharray="251.2" stroke-dashoffset="${dashoffset}" stroke-linecap="round"></circle>
                        </svg>
                        當前任務 (${status.text.replace('進行中 (', '').replace(')', '')})
                     </span>`;
                 }
                 previousTime = now; 
            });

            const wrappers = document.querySelectorAll('.conveyor-task');
            wrappers.forEach(wrapper => {
                const startStr = wrapper.dataset.start;
                const endStr = wrapper.dataset.end;
                if (!startStr) return;
                
                const status = calculateTaskStatus(startStr, endStr);
                if (status.state !== 'waiting') {
                    window.renderTimeline(true); 
                    return;
                }
                
                const startTime = parseTime(startStr);
                let gapMins = Math.max(0, (startTime - previousTime) / 60000);
                let extraGap = Math.min(gapMins * 1.5, 120); 
                wrapper.style.marginTop = `${8 + extraGap}px`;
                
                const timeTextEl = wrapper.querySelector('.time-text');
                if (timeTextEl) {
                    timeTextEl.innerHTML = '<span class="text-amber-600 font-bold flex items-center"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1 shrink-0"></i>⏳ ' + status.text.replace('未開始 (', '還有 ').replace('後)', '') + ' 到來</span>';
                }
                previousTime = startTime; 
            });
            lucide.createIcons();

                dateEl.textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' });
                
                const restoreBtn = document.getElementById('simRestoreBtn');
                if (restoreBtn) {

                    else restoreBtn.classList.add('hidden');
                }
            }

        window.handleTimelineScroll = () => {
            const page = document.getElementById('timelinePage');
            const indicatorContainer = document.getElementById('uncompleted-indicator-container');
            const countSpan = document.getElementById('uncompleted-count');
            const header = document.getElementById('timelineStickyHeader');
            if (!page || !indicatorContainer || !countSpan) return;

            const hideThreshold = header ? header.getBoundingClientRect().top + 60 : 60;
            let hiddenUncompletedCount = 0;

            const wrappers = page.querySelectorAll('.timeline-wrapper');
            wrappers.forEach(wrapper => {
                const taskId = wrapper.dataset.taskId;
                if (!taskCompletionState[taskId]) { 
                    const card = wrapper.querySelector('.timeline-card');
                    if (card) {
                        const rect = card.getBoundingClientRect();
                        if (rect.bottom < hideThreshold) {
                            hiddenUncompletedCount++;
                        }
                    }
                }
            });

            if (hiddenUncompletedCount > 0) {
                countSpan.textContent = hiddenUncompletedCount;
                indicatorContainer.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
                indicatorContainer.classList.add('opacity-100', 'translate-y-0');
            } else {
                indicatorContainer.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
                indicatorContainer.classList.remove('opacity-100', 'translate-y-0');
            }
        };

        window.scrollToTopUncompleted = (event) => {
            if (event) event.stopPropagation();
            const page = document.getElementById('timelinePage');
            
            const wrappers = page.querySelectorAll('.timeline-wrapper');
            for (let wrapper of wrappers) {
                const taskId = wrapper.dataset.taskId;
                if (!taskCompletionState[taskId]) {
                    const card = wrapper.querySelector('.timeline-card');
                    if (card) {
                        const containerRect = page.getBoundingClientRect();
                        const elRect = card.getBoundingClientRect();
                        const scrollTop = page.scrollTop + (elRect.top - containerRect.top) - 75; 
                        page.scrollTo({ top: Math.max(0, scrollTop), behavior: 'smooth' });
                        break;
                    }
                }
            }

            window.updateClockUI();

            timelineTasks.sort((a, b) => parseTime(a.start) - parseTime(b.start));

            const now = window.getNow();
            const nowTime = now.getTime();

            if (timelineTasks.length === 0) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center pt-24 pb-32 text-slate-400"><i data-lucide="party-popper" class="w-16 h-16 mb-4 text-green-500 opacity-80"></i><span class="text-base font-black tracking-widest text-slate-600">目前沒有任何任務</span></div>';

                return;
            }

            let targetScrollId = null;
            let minDiff = Infinity;

                const end = parseTime(task.end).getTime();

                    targetScrollId = `tl-task-wrapper-${task.id}`;

                let checkBtnHtml = '';

            const totalTasks = dailyScheduleData.length;

            const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            
            const ring = document.getElementById('hudProgressRing');
            const percentText = document.getElementById('hudPercentage');
            const countText = document.getElementById('hudTaskCount');

                                    <i data-lucide="camera" class="w-3.5 h-3.5"></i><span>附加存證相片</span>

                                <div class="flex h-8 shadow-sm rounded-lg">

                'daily': document.getElementById('dailySchedulePage'),

                'timeline': document.getElementById('timelinePage'),
                'memo': document.getElementById('memoPage'),
                'map': document.getElementById('mapPage'),
                'coldRoom': document.getElementById('coldRoomPage')
            };
            const btns = {
                'custom': document.getElementById('tabCustom'),
                'daily': document.getElementById('tabDaily'),
                'timeline': document.getElementById('tabTimeline'),
                'memo': document.getElementById('tabMemo'),
                'map': document.getElementById('tabMap'),
                'gallery': document.getElementById('tabGallery'),
                'coldRoom': document.getElementById('tabColdRoom')
            };

            Object.values(pages).forEach(p => {
                if (p) {
                    p.classList.add('hidden');
                    p.classList.remove('flex', 'block'); 
                }
            });
            Object.entries(btns).forEach(([k, b]) => { if(b) b.className = inactiveClass; });

            if(pages[tab]) { 
                pages[tab].classList.remove('hidden'); 
                if (tab === 'map' || tab === 'gallery' || tab === 'coldRoom') {
                    pages[tab].classList.add('flex');
                } else {
                    pages[tab].classList.add('block');
                }
            }
            if(btns[tab]) { btns[tab].className = activeClass; }

            if (tab === 'daily') renderDailySchedule(); 
            else if (tab === 'gallery') window.renderGallery();
            else if (tab === 'timeline') window.renderTimeline(true);
            else if (tab === 'memo') window.renderMemos();
            else if (tab === 'map') window.renderMap();
            else if (tab === 'coldRoom') window.crRenderList();
            
            localStorage.setItem('activeTab', tab);
        };

        window.renderMemos = () => {
            const container = document.getElementById('memoContainer');
            if(!container) return;
            
            let sortedMemos = [...futureMemos].sort((a, b) => {
                const dateA = new Date(`${a.date}T${a.time || '00:00'}`);
                const dateB = new Date(`${b.date}T${b.time || '00:00'}`);
                return dateA - dateB;
            });

            if(sortedMemos.length === 0) {

                return;

            container.innerHTML = sortedMemos.map(memo => {

        window.handleScheduleImageUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            window.showToast('正在使用 AI 視覺模型解析表格結構，請稍候...', false);
            
            const btn = document.getElementById('aiParseBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 mr-1 animate-spin"></i> 解析中...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });

                const mimeType = file.type;
                const prompt = `你是一個專業的排班表解析助手。這是一張表格形式的排班表。
X軸是時間段（例如 7:00-8:00, 8:00-9:00），Y軸是崗位地點（例如 花園仔, 魚檔, 整體巡邏, 機動）。
表格內的文字是負責人的名字。如果有兩個人同時在一個儲存格，請將他們視為兩人分別排班。
注意備註：如果名字旁邊有括號寫「(休)」代表他這段時間休息（不應排班），寫「(頂)」代表頂替（應該排班）。
請提取出所有人的排班，並儘量將連續的時間段合併（例如同一個人在同一個地點從07:00連續排到10:00，就合併為一筆：start: "07:00", end: "10:00"）。
時間格式必須為 HH:mm (例如 07:00, 08:00)。

請將結果輸出為嚴格的 JSON 陣列格式。
格式範例：
[
  {"name": "姚桂菊", "locationName": "花園仔", "start": "07:00", "end": "10:00"},
  {"name": "蔣開紅", "locationName": "魚檔", "start": "07:00", "end": "10:00"}
]`;

                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: prompt },
                                {
                                    inlineData: {
                                        mimeType: mimeType,
                                        data: base64Data
                                    }
                                }
                            ]
                        }
                    ],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    
                    const jsonText = result.candidates[0].content.parts[0].text;
                    const parsedData = JSON.parse(jsonText);
                    
                    let newSchedulesCount = 0;
                    const locationEntries = Object.entries(mapData.points);

                    for (const item of parsedData) {
                        if (!item.name || !item.locationName || !item.start || !item.end) continue;
                        
                        let cleanName = item.name.replace(/\(.*?\)/g, '').trim();
                        if (cleanName.includes('休')) continue;
                        if (cleanName.includes('頂')) cleanName = cleanName.replace('頂', '').trim();

                        if (!cleanName) continue;

                        let matchedLocationId = null;
                        for (const [id, pt] of locationEntries) {
                            if (item.locationName.includes(pt.name) || pt.name.includes(item.locationName)) {
                                matchedLocationId = id;
                                break;
                            }
                        }

                        if (!matchedLocationId && locationEntries.length > 0) {
                             matchedLocationId = locationEntries[0][0]; 
                        }

                        if (matchedLocationId) {
                            const formatTime = (timeStr) => {
                                const parts = timeStr.split(':');
                                if (parts.length >= 2) {
                                    return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                                }
                                return timeStr;
                            };

                            memberSchedules.push({ 
                                id: 'sch_ai_'+Date.now() + Math.random().toString(36).substr(2,5), 
                                name: cleanName, 
                                locationId: matchedLocationId, 
                                start: formatTime(item.start), 
                                end: formatTime(item.end) 
                            });
                            newSchedulesCount++;
                        }
                    }

                    if (newSchedulesCount > 0) {
                        if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'member_schedules'), { schedules: memberSchedules });
                        window.renderScheduleManager();
                        window.showToast(`成功解析並匯入 ${newSchedulesCount} 筆排班資料！`);
                    } else {
                        window.showToast('未能從圖片中識別出有效的排班格式。', true);
                    }

                } else {
                    throw new Error("AI 處理回應異常");
                }

            } catch (error) {
                console.error("解析失敗:", error);
                window.showToast('圖片解析失敗，請稍後再試。', true);
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                event.target.value = ''; 
                lucide.createIcons();
            }
        };

            for(let i=0; i<files.length; i++) {
               try {
                   const b64 = await compressImageSafeAsync(files[i]);
                   const newItem = {
                       id: 'g_m_'+Date.now()+'_'+Math.random().toString(36).substr(2,4),
                       url: b64,
                       title: currentGalleryCategory === '全部' ? '未命名相片' : currentGalleryCategory + '紀錄',
                       category: currentGalleryCategory === '全部' ? '未分類' : currentGalleryCategory,
                       timestamp: new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
                   };
                   galleryItems.unshift(newItem);
                   await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', newItem.id), newItem);
               } catch(e) {}
            }
            safeSetLocal('work_cache_gallery_items', galleryItems);
            window.renderGallery();
            window.showToast("圖庫雲端上傳完成");
            input.value = '';
        };

        window.updateGalleryTitle = (id, text) => {
            const item = galleryItems.find(i => i.id === id);
            if(item && currentUser) {
                item.title = text.trim() || '未命名相片';
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id), { title: item.title }, { merge: true });
            }
        };
        
        window.switchGalleryCategory = (cat) => { currentGalleryCategory = cat; window.renderGallery(); };
        window.openCategoryManager = () => { window.renderCategoryManager(); document.getElementById('categoryManageModal').classList.remove('hidden'); document.getElementById('categoryManageModal').classList.add('flex'); };
        window.closeCategoryManager = () => { document.getElementById('categoryManageModal').classList.add('hidden'); document.getElementById('categoryManageModal').classList.remove('flex'); };

        window.renderCategoryManager = () => {
            const list = document.getElementById('categoryManageList');
            if(!list) return;
            list.innerHTML = galleryCategories.map((cat) => {
                const isProtected = cat === '全部' || cat === '未分類' || cat === '任務附件';
                return `
                <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                    ${isProtected ? `
                        <span class="text-sm font-bold text-slate-500 ml-1 tracking-widest">${cat} <span class="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded ml-1 font-normal border border-slate-200">系統保留</span></span>
                        <div class="flex gap-1 opacity-30 pointer-events-none"><button class="p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>
                    ` : `
                        <input type="text" value="${cat}" onblur="window.renameCategoryInModal('${cat}', this.value)" class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm text-slate-700 font-bold focus:outline-none focus:border-blue-400 focus:bg-white transition-colors mr-2 w-full min-w-0 tracking-widest shadow-inner">
                        <div class="flex gap-1 shrink-0"><button onclick="window.deleteCategoryInModal('${cat}')" class="p-1.5 text-red-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors active:scale-95"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i></button></div>
                    `}
                </div>
                `;
            }).join('');
            lucide.createIcons();
        };

        window.addCategory = () => {
            const newName = prompt("請輸入新分類名稱：", "新分類");
            if(newName && newName.trim() !== '') {
                galleryCategories.push(newName.trim());
                if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
                window.renderGallery();
            }
        };

        window.renameCategoryInModal = async (oldName, newName) => {
            newName = newName.trim();
            if(!newName || newName === oldName) { window.renderCategoryManager(); return; }
            if(galleryCategories.includes(newName)) { window.showToast("名稱已存在", true); window.renderCategoryManager(); return; }

            const idx = galleryCategories.indexOf(oldName);
            if(idx !== -1) {
                galleryCategories[idx] = newName;
                if(currentUser) {
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
                    galleryItems.forEach(item => {
                        if(item.category === oldName) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', item.id), { category: newName }, { merge: true });
                    });
                }
                if(currentGalleryCategory === oldName) currentGalleryCategory = newName;
                window.renderCategoryManager(); window.renderGallery();
            }
        };

        window.deleteCategoryInModal = async (catName) => {
            window.showConfirm('刪除分類', `確定要刪除「${catName}」？<br>此分類下的圖片將移至「未分類」。`, () => {
                if(currentUser) {
                    galleryItems.forEach(item => {
                        if(item.category === catName) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', item.id), { category: '未分類' }, { merge: true });
                    });
                }
                const idx = galleryCategories.indexOf(catName);
                if(idx !== -1) galleryCategories.splice(idx, 1);
                if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
                if(currentGalleryCategory === catName) currentGalleryCategory = '全部';
                window.renderCategoryManager(); window.renderGallery();
            });
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch (error) { window.showToast("連線驗證失敗", true); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                connectionDot.classList.replace('bg-red-500', 'bg-green-500');
                connectionStatus.textContent = '系統已連線並同步';
                setupPureRealtimeSync();
            } else {
                connectionDot.classList.replace('bg-green-500', 'bg-red-500');
                connectionStatus.textContent = '連線中或驗證失敗...';
            }
        });

        loadLocalFastCache();
        initAuth();
        window.switchTab(localStorage.getItem('activeTab') || 'daily');

        if (getLocal('work_cache_dark_mode', false)) {
            document.body.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                const icon = document.getElementById('darkModeIcon');
                if (icon) {
                    icon.setAttribute('data-lucide', 'sun');
                    lucide.createIcons();
                }
            });
        }
    </script>
</head>

                    </div>

                    <div class="relative w-full aspect-square bg-amber-50/80 border-2 border-dashed border-amber-300 rounded-lg flex flex-col items-center justify-center shadow-sm mt-8">
                        <i data-lucide="clipboard-list" class="w-4 h-4 text-amber-400 mb-0.5"></i>
                        <span class="text-amber-600 font-bold text-[8px] text-center leading-tight tracking-wider">地面層<br>大清點</span>
                        <div id="ext-pt_6" class="absolute inset-x-0 -bottom-2 flex flex-col items-center justify-center pointer-events-none z-30 translate-y-full"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Main Content (獨立圖庫存檔) -->
        <main id="galleryPage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] flex-col relative z-10 bg-[#fdfbf7]">
            <div class="p-3 border-b border-[#e6e2d6] flex space-x-2 bg-white shrink-0 shadow-sm z-20 relative">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="gallerySearchInput" placeholder="搜尋圖片標題或日期..." oninput="window.renderGallery()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-2 text-xs text-slate-700 placeholder-slate-400 focus:border-blue-400 focus:bg-white focus:outline-none tracking-wide">
                </div>
                <label class="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-2 rounded-lg flex items-center justify-center cursor-pointer active:bg-blue-100 text-[11px] font-bold tracking-wide transition-colors shadow-sm">
                    <i data-lucide="upload" class="w-4 h-4 mr-1"></i> 上傳
                    <input type="file" accept="image/*" multiple class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            </div>
            
            <div class="flex flex-1 overflow-hidden relative z-10">
                <div class="w-[75px] shrink-0 border-r border-[#e6e2d6] bg-[#f4f1eb] overflow-y-auto flex flex-col items-center space-y-2 scrollbar-hide" id="gallerySidebar">
                </div>
                <div class="flex-1 p-3 overflow-y-auto bg-[#fdfbf7] relative scrollbar-hide" id="galleryGrid">
                </div>
            </div>
        </main>

        <!-- Main Content (雪房紀錄) -->
        <main id="coldRoomPage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] flex-col relative z-10 bg-[#fdfbf7] overflow-hidden">
            <!-- Sub Header -->
            <div class="p-3 sm:p-4 border-b border-[#e6e2d6] bg-white shrink-0 shadow-sm z-20 relative flex flex-col space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-800 tracking-widest flex items-center"><i data-lucide="snowflake" class="w-4 h-4 mr-2 text-blue-500"></i>雪房存貨</h2>
                    <button onclick="window.crExportToCSV()" class="text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 p-1.5 rounded-full active:scale-95 transition-all shadow-sm border border-transparent hover:border-emerald-200"><i data-lucide="file-spreadsheet" class="w-4 h-4 pointer-events-none"></i></button>
                </div>
                
                <div class="flex bg-[#f0ebe1] rounded-lg p-1 shadow-inner border border-[#e5dfd3]">
                    <button id="crTabActive" onclick="window.crSwitchTab('active')" class="flex-1 py-1.5 px-0.5 text-[11px] sm:text-sm rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all tracking-widest text-center">存放中</button>
                    <button id="crTabHistory" onclick="window.crSwitchTab('history')" class="flex-1 py-1.5 px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all tracking-widest text-center">已清空/歷史</button>
                </div>
            </div>

            <!-- List Area -->
            <div class="flex-1 overflow-y-auto p-4 scrollbar-hide relative" id="crMainContent">
                <div id="crActiveControls" class="mb-4 flex justify-between items-center">
                    <div class="text-[11px] text-slate-500 font-bold tracking-widest">
                        目前存放: <span id="crActiveCount" class="text-blue-600 text-sm">0</span> 筆
                    </div>
                    <button onclick="window.crOpenAddModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold transition-colors shadow-sm flex items-center active:scale-95">
                        <i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i> 新增存放
                    </button>
                </div>
                <div id="crRecordsContainer" class="space-y-4 pb-20"></div>
            </div>
        </main>

    </div>

    <!-- 更多圖片 Modal -->
    <div id="archiveModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[400px] max-h-[80vh] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-base flex items-center"><i data-lucide="images" class="w-5 h-5 mr-2 text-blue-500"></i> 歷史圖庫</h2>
                <button onclick="window.closeArchive()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-6 h-6"></i></button>
            </header>
            <div id="archiveContent" class="flex-1 overflow-y-auto p-4 pb-6 scrollbar-hide bg-[#fdfbf7]">
            </div>
        </div>
    </div>

    <!-- 圖片放大預覽 Modal -->
    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col items-center justify-center p-4">
        <button onclick="document.getElementById('imageViewer').classList.add('hidden'); document.getElementById('imageViewer').classList.remove('flex');" class="absolute top-6 right-6 text-white bg-slate-800/80 p-2 rounded-full active:scale-95 shadow-lg border border-slate-600">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" />
    </div>

    <!-- 管理分類 Modal -->
    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="settings-2" class="w-4 h-4 mr-2 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[55vh] bg-[#fdfbf7] space-y-2 scrollbar-hide">
            </div>
        </div>
    </div>

    <!-- 自訂確認對話框 Modal (取代原生 confirm) -->
    <div id="customConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[10000] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[300px] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex items-center bg-slate-50">
                <h2 id="confirmModalTitle" class="text-slate-800 font-bold tracking-widest text-base flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> 確認</h2>
            </header>
            <div class="p-5 text-sm text-slate-600 tracking-wide leading-relaxed" id="confirmModalMessage">
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/50">
                <button id="confirmBtnCancel" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-bold transition-colors active:scale-95 shadow-sm">取消</button>
                <button id="confirmBtnOk" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-bold transition-colors active:scale-95 shadow-sm">確定</button>
            </div>
        </div>
    </div>

    <!-- 地圖排班管理 Modal -->
    <div id="scheduleManageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[340px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="users-round" class="w-4 h-4 mr-2 text-blue-500"></i> 管理成員排班時間表</h2>
                <button onclick="window.closeScheduleManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="scheduleManageList" class="p-3 overflow-y-auto max-h-[60vh] bg-[#fdfbf7] scrollbar-hide">
            </div>
        </div>
    </div>

    <!-- 雪房 新增 Modal -->
    <div id="crAddModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center border-b pb-2">
                <i data-lucide="package-plus" class="w-5 h-5 mr-2 text-blue-500"></i> 新增存放
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">檔主編號 / 名稱</label>
                    <input type="text" id="crInputTenant" placeholder="例如: A01, 陳記海鮮" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">貨物類型</label>
                    <div id="crTypeContainer" class="flex flex-wrap gap-2 mb-2"></div>
                    <div class="flex items-center mt-1">
                        <input type="text" id="crInputNewType" placeholder="新增類型..." class="flex-1 border border-slate-300 rounded-l-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner">
                        <button onclick="window.crAddNewType()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-r-lg border-y border-r border-slate-300 transition-colors shadow-sm">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">存放數量 (件/箱)</label>
                    <input type="number" id="crInputQuantity" placeholder="請輸入數量" min="1" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2 border-t border-slate-100 pt-4">
                <button onclick="window.crCloseAddModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitAddRecord()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-colors">確認存入</button>
            </div>
        </div>
    </div>

    <!-- 雪房 取出 Modal -->
    <div id="crWithdrawModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative">
            <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center border-b pb-2">
                <i data-lucide="package-minus" class="w-5 h-5 mr-2 text-amber-500"></i> 取出貨物
            </h3>
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 mb-4 shadow-inner">
                <div class="text-[11px] text-slate-500 mb-1">檔主: <span id="crWithdrawTenantDisplay" class="font-bold text-slate-700 text-xs"></span></div>
                <div class="text-[11px] text-slate-500">目前剩餘數量: <span id="crWithdrawRemainDisplay" class="font-bold text-blue-600 text-sm"></span></div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">本次取出數量</label>
                    <input type="number" id="crInputWithdrawQty" min="1" class="w-full border border-slate-300 rounded-lg p-2.5 text-xl focus:border-amber-500 focus:outline-none font-bold text-slate-700 text-center bg-white shadow-inner">
                </div>
            </div>
            <input type="hidden" id="crCurrentActionId">
            <div class="mt-6 flex justify-end space-x-2 border-t border-slate-100 pt-4">
                <button onclick="window.crCloseWithdrawModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitWithdraw()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-colors">確認取出</button>
            </div>
        </div>
    </div>

</body>
</html>
