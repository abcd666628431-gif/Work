<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV Studio - 極簡線上同步點播系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #fdf2f8 100%);
            color: #0f172a;
        }

        /* 隱藏滾動條但保留滾動功能 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }

        /* 簡約音樂動態音波動畫 */
        @keyframes eq-bar {
            0%, 100% { height: 22%; }
            50% { height: 100%; }
        }
        .eq-bar-1 { animation: eq-bar 0.8s ease-in-out infinite; }
        .eq-bar-2 { animation: eq-bar 0.55s ease-in-out infinite 0.2s; }
        .eq-bar-3 { animation: eq-bar 0.9s ease-in-out infinite 0.4s; }
        .eq-bar-4 { animation: eq-bar 0.65s ease-in-out infinite 0.1s; }
        .eq-paused span { animation-play-state: paused !important; height: 25% !important; }

        /* 影片收起時的平滑過渡（不可用 display:none 以免 YouTube IFrame 停止播放聲音） */
        .video-wrapper-expanded {
            max-height: 600px;
            opacity: 1;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .video-wrapper-collapsed {
            max-height: 0px !important;
            opacity: 0 !important;
            overflow: hidden !important;
            pointer-events: none !important;
            margin: 0 !important;
            border-width: 0 !important;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }

        /* 極簡細線滑桿 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 15px;
            width: 15px;
            border-radius: 50%;
            background: #4f46e5;
            border: 2px solid #ffffff;
            cursor: pointer;
            margin-top: -5.5px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.35);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #4338ca;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e0e7ff;
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white antialiased">

    <!-- 頂部極簡導覽列 -->
    <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-indigo-100/80 px-4 py-3 shadow-2xs">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Logo 與標題 -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-rose-500 text-white flex items-center justify-center shadow-sm shadow-indigo-200">
                    <i class="fa-solid fa-music text-sm"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2.5">
                        <h1 class="font-bold text-base sm:text-lg tracking-tight bg-gradient-to-r from-indigo-700 via-indigo-600 to-rose-600 bg-clip-text text-transparent">
                            KTV STUDIO
                        </h1>
                        <button id="syncStatusBadge" onclick="window.forcePullCloudState && window.forcePullCloudState()" title="點擊強制重新同步" class="cursor-pointer text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5 hover:bg-emerald-100 transition">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            同步連線中
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 hidden sm:block">主機播放影音・多人即時貼網址點歌與遙控</p>
                </div>
            </div>

            <!-- 右側模式切換與點歌人 -->
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <!-- 角色切換：主機端 vs 副機純點歌端 -->
                <div class="bg-indigo-50/70 p-1 rounded-xl border border-indigo-100 flex items-center text-xs">
                    <button id="roleHostBtn" onclick="setDeviceRole('host')" class="px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 bg-indigo-600 text-white shadow-xs">
                        <i class="fa-solid fa-tv"></i>
                        <span>主機播放端</span>
                    </button>
                    <button id="roleRemoteBtn" onclick="setDeviceRole('remote')" class="px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 text-slate-600 hover:text-indigo-700">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        <span>副機純點歌</span>
                    </button>
                </div>

                <!-- 點歌人暱稱設定 -->
                <div class="flex items-center bg-white border border-indigo-100 rounded-xl px-3 py-1.5 text-xs shadow-2xs focus-within:border-indigo-400 transition">
                    <i class="fa-regular fa-user text-indigo-500 mr-2"></i>
                    <span class="text-slate-400 mr-1 hidden md:inline">點歌人</span>
                    <input id="requesterNameInput" type="text" value="K歌之王" maxlength="12"
                        onchange="saveNickname(this.value)"
                        class="bg-transparent text-zinc-900 font-semibold w-20 sm:w-24 focus:outline-none focus:border-b border-indigo-600"
                        placeholder="輸入暱稱">
                </div>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側欄：播放器 ＋ 導播控台 (佔 7 欄) -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            
            <!-- 正在播放卡片 -->
            <div class="bg-white/95 backdrop-blur-xs border border-indigo-100/90 rounded-2xl p-4 sm:p-6 shadow-sm shadow-indigo-950/5 relative">
                
                <!-- 頂部狀態列與「收起/展開影片」按鈕 -->
                <div class="flex items-center justify-between gap-3 mb-4">
                    <div class="flex items-center gap-3 min-w-0">
                        <!-- 動態音波圖示 -->
                        <div id="equalizerIcon" class="w-8 h-8 rounded-xl bg-indigo-50 border border-indigo-100 flex items-end justify-center gap-0.5 p-2 shrink-0 eq-paused">
                            <span class="w-0.5 bg-indigo-600 rounded-full eq-bar-1"></span>
                            <span class="w-0.5 bg-rose-500 rounded-full eq-bar-2"></span>
                            <span class="w-0.5 bg-indigo-500 rounded-full eq-bar-3"></span>
                            <span class="w-0.5 bg-amber-500 rounded-full eq-bar-4"></span>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-md bg-rose-50 text-rose-600 border border-rose-200/80">
                                    PLAYING
                                </span>
                                <span id="nowPlayingRequester" class="text-xs text-slate-500 truncate">
                                    尚未點播歌曲
                                </span>
                            </div>
                            <h2 id="nowPlayingTitle" class="text-base sm:text-lg font-bold text-zinc-900 break-words leading-snug mt-1">
                                請從右側貼上 YouTube 網址開始點歌
                            </h2>
                        </div>
                    </div>

                    <!-- 收起 / 展開播放中影片按鈕 -->
                    <button id="toggleVideoCollapseBtn" onclick="toggleVideoCollapse()" 
                        class="shrink-0 px-3 py-1.5 rounded-xl bg-indigo-50/70 hover:bg-indigo-100/80 active:scale-95 text-indigo-700 border border-indigo-200/70 text-xs font-medium flex items-center gap-1.5 transition">
                        <i id="toggleVideoIcon" class="fa-solid fa-chevron-up text-indigo-500"></i>
                        <span id="toggleVideoText">收起影片</span>
                    </button>
                </div>

                <!-- 影片收起時的迷你音樂橫幅 -->
                <div id="collapsedAudioBanner" class="hidden mb-4 p-3.5 rounded-xl bg-gradient-to-r from-indigo-50/90 to-rose-50/70 border border-indigo-100 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3 min-w-0">
                        <img id="collapsedThumb" src="https://placehold.co/120x90/eef2ff/4f46e5?text=KTV" alt="縮圖" class="w-14 h-10 object-cover rounded-lg border border-indigo-200/80 shrink-0">
                        <div class="min-w-0">
                            <p id="collapsedModeHint" class="text-xs font-semibold text-indigo-900 flex items-center gap-1.5">
                                <i class="fa-solid fa-headphones text-indigo-600"></i>
                                <span>已收起影片畫面（背景音樂持續播放中）</span>
                            </p>
                            <p id="collapsedSubTitle" class="text-xs text-indigo-600/80 truncate mt-0.5">點擊右上角「展開影片」可隨時恢復畫面</p>
                        </div>
                    </div>
                    <button id="expandBannerBtn" onclick="toggleVideoCollapse()" class="px-3 py-1.5 rounded-lg bg-white hover:bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-medium shrink-0 transition shadow-2xs">
                        展開畫面
                    </button>
                </div>

                <!-- YouTube 影片播放器容器 -->
                <div id="videoCollapsibleWrapper" class="video-wrapper-expanded relative w-full rounded-xl overflow-hidden bg-zinc-950 border border-indigo-100 mb-4 shadow-inner">
                    <div class="aspect-video w-full relative">
                        <div id="yt-player" class="w-full h-full"></div>

                        <!-- 待機空狀態遮罩 -->
                        <div id="idlePlayerOverlay" class="absolute inset-0 bg-gradient-to-br from-slate-50 via-indigo-50/40 to-rose-50/40 flex flex-col items-center justify-center p-6 text-center z-10">
                            <div class="w-12 h-12 rounded-2xl bg-white border border-rose-100 shadow-sm flex items-center justify-center mb-3">
                                <i class="fa-brands fa-youtube text-2xl text-rose-600"></i>
                            </div>
                            <h3 class="text-base font-bold text-zinc-900 mb-1">目前沒有正在播放的歌曲</h3>
                            <p class="text-xs text-slate-500 max-w-sm mb-4">
                                複製任何 YouTube 音樂或伴奏網址貼到右側點歌台，或點擊下方按鈕快速載入試聽。
                            </p>
                            <button onclick="addDemoSongs()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium shadow-xs shadow-indigo-200 transition flex items-center gap-2">
                                <i class="fa-solid fa-play text-[10px]"></i>
                                載入 3 首測試歌曲
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 播放時間軸與進度條 -->
                <div class="mb-4">
                    <div class="flex items-center justify-between gap-2 text-xs text-slate-400 font-mono mb-1.5">
                        <span id="currentTimeText" class="shrink-0">00:00</span>
                        <span id="nextSongPreviewText" class="text-slate-500 break-words text-center font-sans">
                            下一首：尚無待播歌曲
                        </span>
                        <span id="durationTimeText" class="shrink-0">00:00</span>
                    </div>
                    <input id="progressSlider" type="range" min="0" max="100" value="0" step="1"
                        oninput="onSeekSliderInput(this.value)"
                        onchange="onSeekSliderChange(this.value)"
                        class="w-full">
                </div>

                <!-- KTV 導播控制面板 -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center pt-3 border-t border-slate-100">
                    
                    <!-- 主要控制按鈕群 (7欄) -->
                    <div class="sm:col-span-7 flex items-center justify-center sm:justify-start gap-2 flex-wrap">
                        <!-- 播放 / 暫停 -->
                        <button id="playPauseBtn" onclick="triggerPlayPause()" 
                            class="flex-1 sm:flex-initial px-4 py-2 rounded-xl bg-indigo-50/80 hover:bg-indigo-100 active:scale-95 text-indigo-900 font-medium text-xs sm:text-sm flex items-center justify-center gap-2 border border-indigo-200/70 transition">
                            <i id="playPauseIcon" class="fa-solid fa-play text-indigo-600"></i>
                            <span id="playPauseText">播放</span>
                        </button>

                        <!-- 重唱本首 -->
                        <button onclick="triggerReplayCurrent()" 
                            class="px-3.5 py-2 rounded-xl bg-white hover:bg-amber-50/70 active:scale-95 text-zinc-700 hover:text-amber-700 font-medium text-xs sm:text-sm flex items-center justify-center gap-1.5 border border-slate-200 hover:border-amber-200 transition"
                            title="從頭重唱這首歌">
                            <i class="fa-solid fa-rotate-left text-amber-500"></i>
                            <span>重唱</span>
                        </button>

                        <!-- 切歌 / 跳下一首 -->
                        <button onclick="triggerSkipNext()" 
                            class="flex-1 sm:flex-initial px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-rose-500 hover:from-indigo-700 hover:to-rose-600 active:scale-95 text-white font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm shadow-indigo-200 transition">
                            <i class="fa-solid fa-forward-step"></i>
                            <span>切歌 (下一首)</span>
                        </button>
                    </div>

                    <!-- 音量控制區 (5欄) -->
                    <div class="sm:col-span-5 flex items-center gap-2 bg-indigo-50/50 px-3 py-2 rounded-xl border border-indigo-100/80">
                        <button id="muteToggleBtn" onclick="triggerToggleMute()" class="text-indigo-600 hover:text-indigo-800 transition w-5 text-center" title="靜音開關">
                            <i id="volumeIcon" class="fa-solid fa-volume-high text-indigo-600 text-xs"></i>
                        </button>
                        <button onclick="adjustVolumeByStep(-10)" class="text-xs text-slate-400 hover:text-indigo-600 px-1" title="減小音量">
                            <i class="fa-solid fa-minus text-[10px]"></i>
                        </button>
                        <input id="volumeSlider" type="range" min="0" max="100" value="80" 
                            oninput="triggerVolumeChange(this.value)"
                            class="flex-1">
                        <button onclick="adjustVolumeByStep(10)" class="text-xs text-slate-400 hover:text-indigo-600 px-1" title="加大音量">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                        <span id="volumeValueText" class="text-[11px] font-mono font-semibold text-indigo-900 w-8 text-right">80%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右側欄：貼網址點歌區 ＋ 待播清單 (佔 5 欄) -->
        <section class="lg:col-span-5 flex flex-col gap-4">
            
            <!-- 貼上 YouTube 網址點歌卡片 -->
            <div class="bg-white/95 backdrop-blur-xs border border-indigo-100/90 rounded-2xl p-4 sm:p-5 shadow-sm shadow-indigo-950/5">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-sm text-zinc-900 flex items-center gap-2">
                        <span class="w-5 h-5 rounded-md bg-rose-50 text-rose-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-plus"></i>
                        </span>
                        <span>貼上 YouTube 連結點歌</span>
                    </h3>
                </div>

                <!-- 網址輸入框與送出 -->
                <form onsubmit="handleAddSongSubmit(event)" class="flex flex-col gap-2.5">
                    <div class="relative flex-1">
                        <i class="fa-brands fa-youtube absolute left-3.5 top-1/2 -translate-y-1/2 text-rose-500 text-sm"></i>
                        <input id="youtubeUrlInput" type="text" required
                            placeholder="貼上 YouTube 網址 (例如 https://youtu.be/...)"
                            class="w-full pl-9 pr-8 py-2.5 rounded-xl bg-slate-50/80 border border-slate-200 text-xs sm:text-sm text-zinc-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/10 transition">
                        <button type="button" onclick="clearUrlInput()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-zinc-700">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <!-- 加入待播歌單 -->
                        <button type="submit" id="submitSongBtn"
                            class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold text-xs sm:text-sm shadow-xs shadow-indigo-200 flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>加入歌單</span>
                        </button>
                        <!-- 直接插播為下一首 -->
                        <button type="button" onclick="handleAddSongAndPrioritize()"
                            class="py-2.5 px-3.5 rounded-xl bg-rose-50 hover:bg-rose-100/80 text-rose-700 border border-rose-200/80 font-medium text-xs sm:text-sm flex items-center justify-center gap-1.5 transition"
                            title="直接排到下一首播放">
                            <i class="fa-solid fa-arrow-up text-xs text-rose-500"></i>
                            <span>直接插播</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 待播歌單 / 已播紀錄 卡片 -->
            <div class="bg-white/95 backdrop-blur-xs border border-indigo-100/90 rounded-2xl p-4 sm:p-5 shadow-sm shadow-indigo-950/5 flex-1 flex flex-col min-h-[380px]">
                <!-- 分頁切換 Header -->
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                    <div class="flex items-center gap-1.5">
                        <button id="tabQueueBtn" onclick="switchListTab('queue')" 
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white flex items-center gap-2 transition">
                            <span>待播清單</span>
                            <span id="queueCountBadge" class="px-1.5 py-0.2 rounded-full bg-white/25 text-white text-[10px]">0</span>
                        </button>
                        <button id="tabHistoryBtn" onclick="switchListTab('history')" 
                            class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-indigo-700 hover:bg-indigo-50/60 flex items-center gap-1.5 transition">
                            <span>已播紀錄</span>
                            <span id="historyCountBadge" class="px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600 text-[10px]">0</span>
                        </button>
                    </div>

                    <button id="clearQueueBtn" onclick="triggerClearQueue()" class="text-xs text-slate-400 hover:text-rose-600 transition flex items-center gap-1">
                        <i class="fa-regular fa-trash-can text-[11px]"></i>
                        <span>清空</span>
                    </button>
                </div>

                <!-- 待播清單容器 -->
                <div id="queueListContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 max-h-[420px]">
                    <!-- 由 JS 動態渲染 -->
                </div>

                <!-- 已播歷史容器 (預設隱藏) -->
                <div id="historyListContainer" class="hidden flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 max-h-[420px]">
                    <!-- 由 JS 動態渲染 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 右下角即時推播通知 (Toast) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-xs sm:max-w-sm pointer-events-none"></div>

    <!-- Firebase 模組化載入與即時同步邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJCSMVoYWq_bn-mfxm3KJliVc5FLKVz2I",
            authDomain: "music-3d477.firebaseapp.com",
            projectId: "music-3d477",
            storageBucket: "music-3d477.firebasestorage.app",
            messagingSenderId: "110035837514",
            appId: "1:110035837514:web:0374249038ae0d9911bcb3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const roomDocRef = doc(db, 'ktv_rooms', 'main_room');

        window.isCloudReady = false;

        // 寫入完整雲端狀態的橋接函式
        window.pushStateToCloud = async (stateToSave) => {
            if (!window.isCloudReady) return;
            try {
                const cleanState = JSON.parse(JSON.stringify(stateToSave));
                await setDoc(roomDocRef, cleanState);
            } catch (err) {
                console.error("雲端同步寫入失敗:", err);
                updateSyncBadge(false, '本地分頁同步模式');
            }
        };

        // 僅更新播放時間與長度的輕量函式（避免覆蓋副機剛點的歌單）
        window.pushProgressToCloud = async (currentTime, duration) => {
            if (!window.isCloudReady) return;
            try {
                await updateDoc(roomDocRef, {
                    currentTime: currentTime,
                    duration: duration
                });
            } catch (err) {}
        };

        // 手動強制拉取最新雲端狀態
        window.forcePullCloudState = async () => {
            try {
                const snap = await getDoc(roomDocRef);
                if (snap.exists()) {
                    window.applyIncomingState(snap.data(), 'cloud', true);
                    if (typeof showToast === 'function') showToast('已強制同步最新雲端歌單');
                }
            } catch (e) {
                if (typeof showToast === 'function') showToast('目前使用本地跨分頁同步模式', 'warning');
            }
        };

        function updateSyncBadge(connected, customText = '') {
            const badge = document.getElementById('syncStatusBadge');
            if (!badge) return;
            if (connected) {
                badge.className = "cursor-pointer text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5 hover:bg-emerald-100 transition";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>${customText || '雲端即時同步中'}`;
            } else {
                badge.className = "cursor-pointer text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 flex items-center gap-1.5 hover:bg-amber-100 transition";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>${customText || '本地分頁同步模式'}`;
            }
        }

        function initFirebaseSync() {
            onSnapshot(roomDocRef, (snapshot) => {
                window.isCloudReady = true;
                updateSyncBadge(true, '雲端即時同步中');
                if (snapshot.exists()) {
                    const cloudData = snapshot.data();
                    if (typeof window.applyIncomingState === 'function') {
                        window.applyIncomingState(cloudData, 'cloud');
                    }
                } else if (window.roomState) {
                    window.pushStateToCloud(window.roomState);
                }
            }, (error) => {
                console.error("雲端監聽發生錯誤，啟用跨分頁本地同步備援:", error);
                window.isCloudReady = false;
                updateSyncBadge(false, '本地分頁同步模式');
            });
        }

        initFirebaseSync();
    </script>

    <!-- YouTube IFrame API 與核心邏輯 -->
    <script>
        /********************************************************************
         * 1. 全域狀態設計 (Firebase Firestore + BroadcastChannel 雙重即時同步)
         ********************************************************************/
        const clientId = 'client_' + Math.random().toString(36).substring(2, 9);
        let deviceRole = 'host'; // 'host' (主機播放端) | 'remote' (副機純點歌端)
        let isVideoCollapsed = false; // 是否收起正在播放的影片
        let hasInitialSync = false; // 是否已完成初次同步對齊

        window.roomState = {
            currentSong: null,
            queue: [],
            history: [],
            isPlaying: true,
            volume: 80,
            isMuted: false,
            currentTime: 0,
            duration: 0,
            replayNonce: 0,
            seekToSeconds: null,
            seekNonce: 0,
            lastActionToast: null,
            stateVersion: 0,
            updatedBy: clientId,
            updatedAt: 0
        };
        let roomState = window.roomState;

        // 跨分頁毫秒級同步備援 (BroadcastChannel & localStorage)
        const localChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('ktv_studio_sync_channel') : null;
        if (localChannel) {
            localChannel.onmessage = (event) => {
                if (event.data && event.data.updatedBy !== clientId) {
                    window.applyIncomingState(event.data, 'local');
                }
            };
        }
        window.addEventListener('storage', (event) => {
            if (event.key === 'ktv_studio_backup_state' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    if (parsed && parsed.updatedBy !== clientId) {
                        window.applyIncomingState(parsed, 'local');
                    }
                } catch (e) {}
            }
        });

        let ytPlayer = null;
        let isPlayerReady = false;
        let loadedVideoId = null;
        let isTransitioningVideo = false;
        let lastHandledReplayNonce = 0;
        let lastHandledSeekNonce = 0;
        let lastHandledToastTime = 0;
        let isDraggingSeekSlider = false;
        let progressInterval = null;
        let volumeSyncTimer = null;
        let lastTimeCloudSync = 0;

        /********************************************************************
         * 2. 初始化與載入 YouTube IFrame Player API
         ********************************************************************/
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = sessionStorage.getItem('ktv_requester_name');
            if (savedName) {
                document.getElementById('requesterNameInput').value = savedName;
            }

            // 若本地有備份狀態且雲端尚未載入，先讀取本地狀態
            const localSaved = localStorage.getItem('ktv_studio_backup_state');
            if (localSaved && !hasInitialSync) {
                try {
                    const parsed = JSON.parse(localSaved);
                    if (parsed) window.applyIncomingState(parsed, 'local');
                } catch (e) {}
            }

            renderAllUI();

            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            progressInterval = setInterval(updateProgressBarUI, 500);
        });

        function onYouTubeIframeAPIReady() {
            const safeOrigin = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('blob:'))
                ? window.location.origin
                : 'https://www.youtube.com';

            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: '',
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'origin': safeOrigin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });

            const iframeEl = document.getElementById('yt-player');
            if (iframeEl && iframeEl.tagName === 'IFRAME') {
                iframeEl.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
            }
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            syncPlayerWithRoomState();
        }

        function onPlayerStateChange(event) {
            if (deviceRole !== 'host') return;

            // 當影片播放完畢 (YT.PlayerState.ENDED === 0)，自動無縫切換下一首
            if (event.data === YT.PlayerState.ENDED) {
                playNextSongFromQueue();
            } else if (event.data === YT.PlayerState.PLAYING) {
                isTransitioningVideo = false;
                const dur = ytPlayer.getDuration ? Math.floor(ytPlayer.getDuration() || 0) : 0;
                let needSync = false;
                if (dur > 0 && roomState.duration !== dur) {
                    roomState.duration = dur;
                    needSync = true;
                }
                if (!roomState.isPlaying) {
                    roomState.isPlaying = true;
                    needSync = true;
                }
                if (needSync) syncRoomState(null);
            } else if (event.data === YT.PlayerState.PAUSED) {
                // 忽略切換歌曲或跳轉瞬間產生的假性暫停事件
                if (isTransitioningVideo) return;
                if (roomState.isPlaying && roomState.currentSong) {
                    roomState.isPlaying = false;
                    syncRoomState(null);
                }
            }
        }

        function onPlayerError(event) {
            if (deviceRole !== 'host') return;
            console.warn('YouTube 播放發生錯誤代碼:', event.data);
            if (event.data === 153) {
                showToast('播放器網域驗證限制（錯誤 153），請嘗試重新整理或於獨立視窗開啟', 'error');
                return;
            }
            showToast('該影片無法在外部嵌入播放，3 秒後自動跳下一首', 'warning');
            setTimeout(() => {
                if (roomState.queue.length > 0 || roomState.currentSong) {
                    playNextSongFromQueue();
                }
            }, 3000);
        }

        /********************************************************************
         * 3. 同步核心層 (Firebase Firestore + BroadcastChannel 即時雙向同步)
         ********************************************************************/
        function syncRoomState(toastMessage = null) {
            hasInitialSync = true;
            roomState.stateVersion = (roomState.stateVersion || 0) + 1;
            roomState.updatedAt = Date.now();
            roomState.updatedBy = clientId;

            if (toastMessage) {
                roomState.lastActionToast = {
                    message: toastMessage,
                    timestamp: Date.now()
                };
                lastHandledToastTime = roomState.lastActionToast.timestamp;
                showToast(toastMessage);
            }

            // 1. 寫入 Firebase 雲端
            if (typeof window.pushStateToCloud === 'function') {
                window.pushStateToCloud(roomState);
            }

            // 2. 寫入本地跨分頁通道與 LocalStorage 備援
            try {
                if (localChannel) localChannel.postMessage(roomState);
                localStorage.setItem('ktv_studio_backup_state', JSON.stringify(roomState));
            } catch (e) {}

            renderAllUI();
            syncPlayerWithRoomState();
        }

        window.applyIncomingState = function(newState, source = 'cloud', forceApply = false) {
            if (!newState) return;

            // 若是自己剛發出的舊快照回音，直接忽略避免閃爍；若是其他裝置發出的更新則無條件接收
            if (!forceApply && hasInitialSync && source === 'cloud' && newState.updatedBy === clientId) {
                if ((newState.stateVersion || 0) < (roomState.stateVersion || 0)) {
                    return;
                }
            }

            // 初次收到遠端狀態時，直接對齊 Nonce 與 Toast 時間戳，避免新開網頁誤觸發舊指令
            if (!hasInitialSync) {
                hasInitialSync = true;
                lastHandledReplayNonce = newState.replayNonce || 0;
                lastHandledSeekNonce = newState.seekNonce || 0;
                lastHandledToastTime = (newState.lastActionToast && newState.lastActionToast.timestamp)
                    ? newState.lastActionToast.timestamp
                    : Date.now();
            }

            roomState = {
                ...roomState,
                ...newState,
                queue: Array.isArray(newState.queue) ? newState.queue : [],
                history: Array.isArray(newState.history) ? newState.history : []
            };
            window.roomState = roomState;

            // 同步更新本地備份
            try {
                localStorage.setItem('ktv_studio_backup_state', JSON.stringify(roomState));
            } catch (e) {}

            if (roomState.lastActionToast && roomState.lastActionToast.timestamp > lastHandledToastTime) {
                lastHandledToastTime = roomState.lastActionToast.timestamp;
                showToast(roomState.lastActionToast.message);
            }

            renderAllUI();
            syncPlayerWithRoomState();
        };

        /********************************************************************
         * 4. 播放器與狀態同步邏輯 (Mode A：僅主機播放端控制 YouTube 實例)
         ********************************************************************/
        function syncPlayerWithRoomState() {
            if (!isPlayerReady || !ytPlayer) return;

            if (deviceRole === 'remote') {
                if (loadedVideoId !== null) {
                    try { ytPlayer.stopVideo(); } catch (e) {}
                    loadedVideoId = null;
                }
                return;
            }

            const current = roomState.currentSong;
            const idleOverlay = document.getElementById('idlePlayerOverlay');

            if (!current) {
                idleOverlay.classList.remove('hidden');
                if (loadedVideoId !== null) {
                    try { ytPlayer.stopVideo(); } catch (e) {}
                    loadedVideoId = null;
                }
                return;
            }

            idleOverlay.classList.add('hidden');

            // 切換新歌曲時加上過渡保護鎖，避免觸發假性 PAUSED
            if (loadedVideoId !== current.videoId) {
                loadedVideoId = current.videoId;
                isTransitioningVideo = true;
                setTimeout(() => { isTransitioningVideo = false; }, 1500);
                ytPlayer.loadVideoById(current.videoId);
            }

            // 檢查重唱指令
            if (roomState.replayNonce && roomState.replayNonce > lastHandledReplayNonce) {
                lastHandledReplayNonce = roomState.replayNonce;
                isTransitioningVideo = true;
                setTimeout(() => { isTransitioningVideo = false; }, 1000);
                ytPlayer.seekTo(0, true);
                ytPlayer.playVideo();
            }

            // 檢查拉動進度條指令 (主機與副機皆可遙控跳轉)
            if (roomState.seekNonce && roomState.seekNonce > lastHandledSeekNonce) {
                lastHandledSeekNonce = roomState.seekNonce;
                if (typeof roomState.seekToSeconds === 'number') {
                    isTransitioningVideo = true;
                    setTimeout(() => { isTransitioningVideo = false; }, 1000);
                    ytPlayer.seekTo(roomState.seekToSeconds, true);
                }
            }

            // 同步播放/暫停狀態
            const playerState = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
            if (roomState.isPlaying && playerState !== YT.PlayerState.PLAYING && playerState !== YT.PlayerState.BUFFERING) {
                ytPlayer.playVideo();
            } else if (!roomState.isPlaying && playerState === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            }

            // 同步音量與靜音狀態
            if (roomState.isMuted) {
                ytPlayer.mute();
            } else {
                ytPlayer.unMute();
                ytPlayer.setVolume(roomState.volume);
            }
        }

        /********************************************************************
         * 5. 收起 / 展開播放中影片 & 主機/副機切換
         ********************************************************************/
        function toggleVideoCollapse() {
            if (deviceRole === 'remote') {
                showToast('副機純點歌模式預設隱藏影片，如需觀看畫面請切換至「主機播放端」');
                return;
            }
            isVideoCollapsed = !isVideoCollapsed;
            updateVideoCollapseUI();
        }

        function updateVideoCollapseUI() {
            const wrapper = document.getElementById('videoCollapsibleWrapper');
            const banner = document.getElementById('collapsedAudioBanner');
            const btnIcon = document.getElementById('toggleVideoIcon');
            const btnText = document.getElementById('toggleVideoText');
            const expandBannerBtn = document.getElementById('expandBannerBtn');
            const modeHint = document.getElementById('collapsedModeHint');
            const subTitle = document.getElementById('collapsedSubTitle');

            const shouldCollapse = isVideoCollapsed || deviceRole === 'remote';

            if (shouldCollapse) {
                wrapper.classList.remove('video-wrapper-expanded');
                wrapper.classList.add('video-wrapper-collapsed');
                banner.classList.remove('hidden');
                btnIcon.className = 'fa-solid fa-chevron-down text-indigo-500';
                btnText.textContent = '展開影片';

                if (deviceRole === 'remote') {
                    modeHint.innerHTML = '<i class="fa-solid fa-mobile-screen-button text-indigo-600"></i><span>副機純點歌模式（本機不發聲，遠端遙控主機）</span>';
                    subTitle.textContent = '可同步貼網址點歌、插播、切歌、拉動進度或調整主機音量';
                    if (expandBannerBtn) expandBannerBtn.classList.add('hidden');
                } else {
                    modeHint.innerHTML = '<i class="fa-solid fa-headphones text-indigo-600"></i><span>已收起影片畫面（背景音樂持續播放中）</span>';
                    subTitle.textContent = '點擊右上角「展開影片」可隨時恢復畫面';
                    if (expandBannerBtn) expandBannerBtn.classList.remove('hidden');
                }
            } else {
                wrapper.classList.remove('video-wrapper-collapsed');
                wrapper.classList.add('video-wrapper-expanded');
                banner.classList.add('hidden');
                btnIcon.className = 'fa-solid fa-chevron-up text-indigo-500';
                btnText.textContent = '收起影片';
            }
        }

        function setDeviceRole(role) {
            deviceRole = role;
            const hostBtn = document.getElementById('roleHostBtn');
            const remoteBtn = document.getElementById('roleRemoteBtn');

            if (role === 'host') {
                hostBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 bg-indigo-600 text-white shadow-xs';
                remoteBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 text-slate-600 hover:text-indigo-700';
                showToast('已切換為主機播放端');
            } else {
                remoteBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 bg-indigo-600 text-white shadow-xs';
                hostBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 text-slate-600 hover:text-indigo-700';
                showToast('已切換為副機純點歌端（本機靜音）');
            }

            updateVideoCollapseUI();
            syncPlayerWithRoomState();
        }

        /********************************************************************
         * 6. 點歌、解析 YouTube 網址、抓取歌名與縮圖
         ********************************************************************/
        function extractYouTubeId(inputUrl) {
            if (!inputUrl) return null;
            const trimmed = inputUrl.trim();
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = trimmed.match(regex);
            if (match && match[1]) return match[1];
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            return null;
        }

        async function fetchYouTubeMetadata(videoId, fallbackTitle = null) {
            const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const thumbnail = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
            try {
                const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(watchUrl)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.title) {
                        return {
                            title: data.title,
                            author: data.author_name || 'YouTube 音樂',
                            thumbnail: thumbnail
                        };
                    }
                }
            } catch (e) {
                console.warn('Noembed 抓取標題失敗，使用預設標題:', e);
            }
            return {
                title: fallbackTitle || `YouTube 點播歌曲 (${videoId})`,
                author: 'YouTube KTV',
                thumbnail: thumbnail
            };
        }

        async function addSongByUrl(url, prioritize = false, customTitle = null) {
            const videoId = extractYouTubeId(url);
            if (!videoId) {
                showToast('無法識別此 YouTube 網址，請確認連結格式', 'error');
                return false;
            }

            const submitBtn = document.getElementById('submitSongBtn');
            const originalHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>讀取中...</span>';

            const meta = await fetchYouTubeMetadata(videoId, customTitle);
            const requester = document.getElementById('requesterNameInput').value.trim() || '神秘歌友';

            const newSong = {
                id: 'song_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                videoId: videoId,
                title: meta.title,
                author: meta.author,
                thumbnail: meta.thumbnail,
                requester: requester,
                addedAt: Date.now()
            };

            submitBtn.disabled = false;
            submitBtn.innerHTML = originalHtml;

            if (!roomState.currentSong) {
                roomState.currentSong = newSong;
                roomState.isPlaying = true;
                roomState.currentTime = 0;
                roomState.duration = 0;
                syncRoomState(`${requester} 點播了《${newSong.title}》，立即播放`);
            } else if (prioritize) {
                roomState.queue.unshift(newSong);
                syncRoomState(`${requester} 插播了《${newSong.title}》到下一首`);
            } else {
                roomState.queue.push(newSong);
                syncRoomState(`${requester} 點播了《${newSong.title}》`);
            }

            return true;
        }

        async function handleAddSongSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('youtubeUrlInput');
            const success = await addSongByUrl(input.value, false);
            if (success) input.value = '';
        }

        async function handleAddSongAndPrioritize() {
            const input = document.getElementById('youtubeUrlInput');
            if (!input.value.trim()) {
                showToast('請先在輸入框貼上 YouTube 網址', 'warning');
                input.focus();
                return;
            }
            const success = await addSongByUrl(input.value, true);
            if (success) input.value = '';
        }

        async function addDemoSongs() {
            const demos = [
                { url: 'https://www.youtube.com/watch?v=K4DyBUG242c', title: 'Cartoon - On & On (NCS 經典曲目)' },
                { url: 'https://www.youtube.com/watch?v=bM7SZ5SBzyY', title: 'Alan Walker - Fade' },
                { url: 'https://www.youtube.com/watch?v=jfKfPfyJRdk', title: 'Lofi Hip Hop Radio - 暖場背景音樂' }
            ];
            for (const d of demos) {
                await addSongByUrl(d.url, false, d.title);
            }
        }

        /********************************************************************
         * 7. KTV 導播控制功能：切歌、插播、重唱、音量調整、刪除
         ********************************************************************/
        function playNextSongFromQueue(customToast = null) {
            if (roomState.currentSong) {
                roomState.history.unshift({
                    ...roomState.currentSong,
                    playedAt: Date.now()
                });
                if (roomState.history.length > 30) roomState.history.pop();
            }

            roomState.currentTime = 0;
            roomState.duration = 0;

            if (roomState.queue.length > 0) {
                const nextSong = roomState.queue.shift();
                roomState.currentSong = nextSong;
                roomState.isPlaying = true;
                syncRoomState(customToast || `已切歌，現在播放：${nextSong.requester} 點的《${nextSong.title}》`);
            } else {
                roomState.currentSong = null;
                roomState.isPlaying = false;
                syncRoomState('待播清單已全數播畢');
            }
        }

        function triggerSkipNext() {
            if (!roomState.currentSong && roomState.queue.length === 0) {
                showToast('目前沒有正在播放或待播的歌曲', 'warning');
                return;
            }
            const requester = document.getElementById('requesterNameInput').value.trim() || '歌友';
            playNextSongFromQueue(`${requester} 切歌，跳至下一首`);
        }

        function triggerPrioritizeSong(index) {
            if (index <= 0 || index >= roomState.queue.length) return;
            const [targetSong] = roomState.queue.splice(index, 1);
            roomState.queue.unshift(targetSong);
            const requester = document.getElementById('requesterNameInput').value.trim() || '歌友';
            syncRoomState(`${requester} 將《${targetSong.title}》插播為下一首`);
        }

        function triggerRemoveFromQueue(index) {
            if (index < 0 || index >= roomState.queue.length) return;
            const [removed] = roomState.queue.splice(index, 1);
            syncRoomState(`已移除《${removed.title}》`);
        }

        function triggerPlayPause() {
            if (!roomState.currentSong) {
                if (roomState.queue.length > 0) {
                    playNextSongFromQueue();
                } else {
                    showToast('請先點播歌曲', 'warning');
                }
                return;
            }
            roomState.isPlaying = !roomState.isPlaying;
            syncRoomState(roomState.isPlaying ? '繼續播放' : '已暫停');
        }

        function triggerReplayCurrent() {
            if (!roomState.currentSong) {
                showToast('目前沒有正在播放的歌曲', 'warning');
                return;
            }
            roomState.replayNonce = (roomState.replayNonce || 0) + 1;
            roomState.currentTime = 0;
            roomState.isPlaying = true;
            const requester = document.getElementById('requesterNameInput').value.trim() || '歌友';
            syncRoomState(`${requester} 按下重唱本首`);
        }

        function triggerVolumeChange(val) {
            const numVal = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
            roomState.volume = numVal;
            if (numVal > 0 && roomState.isMuted) {
                roomState.isMuted = false;
            }
            renderVolumeUI();
            if (deviceRole === 'host' && isPlayerReady && ytPlayer) {
                ytPlayer.unMute();
                ytPlayer.setVolume(roomState.volume);
            }
            clearTimeout(volumeSyncTimer);
            volumeSyncTimer = setTimeout(() => {
                syncRoomState(null);
            }, 150);
        }

        function adjustVolumeByStep(delta) {
            const newVol = Math.max(0, Math.min(100, (roomState.volume || 0) + delta));
            triggerVolumeChange(newVol);
        }

        function triggerToggleMute() {
            roomState.isMuted = !roomState.isMuted;
            syncRoomState(roomState.isMuted ? '主機已靜音' : `恢復音量 (${roomState.volume}%)`);
        }

        function triggerClearQueue() {
            if (roomState.queue.length === 0) return;
            roomState.queue = [];
            syncRoomState('已清空所有待播歌曲');
        }

        /********************************************************************
         * 8. 進度條更新與拉動跳轉 (支援主機與副機雙向同步，不覆蓋歌單)
         ********************************************************************/
        function formatTime(sec) {
            if (!sec || isNaN(sec) || sec < 0) return '00:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateProgressBarUI() {
            if (!roomState.currentSong) return;

            if (deviceRole === 'host' && isPlayerReady && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                const current = Math.floor(ytPlayer.getCurrentTime() || 0);
                const duration = Math.floor(ytPlayer.getDuration() || 0);

                roomState.currentTime = current;
                if (duration > 0) roomState.duration = duration;

                document.getElementById('currentTimeText').textContent = formatTime(current);
                document.getElementById('durationTimeText').textContent = formatTime(duration);

                if (!isDraggingSeekSlider && duration > 0) {
                    const percent = Math.min(100, Math.round((current / duration) * 100));
                    document.getElementById('progressSlider').value = percent;
                }

                // 每 3 秒僅局部更新播放秒數與長度給副機，絕不覆蓋 queue 待播清單
                const now = Date.now();
                if (roomState.isPlaying && duration > 0 && now - lastTimeCloudSync > 3000) {
                    lastTimeCloudSync = now;
                    if (typeof window.pushProgressToCloud === 'function') {
                        window.pushProgressToCloud(current, duration);
                    }
                    if (localChannel) localChannel.postMessage(roomState);
                }
            } else if (deviceRole === 'remote') {
                // 副機端根據同步的秒數與長度顯示進度
                const current = roomState.currentTime || 0;
                const duration = roomState.duration || 0;
                document.getElementById('currentTimeText').textContent = formatTime(current);
                document.getElementById('durationTimeText').textContent = formatTime(duration);
                if (!isDraggingSeekSlider && duration > 0) {
                    const percent = Math.min(100, Math.round((current / duration) * 100));
                    document.getElementById('progressSlider').value = percent;
                }
            }
        }

        function onSeekSliderInput(percentValue) {
            isDraggingSeekSlider = true;
            const duration = roomState.duration || 0;
            if (duration > 0) {
                const previewSec = Math.floor((percentValue / 100) * duration);
                document.getElementById('currentTimeText').textContent = formatTime(previewSec);
            }
        }

        function onSeekSliderChange(percentValue) {
            isDraggingSeekSlider = false;
            if (!roomState.currentSong) return;

            const playerDuration = (deviceRole === 'host' && ytPlayer && typeof ytPlayer.getDuration === 'function')
                ? ytPlayer.getDuration()
                : 0;
            const duration = playerDuration > 0 ? playerDuration : (roomState.duration || 0);

            if (duration > 0) {
                const targetSec = Math.floor((percentValue / 100) * duration);
                roomState.currentTime = targetSec;
                roomState.seekToSeconds = targetSec;
                roomState.seekNonce = (roomState.seekNonce || 0) + 1;
                syncRoomState(null);
            }
        }

        /********************************************************************
         * 9. 畫面渲染 (Render UI)
         ********************************************************************/
        function renderVolumeUI() {
            const volSlider = document.getElementById('volumeSlider');
            const volText = document.getElementById('volumeValueText');
            const volIcon = document.getElementById('volumeIcon');

            volSlider.value = roomState.isMuted ? 0 : roomState.volume;
            volText.textContent = roomState.isMuted ? '靜音' : `${roomState.volume}%`;

            if (roomState.isMuted || roomState.volume === 0) {
                volIcon.className = 'fa-solid fa-volume-xmark text-rose-500 text-xs';
            } else if (roomState.volume < 50) {
                volIcon.className = 'fa-solid fa-volume-low text-indigo-600 text-xs';
            } else {
                volIcon.className = 'fa-solid fa-volume-high text-indigo-600 text-xs';
            }
        }

        function renderAllUI() {
            const current = roomState.currentSong;

            const titleEl = document.getElementById('nowPlayingTitle');
            const reqEl = document.getElementById('nowPlayingRequester');
            const thumbEl = document.getElementById('collapsedThumb');
            const eqIcon = document.getElementById('equalizerIcon');

            if (current) {
                titleEl.textContent = current.title;
                reqEl.innerHTML = `點歌人：<strong class="text-indigo-700 font-semibold">${escapeHtml(current.requester)}</strong>`;
                thumbEl.src = current.thumbnail;
                if (roomState.isPlaying) {
                    eqIcon.classList.remove('eq-paused');
                } else {
                    eqIcon.classList.add('eq-paused');
                }
            } else {
                titleEl.textContent = '請從右側貼上 YouTube 網址開始點歌';
                reqEl.textContent = '尚未點播歌曲';
                thumbEl.src = 'https://placehold.co/120x90/eef2ff/4f46e5?text=KTV';
                eqIcon.classList.add('eq-paused');
                document.getElementById('currentTimeText').textContent = '00:00';
                document.getElementById('durationTimeText').textContent = '00:00';
                document.getElementById('progressSlider').value = 0;
            }

            const nextPreviewEl = document.getElementById('nextSongPreviewText');
            if (roomState.queue.length > 0) {
                nextPreviewEl.innerHTML = `下一首：<span class="text-indigo-700 font-medium">${escapeHtml(roomState.queue[0].title)}</span>`;
            } else {
                nextPreviewEl.textContent = '下一首：尚無待播歌曲';
            }

            updatePlayPauseButtonUI(roomState.isPlaying && !!current);
            renderVolumeUI();
            renderQueueList();
            renderHistoryList();
            updateVideoCollapseUI();
        }

        function updatePlayPauseButtonUI(playing) {
            const icon = document.getElementById('playPauseIcon');
            const text = document.getElementById('playPauseText');
            if (playing) {
                icon.className = 'fa-solid fa-pause text-indigo-600';
                text.textContent = '暫停';
            } else {
                icon.className = 'fa-solid fa-play text-indigo-600';
                text.textContent = '播放';
            }
        }

        function renderQueueList() {
            const container = document.getElementById('queueListContainer');
            const countBadge = document.getElementById('queueCountBadge');
            countBadge.textContent = roomState.queue.length;

            if (roomState.queue.length === 0) {
                container.innerHTML = `
                    <div class="h-56 flex flex-col items-center justify-center text-center p-4 border border-dashed border-indigo-200/70 rounded-xl bg-indigo-50/30 text-slate-400">
                        <i class="fa-solid fa-music text-xl mb-2 text-indigo-300"></i>
                        <p class="text-xs font-medium text-slate-500">待播清單目前是空的</p>
                        <p class="text-[11px] mt-1">在上方貼上 YouTube 連結即可排入歌單</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = roomState.queue.map((song, idx) => {
                const isNext = idx === 0;
                return `
                    <div class="group flex items-center justify-between gap-2.5 p-2.5 rounded-xl border transition ${
                        isNext 
                            ? 'bg-gradient-to-r from-indigo-50/90 to-rose-50/60 border-indigo-200' 
                            : 'bg-white hover:bg-indigo-50/40 border-slate-200/80'
                    }">
                        <!-- 順位與縮圖 -->
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <div class="w-6 text-center shrink-0">
                                ${isNext 
                                    ? '<span class="px-1.5 py-0.5 rounded bg-rose-500 text-white text-[9px] font-semibold tracking-wide shadow-2xs">NEXT</span>' 
                                    : `<span class="text-xs font-mono text-slate-400">${idx + 1}</span>`
                                }
                            </div>
                            <img src="${escapeHtml(song.thumbnail)}" alt="縮圖" 
                                onerror="this.src='https://placehold.co/120x90/eef2ff/4f46e5?text=MV'"
                                class="w-12 h-9 rounded-lg object-cover border border-slate-200 shrink-0">
                            <div class="min-w-0 flex-1">
                                <p class="text-xs font-semibold text-zinc-900 break-words leading-snug" title="${escapeHtml(song.title)}">
                                    ${escapeHtml(song.title)}
                                </p>
                                <div class="flex items-center gap-1.5 text-[11px] text-slate-500 mt-0.5">
                                    <span class="truncate text-indigo-600/90 font-medium">${escapeHtml(song.requester)}</span>
                                    ${isNext ? '<span class="text-rose-600 font-medium">・即將播放</span>' : ''}
                                </div>
                            </div>
                        </div>

                        <!-- 操作按鈕：插播(頂置) 與 刪除 -->
                        <div class="flex items-center gap-1 shrink-0">
                            ${!isNext ? `
                                <button onclick="triggerPrioritizeSong(${idx})" 
                                    class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-500 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-500 text-[11px] font-medium flex items-center gap-1 transition"
                                    title="插播到下一首">
                                    <i class="fa-solid fa-arrow-up text-[10px]"></i>
                                    <span>插播</span>
                                </button>
                            ` : `
                                <span class="px-2 py-1 text-[11px] text-rose-500 font-medium hidden sm:inline">第一順位</span>
                            `}
                            <button onclick="triggerRemoveFromQueue(${idx})" 
                                class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"
                                title="刪除此首">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHistoryList() {
            const container = document.getElementById('historyListContainer');
            const countBadge = document.getElementById('historyCountBadge');
            countBadge.textContent = roomState.history.length;

            if (roomState.history.length === 0) {
                container.innerHTML = `
                    <div class="h-56 flex flex-col items-center justify-center text-center p-4 border border-dashed border-indigo-200/70 rounded-xl bg-indigo-50/30 text-slate-400">
                        <i class="fa-solid fa-clock-rotate-left text-xl mb-2 text-indigo-300"></i>
                        <p class="text-xs font-medium text-slate-500">尚無已播放紀錄</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = roomState.history.map((song, idx) => `
                <div class="flex items-center justify-between gap-2.5 p-2.5 rounded-xl bg-slate-50/80 border border-slate-200/80 hover:border-indigo-200 transition">
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <img src="${escapeHtml(song.thumbnail)}" alt="縮圖" 
                            onerror="this.src='https://placehold.co/120x90/eef2ff/4f46e5?text=MV'"
                            class="w-11 h-8 rounded-lg object-cover opacity-85 border border-slate-200 shrink-0">
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-medium text-zinc-700 break-words leading-snug">${escapeHtml(song.title)}</p>
                            <p class="text-[11px] text-slate-400">點歌人：${escapeHtml(song.requester)}</p>
                        </div>
                    </div>
                    <button onclick="reQueueFromHistory(${idx})" 
                        class="px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white border border-indigo-200 hover:border-indigo-600 text-[11px] font-medium shrink-0 transition">
                        <i class="fa-solid fa-redo mr-1 text-[10px]"></i>再點一次
                    </button>
                </div>
            `).join('');
        }

        function reQueueFromHistory(idx) {
            const item = roomState.history[idx];
            if (!item) return;
            addSongByUrl(`https://www.youtube.com/watch?v=${item.videoId}`, false, item.title);
        }

        /********************************************************************
         * 10. 輔助 UI 函式
         ********************************************************************/
        function switchListTab(tab) {
            const queueContainer = document.getElementById('queueListContainer');
            const historyContainer = document.getElementById('historyListContainer');
            const tabQueueBtn = document.getElementById('tabQueueBtn');
            const tabHistoryBtn = document.getElementById('tabHistoryBtn');
            const clearBtn = document.getElementById('clearQueueBtn');
            const queueBadge = document.getElementById('queueCountBadge');
            const historyBadge = document.getElementById('historyCountBadge');

            if (tab === 'queue') {
                queueContainer.classList.remove('hidden');
                historyContainer.classList.add('hidden');
                clearBtn.classList.remove('hidden');
                tabQueueBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white flex items-center gap-2 transition';
                queueBadge.className = 'px-1.5 py-0.2 rounded-full bg-white/25 text-white text-[10px]';
                tabHistoryBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-indigo-700 hover:bg-indigo-50/60 flex items-center gap-1.5 transition';
                historyBadge.className = 'px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600 text-[10px]';
            } else {
                queueContainer.classList.add('hidden');
                historyContainer.classList.remove('hidden');
                clearBtn.classList.add('hidden');
                tabHistoryBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white flex items-center gap-1.5 transition';
                historyBadge.className = 'px-1.5 py-0.2 rounded-full bg-white/25 text-white text-[10px]';
                tabQueueBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-indigo-700 hover:bg-indigo-50/60 flex items-center gap-2 transition';
                queueBadge.className = 'px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600 text-[10px]';
            }
        }

        function saveNickname(name) {
            const clean = name.trim() || 'K歌之王';
            sessionStorage.setItem('ktv_requester_name', clean);
            showToast(`點歌人暱稱已設為：${clean}`);
        }

        function clearUrlInput() {
            const input = document.getElementById('youtubeUrlInput');
            input.value = '';
            input.focus();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const borderColors = {
                info: 'border-slate-200 bg-white text-zinc-800',
                warning: 'border-amber-200 bg-amber-50 text-amber-900',
                error: 'border-rose-200 bg-rose-50 text-rose-900'
            };
            toast.className = `px-4 py-2.5 rounded-xl border ${borderColors[type] || borderColors.info} shadow-lg text-xs font-medium flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
