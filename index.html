<!DOCTYPE html>
<html lang="zh-TW" class="bg-[#f0ebe1]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圖庫管理系統 - 完整預覽點擊放大版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *::-webkit-scrollbar { display: none !important; width: 0 !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        html, body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0ebe1 !important; color: #334155; margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
        @keyframes flag-fade-in { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: flag-fade-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 🌟 1. 核心參數：1000px、0.6 畫質
        const CONFIG = { maxDim: 1000, quality: 0.6 };
        const firebaseConfig = {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs", 
            authDomain: "work-eb62f.firebaseapp.com",
            projectId: "work-eb62f", 
            storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706", 
            appId: "1:428210130706:web:142207595423bdf661adcb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'default-app-id';
        let currentUser = null;

        // 🌟 2. 輕量 DOM 選擇器與輔助函式
        const $ = id => document.getElementById(id);
        const pad = n => String(n).padStart(2, '0');
        const getLocal = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
        const safeSetLocal = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch {} };

        // 🌟 3. IndexedDB 模組
        const IDB_STORE = 'hd_full_images';
        const openIDB = () => new Promise((res, rej) => {
            const req = indexedDB.open('QuadChunk_Gallery_DB_V2', 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
        });

        const idbSet = async (key, val) => {
            const dbInstance = await openIDB();
            return new Promise((res, rej) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(val, key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        };

        const idbGet = async (key) => {
            const dbInstance = await openIDB();
            return new Promise((res) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get(key);
                req.onsuccess = () => res(req.result);
                req.onerror = () => res(null);
            });
        };

        const idbDel = async (key) => {
            const dbInstance = await openIDB();
            return new Promise((res) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete(key);
                tx.oncomplete = () => res();
                tx.onerror = () => res();
            });
        };

        // 🌟 4. 全域狀態與防重複衝突鎖
        let galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
        let galleryItems = getLocal('work_cache_gallery_items', []);
        let memoryImageCache = new Map();
        let currentGalleryCategory = '全部';
        window.pendingUploadImages = [];
        window.isUploading = false;

        window.getNow = () => new Date();
        const getNowInputStrs = () => {
            const d = window.getNow();
            return { date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
        };

        window.showToast = (msg, isErr = false) => {
            const t = document.createElement('div');
            t.className = `fixed top-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-full shadow-lg text-xs font-bold z-[9999] transition-all duration-300 pointer-events-none ${isErr ? 'bg-red-500' : 'bg-slate-800'} text-white`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, -15px)'; setTimeout(() => t.remove(), 300); }, 2500);
        };

        window.setUploadProgress = (percent, text) => {
            const c = $('globalProgressContainer');
            if (!c) return;
            if (percent < 0) return c.classList.add('hidden');
            c.classList.remove('hidden');
            const safePercent = Math.min(100, Math.max(0, percent));
            $('globalProgressBar').style.width = `${safePercent}%`;
            $('globalProgressText').textContent = text;
        };

        // 🌟 5. 高效 Canvas 圖片切分與拼合
        const splitImageTo4ChunksAsync = (file, maxDim = CONFIG.maxDim, quality = CONFIG.quality) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let { width: w, height: h } = img;
                    if (w > maxDim || h > maxDim) {
                        const scale = maxDim / Math.max(w, h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                    const chunkHeight = Math.floor(h / 4);
                    const chunks = Array.from({ length: 4 }, (_, i) => {
                        const sub = document.createElement('canvas');
                        const curH = (i === 3) ? (h - chunkHeight * 3) : chunkHeight;
                        sub.width = w; sub.height = curH;
                        sub.getContext('2d').drawImage(canvas, 0, i * chunkHeight, w, curH, 0, 0, w, curH);
                        return sub.toDataURL('image/webp', quality);
                    });

                    img.src = '';
                    resolve({ chunks, width: w, height: h });
                };
                img.onerror = () => reject(new Error("圖片載入失敗"));
            };
            r.onerror = () => reject(new Error("檔案讀取失敗"));
        });

        const merge4ChunksAsync = async (chunks) => {
            if (!chunks?.length) return '';
            if (chunks.length === 1) return chunks[0];
            const imgs = await Promise.all(chunks.map(src => new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = () => rej(new Error("切片載入失敗"));
                im.src = src;
            })));

            const totalW = imgs[0].naturalWidth;
            const totalH = imgs.reduce((sum, im) => sum + im.naturalHeight, 0);
            const canvas = document.createElement('canvas');
            canvas.width = totalW; canvas.height = totalH;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';

            let curY = 0;
            imgs.forEach(im => {
                ctx.drawImage(im, 0, curY);
                curY += im.naturalHeight;
            });
            return canvas.toDataURL('image/webp', CONFIG.quality);
        };

        const getFullImageUrlAsync = async (item) => {
            const id = item.id;
            if (memoryImageCache.has(id)) return memoryImageCache.get(id);

            const idbCached = await idbGet(id);
            if (idbCached) {
                memoryImageCache.set(id, idbCached);
                return idbCached;
            }

            if (currentUser && db) {
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id, 'chunks'));
                    const chunkList = [];
                    snap.forEach(d => chunkList.push(d.data()));
                    chunkList.sort((a, b) => a.index - b.index);

                    if (chunkList.length) {
                        const mergedUrl = await merge4ChunksAsync(chunkList.map(c => c.data));
                        memoryImageCache.set(id, mergedUrl);
                        await idbSet(id, mergedUrl);
                        return mergedUrl;
                    }
                } catch (e) {
                    console.error("雲端載入失敗:", e);
                }
            }
            return '';
        };

        // 🌟 6. 上傳與列表互動
        window.handleGalleryUpload = async (input) => {
            if (window.isUploading) {
                input.value = '';
                return window.showToast("⚠️ 上傳正在進行中，請等待完成後再選取！", true);
            }

            const files = Array.from(input.files || []);
            if (!files.length) return;
            window.pendingUploadImages = [];

            const { time } = getNowInputStrs();
            const defaultCat = currentGalleryCategory === '全部' ? '未分類' : currentGalleryCategory;

            for (let i = 0; i < files.length; i++) {
                try {
                    const { chunks } = await splitImageTo4ChunksAsync(files[i]);
                    const tempId = `img_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 4)}`;
                    const previewSrc = await merge4ChunksAsync(chunks);

                    window.pendingUploadImages.push({
                        tempId,
                        chunks,
                        src: previewSrc,
                        prefix: "",
                        code: "",
                        title: "",
                        time,
                        category: defaultCat
                    });
                } catch (e) {}

                const percent = (((i + 1) / files.length) * 100).toFixed(1);
                window.setUploadProgress(percent, `正在預處理：已完成 ${i + 1} / ${files.length} 張 (${percent}%)`);
            }

            if (!window.isUploading) {
                window.setUploadProgress(-1, "");
            }
            input.value = '';

            if (window.pendingUploadImages.length) window.openUploadBatchModal();
            else window.showToast("無法讀取選取的圖片", true);
        };

        window.renderGallery = async () => {
            const sidebar = $('gallerySidebar'), grid = $('galleryGrid');
            if (!sidebar || !grid) return;
            const query = ($('gallerySearchInput')?.value || '').trim().toLowerCase();

            sidebar.innerHTML = `
                <div class="p-2 border-b border-slate-200 w-full flex justify-between items-center bg-slate-100">
                    <span class="text-[10px] font-bold text-slate-500">分類</span>
                    <button onclick="window.openCategoryManager()" class="text-slate-400 hover:text-blue-500 p-0.5"><i data-lucide="settings" class="w-3.5 h-3.5"></i></button>
                </div>
                ${galleryCategories.map(cat => `<button onclick="window.setGalleryCategory('${cat}')" class="w-full text-center py-2 px-1 text-[11px] font-bold rounded-md transition-colors truncate ${currentGalleryCategory === cat ? 'bg-blue-500 text-white' : 'text-slate-600 hover:bg-slate-200'}">${cat}</button>`).join('')}`;

            const filtered = galleryItems.filter(item => 
                (currentGalleryCategory === '全部' || item.category === currentGalleryCategory) && 
                (!query || item.title?.toLowerCase().includes(query) || item.time?.toLowerCase().includes(query))
            );

            const cameraSlotHtml = `
                <label class="relative group bg-white/80 hover:bg-blue-50/60 border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-xl overflow-hidden shadow-xs flex flex-col items-center justify-center cursor-pointer min-h-[175px] h-full active:scale-95 transition-all">
                    <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-black text-slate-700 tracking-wider">拍照記錄</span>
                    <span class="text-[10px] font-bold text-slate-400 mt-0.5">點擊即時拍攝</span>
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            `;

            const renderedCards = await Promise.all(filtered.map(async (i) => {
                const fullSrc = await getFullImageUrlAsync(i);
                return `
                    <div class="relative group bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                        <div class="px-2 py-1.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <span class="text-[9.5px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 truncate max-w-[100px]">${i.category || '未分類'}</span>
                            <button onclick="window.deleteGalleryItem('${i.id}')" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-colors active:scale-95" title="刪除圖片"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <div class="w-full h-28 bg-slate-100 overflow-hidden cursor-pointer" onclick="window.openFullscreenImg('${fullSrc}')">
                            <img src="${fullSrc}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${i.title || '圖片'}">
                        </div>
                        <div class="p-2 flex justify-between items-center bg-white border-t border-slate-100 text-xs gap-1.5">
                            <span class="text-[11px] text-slate-500 font-mono font-bold shrink-0 flex items-center">
                                <i data-lucide="clock" class="w-3 h-3 mr-1 text-slate-400"></i>${i.time || '12:00'}
                            </span>
                            <span onclick="window.editGalleryItemTitle('${i.id}', event)" class="text-[11px] font-bold text-slate-800 truncate text-right flex-1 cursor-pointer hover:text-blue-600">${i.title || '無標題'}</span>
                        </div>
                    </div>`;
            }));

            grid.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">${cameraSlotHtml}${renderedCards.join('')}</div>`;
            lucide.createIcons();
        };

        window.setGalleryCategory = (c) => { currentGalleryCategory = c; window.renderGallery(); };
        
        // 🌟 預覽圖片開啟與關閉函式（通用於圖庫與上傳彈窗）
        window.openFullscreenImg = (src) => { 
            $('imageViewerImg').src = src; 
            const viewer = $('imageViewer');
            if (viewer) {
                viewer.classList.remove('hidden');
                viewer.classList.add('flex');
            }
        };

        window.closeFullscreenImg = () => {
            const viewer = $('imageViewer');
            if (viewer) {
                viewer.classList.remove('flex');
                viewer.classList.add('hidden');
            }
        };
        
        window.editGalleryItemTitle = (id, e) => {
            if (e) e.stopPropagation();
            const item = galleryItems.find(x => x.id === id);
            if (!item) return;
            const newTitle = prompt('請輸入新的圖片名稱：', item.title || '');
            if (newTitle !== null && newTitle.trim()) {
                item.title = newTitle.trim();
                safeSetLocal('work_cache_gallery_items', galleryItems);
                if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id), item, { merge: true });
                window.renderGallery();
                window.showToast('圖片名稱已更新');
            }
        };

        window.deleteGalleryItem = async (id) => {
            galleryItems = galleryItems.filter(i => i.id !== id);
            memoryImageCache.delete(id);
            await idbDel(id);
            safeSetLocal('work_cache_gallery_items', galleryItems);
            
            if (currentUser) {
                deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id));
                getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id, 'chunks'))
                    .then(snap => snap.forEach(d => deleteDoc(d.ref)))
                    .catch(() => {});
            }
            window.renderGallery();
            window.showToast("已刪除圖片");
        };

        window.exportAllGalleryImages = async () => {
            if (!galleryItems?.length) return window.showToast('圖庫內沒有任何圖片可導出', true);
            window.showToast(`開始導出共 ${galleryItems.length} 張圖片...`);
            for (let i = 0; i < galleryItems.length; i++) {
                const item = galleryItems[i];
                const fullSrc = await getFullImageUrlAsync(item);
                if (!fullSrc) continue;
                const safeName = (item.title?.trim() || `圖片_${i + 1}`).replace(/[\\/:*?"<>|]/g, '_');
                const link = document.createElement('a');
                link.href = fullSrc;
                link.download = `${safeName}.webp`;
                link.click();
                await new Promise(r => setTimeout(r, 200));
            }
            window.showToast(`✅ 全部 ${galleryItems.length} 張圖片導出完成！`);
        };

        window.openUploadBatchModal = () => { window.renderUploadBatchList(); $('uploadBatchModal')?.classList.replace('hidden', 'flex'); lucide.createIcons(); };
        window.closeUploadBatchModal = () => { window.pendingUploadImages = []; $('uploadBatchModal')?.classList.replace('flex', 'hidden'); };
        window.removePendingUploadItem = (tempId) => { window.pendingUploadImages = window.pendingUploadImages.filter(x => x.tempId !== tempId); window.renderUploadBatchList(); };

        const syncItemFullTitle = (item) => {
            const prefix = item.prefix || '';
            const code = item.code || '';
            item.title = `${prefix}${code}`.trim();
        };

        window.updatePendingCode = (tempId, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;
            item.code = val.trim();
            syncItemFullTitle(item);
        };

        window.selectPrefixOption = (tempId, prefixVal) => {
            const item = window.pendingUploadImages.find(x => x.tempId === tempId);
            if (!item) return;

            item.prefix = (item.prefix === prefixVal) ? "" : prefixVal;
            syncItemFullTitle(item);

            ['1-0', 'R-0', 'J-0'].forEach(val => {
                const btn = $(`btn-prefix-${tempId}-${val}`);
                if (btn) {
                    if (item.prefix === val) {
                        btn.className = "w-full py-1.5 rounded text-[11px] font-bold tracking-wide transition-all shadow-xs bg-blue-600 text-white border border-blue-600";
                    } else {
                        btn.className = "w-full py-1.5 rounded text-[11px] font-bold tracking-wide transition-all bg-white hover:bg-slate-100 text-slate-600 border border-slate-200";
                    }
                }
            });

            const codeInput = $(`code-input-${tempId}`);
            if (codeInput) codeInput.focus();
        };

        // 🌟 核心更新：預覽圖改為 object-contain 完整呈現，並加入點擊放大原圖觀看
        window.renderUploadBatchList = () => {
            const list = $('uploadBatchList');
            if ($('uploadBatchCount')) $('uploadBatchCount').textContent = window.pendingUploadImages.length;
            if (!window.pendingUploadImages.length) return window.closeUploadBatchModal();

            const selectableCats = galleryCategories.filter(c => c !== '全部');
            list.innerHTML = window.pendingUploadImages.map(item => {
                const [hStr, mStr] = (item.time || '00:00').split(':');
                const curPrefix = item.prefix || '';

                return `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col space-y-2.5 shadow-xs">
                    <!-- 🌟 完整呈現圖片預覽框（高度適中 h-40，object-contain 完整比例不被裁切，點擊可放大觀看原圖） -->
                    <div class="relative w-full h-40 bg-slate-900/90 rounded-lg overflow-hidden flex items-center justify-center cursor-zoom-in group border border-slate-300" onclick="window.openFullscreenImg('${item.src}')" title="點擊放大觀看完整圖片">
                        <img src="${item.src}" class="w-full h-full object-contain p-1 group-hover:scale-105 transition-transform duration-200">
                        <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-xs text-white/90 text-[10px] px-2 py-0.5 rounded flex items-center pointer-events-none">
                            <i data-lucide="zoom-in" class="w-3 h-3 mr-1"></i>點擊放大
                        </div>
                        <button type="button" onclick="event.stopPropagation(); window.removePendingUploadItem('${item.tempId}')" class="absolute top-2 right-2 text-slate-500 hover:text-red-500 p-1.5 rounded-full bg-white/95 shadow-md transition-colors active:scale-95" title="移除此圖">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">分類</label>
                        <select onchange="window.pendingUploadImages.find(x=>x.tempId==='${item.tempId}').category=this.value" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700">
                            ${selectableCats.map(cat => `<option value="${cat}" ${item.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                        </select>
                    </div>
                    <div class="flex items-start space-x-2">
                        <div class="w-[145px] shrink-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">時間</label>
                            <div class="flex items-center justify-between bg-white border border-slate-300 rounded-lg px-2 py-1.5">
                                <div class="flex items-center font-mono font-bold text-xs text-slate-800">
                                    <select id="h-${item.tempId}" onchange="window.updateTimePart('${item.tempId}','h',this.value)" class="bg-transparent text-center font-mono font-bold">${Array.from({length: 24}, (_, i) => `<option value="${pad(i)}" ${pad(i) === hStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}</select>
                                    <span class="text-slate-400 mx-0.5 font-bold">:</span>
                                    <select id="m-${item.tempId}" onchange="window.updateTimePart('${item.tempId}','m',this.value)" class="bg-transparent text-center font-mono font-bold">${Array.from({length: 60}, (_, i) => `<option value="${pad(i)}" ${pad(i) === mStr ? 'selected' : ''}>${pad(i)}</option>`).join('')}</select>
                                </div>
                                <button type="button" onclick="window.setTimeNow('${item.tempId}')" class="text-slate-400 hover:text-blue-500 text-[10px] font-bold ml-1 flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-0.5"></i>現在</button>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0">
                            <label class="text-xs font-bold text-slate-600 block mb-1">代碼與檔號</label>
                            <div class="flex items-stretch space-x-1.5">
                                <div class="w-14 flex flex-col space-y-1 shrink-0">
                                    <button type="button" id="btn-prefix-${item.tempId}-1-0" onclick="window.selectPrefixOption('${item.tempId}', '1-0')" class="w-full py-1.5 rounded text-[11px] font-bold tracking-wide transition-all ${curPrefix === '1-0' ? 'bg-blue-600 text-white border border-blue-600 shadow-xs' : 'bg-white hover:bg-slate-100 text-slate-600 border border-slate-200'}">一樓</button>
                                    <button type="button" id="btn-prefix-${item.tempId}-R-0" onclick="window.selectPrefixOption('${item.tempId}', 'R-0')" class="w-full py-1.5 rounded text-[11px] font-bold tracking-wide transition-all ${curPrefix === 'R-0' ? 'bg-blue-600 text-white border border-blue-600 shadow-xs' : 'bg-white hover:bg-slate-100 text-slate-600 border border-slate-200'}">魚檔</button>
                                    <button type="button" id="btn-prefix-${item.tempId}-J-0" onclick="window.selectPrefixOption('${item.tempId}', 'J-0')" class="w-full py-1.5 rounded text-[11px] font-bold tracking-wide transition-all ${curPrefix === 'J-0' ? 'bg-blue-600 text-white border border-blue-600 shadow-xs' : 'bg-white hover:bg-slate-100 text-slate-600 border border-slate-200'}">雞檔</button>
                                </div>
                                
                                <div class="flex-1 min-w-0 flex flex-col">
                                    <textarea id="code-input-${item.tempId}" oninput="window.updatePendingCode('${item.tempId}', this.value)" placeholder="輸入檔號" rows="3" class="w-full flex-1 bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 text-center focus:outline-none focus:border-blue-500 resize-none">${item.code || ''}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        window.updateTimePart = (id, part, val) => {
            const item = window.pendingUploadImages.find(x => x.tempId === id);
            if (!item) return;
            let [h, m] = (item.time || '00:00').split(':');
            if (part === 'h') h = val; else m = val;
            item.time = `${h}:${m}`;
        };

        window.setTimeNow = (id) => {
            const item = window.pendingUploadImages.find(x => x.tempId === id);
            if (!item) return;
            const now = window.getNow();
            const h = pad(now.getHours()), m = pad(now.getMinutes());
            item.time = `${h}:${m}`;
            if ($(`h-${id}`)) $(`h-${id}`).value = h;
            if ($(`m-${id}`)) $(`m-${id}`).value = m;
        };

        // 🌟 7. 上傳發布
        window.confirmBatchUpload = async () => {
            const items = [...window.pendingUploadImages];
            if (!items.length || window.isUploading) return;
            
            window.isUploading = true;
            window.closeUploadBatchModal();

            try {
                if (!currentUser || !db) throw new Error("授權未就緒，請重新整理頁面。");

                const total = items.length;
                const newDocs = [];

                for (let i = 0; i < total; i++) {
                    const item = items[i];
                    const docId = item.tempId;

                    await idbSet(docId, item.src);
                    memoryImageCache.set(docId, item.src);

                    const mainDocData = {
                        id: docId, chunkCount: item.chunks.length,
                        title: item.title || '無標題', category: item.category || '未分類',
                        time: item.time || '12:00', createdAt: Date.now()
                    };

                    const singleBatch = writeBatch(db);
                    singleBatch.set(doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', docId), mainDocData);

                    item.chunks.forEach((chunkStr, idx) => {
                        const chunkRef = doc(db, 'artifacts', appId, 'public', 'data', 'gallery_items', docId, 'chunks', `part_${idx}`);
                        singleBatch.set(chunkRef, { index: idx, data: chunkStr });
                    });

                    await singleBatch.commit();
                    newDocs.push(mainDocData);

                    const currentPercent = (((i + 1) / total) * 100).toFixed(1);
                    window.setUploadProgress(currentPercent, `正在上傳：已完成 ${i + 1} / ${total} 張 (${currentPercent}%)`);
                }

                window.setUploadProgress("100.0", `全部完成！共 ${total} 張圖片 (100.0%)`);
                await new Promise(r => setTimeout(r, 450));
                window.setUploadProgress(-1, "");

                const map = new Map();
                [...newDocs, ...galleryItems].forEach(x => { if (x?.id) map.set(x.id, x); });
                galleryItems = Array.from(map.values()).sort((a, b) => (b.id || '').localeCompare(a.id || ''));

                safeSetLocal('work_cache_gallery_items', galleryItems);
                await window.renderGallery();
                window.showToast(`✅ 成功上傳 ${newDocs.length} 張高清圖片！`);
            } catch (err) {
                window.setUploadProgress(-1, "");
                console.error("上傳錯誤:", err);
                window.showToast(`❌ 上傳失敗：${err.message}`, true);
            } finally {
                window.isUploading = false;
            }
        };

        // 🌟 8. 分類管理
        window.openCategoryManager = () => {
            $('categoryManageList').innerHTML = `
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newCatInput" placeholder="新增分類名稱..." class="flex-1 border border-slate-300 rounded-lg p-1.5 text-xs">
                    <button onclick="window.addCategoryAction()" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold">新增</button>
                </div>
                <div class="space-y-1.5">${galleryCategories.map((c, idx) => `
                    <div class="flex justify-between items-center p-2 bg-white rounded-lg border border-slate-200 text-xs font-bold text-slate-700">
                        <span>${c}</span>${!['全部', '任務附件', '未分類'].includes(c) ? `<button onclick="window.removeCategoryAction(${idx})" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : '<span class="text-[9px] text-slate-400 font-normal">系統預設</span>'}
                    </div>`).join('')}</div>`;
            $('categoryManageModal')?.classList.replace('hidden', 'flex');
            lucide.createIcons();
        };

        window.closeCategoryManager = () => $('categoryManageModal')?.classList.replace('flex', 'hidden');
        window.addCategoryAction = () => {
            const val = $('newCatInput')?.value.trim();
            if (!val || galleryCategories.includes(val)) return;
            galleryCategories.push(val);
            safeSetLocal('work_cache_gallery_categories', galleryCategories);
            if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };

        window.removeCategoryAction = (idx) => {
            galleryCategories.splice(idx, 1);
            safeSetLocal('work_cache_gallery_categories', galleryCategories);
            if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), { categories: galleryCategories });
            window.openCategoryManager(); window.renderGallery();
        };

        // 🌟 9. 資料庫即時監聽與初始化
        async function initAuthAndSync() {
            try { await signInAnonymously(auth); } catch {}
            onAuthStateChanged(auth, (user) => {
                currentUser = user; if (!user) return;
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), (snap) => {
                    if (snap.exists()?.() && snap.data().categories) {
                        galleryCategories = snap.data().categories;
                        safeSetLocal('work_cache_gallery_categories', galleryCategories);
                        window.renderGallery();
                    }
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items'), (snap) => {
                    const map = new Map();
                    snap.forEach(d => { const it = d.data(); if (it?.id) map.set(it.id, it); });
                    galleryItems = Array.from(map.values()).sort((a, b) => (b.id || '').localeCompare(a.id || ''));
                    safeSetLocal('work_cache_gallery_items', galleryItems);
                    window.renderGallery();
                });
            });
        }

        window.renderGallery();
        initAuthAndSync();
    </script>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 bg-[#f0ebe1]">
    <div class="w-full max-w-[430px] h-[910px] max-h-[100vh] sm:max-h-[96vh] bg-[#fdfbf7] sm:rounded-[2.5rem] shadow-2xl sm:border-[6px] border-[#d6d0c4] overflow-hidden relative flex flex-col mx-auto my-auto">
        
        <!-- 全域即時上傳進度條 -->
        <div id="globalProgressContainer" class="hidden absolute top-0 left-0 right-0 z-[300] bg-slate-900/95 backdrop-blur-md p-3 text-white border-b border-blue-500 shadow-2xl">
            <div class="flex justify-between items-center text-xs font-bold mb-1.5"><span id="globalProgressText" class="text-blue-300">正在處理...</span></div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="globalProgressBar" class="bg-blue-500 h-full w-0 transition-all duration-200"></div>
            </div>
        </div>

        <header class="bg-[#fdfbf7]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#e5dfd3] p-4 pt-6 shadow-xs shrink-0 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg bg-blue-500 text-white flex items-center justify-center shadow-xs"><i data-lucide="image" class="w-4 h-4"></i></div>
                <h1 class="text-lg text-slate-800 tracking-wider font-black">圖庫管理系統</h1>
            </div>
            <button type="button" onclick="window.exportAllGalleryImages()" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg flex items-center justify-center active:scale-95 text-xs font-bold transition-all shadow-xs">
                <i data-lucide="download" class="w-3.5 h-3.5 mr-1"></i> 導出全部
            </button>
        </header>

        <main class="flex-1 min-h-0 flex flex-col relative z-10 bg-[#fdfbf7]">
            <div class="p-2.5 border-b border-[#e6e2d6] flex items-center space-x-2 bg-white shrink-0 shadow-xs z-20">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                    <input type="text" id="gallerySearchInput" placeholder="搜尋圖片..." oninput="window.renderGallery()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-2.5 py-1.5 text-xs text-slate-700 placeholder-slate-400 focus:border-blue-400 focus:bg-white focus:outline-none tracking-wide text-center">
                </div>
                <label class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-lg flex items-center justify-center cursor-pointer active:scale-95 text-xs font-bold shadow-xs shrink-0">
                    <i data-lucide="upload" class="w-3.5 h-3.5 mr-1"></i> 上傳
                    <input type="file" accept="image/*" multiple class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            </div>
            <div class="flex flex-1 min-h-0 overflow-hidden relative z-10">
                <div class="w-[70px] shrink-0 border-r border-[#e6e2d6] bg-[#f4f1eb] overflow-y-auto flex flex-col items-center space-y-1.5 scrollbar-hide" id="gallerySidebar"></div>
                <div class="flex-1 p-2.5 overflow-y-auto bg-[#fdfbf7] relative scrollbar-hide" id="galleryGrid"></div>
            </div>
        </main>
    </div>

    <!-- 彈窗群 -->
    <div id="uploadBatchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[260] hidden flex-col items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-[420px] shadow-2xl relative max-h-[88vh] flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-3 mb-2 border-b border-slate-100 shrink-0">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="images" class="w-5 h-5"></i></div>
                    <h3 class="font-bold text-base text-slate-800 tracking-wide">確認上傳圖片</h3>
                </div>
                <button onclick="window.closeUploadBatchModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-2.5 text-center text-xs font-bold text-blue-700 shrink-0 mb-3">
                📸 已選取 <span id="uploadBatchCount" class="text-blue-900 font-black text-sm">0</span> 張圖片
            </div>
            <div id="uploadBatchList" class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-hide mb-3"></div>
            <div class="flex justify-end space-x-2.5 pt-3 border-t border-slate-100 shrink-0">
                <button onclick="window.closeUploadBatchModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold active:scale-95">取消</button>
                <button onclick="window.confirmBatchUpload()" class="px-5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95 flex items-center"><i data-lucide="check" class="w-4 h-4 mr-1.5"></i>確認發布</button>
            </div>
        </div>
    </div>

    <!-- 🌟 全螢幕圖片檢視器 (點擊右上角關閉或點擊背景關閉) -->
    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[350] hidden flex-col items-center justify-center p-4" onclick="window.closeFullscreenImg()">
        <button type="button" onclick="window.closeFullscreenImg()" class="absolute top-6 right-6 text-white bg-slate-800/80 p-2.5 rounded-full active:scale-95 shadow-lg border border-slate-600 hover:bg-red-600 transition-colors z-10" title="關閉預覽">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" onclick="event.stopPropagation()" />
    </div>

    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="settings-2" class="w-4 h-4 mr-2 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[55vh] bg-[#fdfbf7] space-y-2 scrollbar-hide"></div>
        </div>
    </div>
</body>
</html>
