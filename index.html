        @keyframes room-walk-a { 0%, 100% { transform: translate3d(0, 0, 0); } 33% { transform: translate3d(-25px, 12px, 0); } 66% { transform: translate3d(20px, 18px, 0); } }
        @keyframes room-walk-b { 0%, 100% { transform: translate3d(0, 0, 0); } 25% { transform: translate3d(22px, 8px, 0); } 50% { transform: translate3d(-15px, 20px, 0); } 75% { transform: translate3d(-22px, 5px, 0); } }

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const CONFIG = { maxDim: 1000, quality: 0.6 };
        const firebaseConfig = {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs",
            authDomain: "work-eb62f.firebaseapp.com",
            databaseURL: "https://work-eb62f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "work-eb62f",
            storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706",
            appId: "1:428210130706:web:142207595423bdf661adcb"
        };
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let currentUser = null;

        const $ = id => document.getElementById(id);
        const getLocal = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
        const safeSetLocal = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch {} };
        const cfgDoc = (key) => doc(db, 'artifacts', appId, 'public', 'data', 'config', key);
        const syncConfig = (key, data, merge = false) => { if (currentUser) setDoc(cfgDoc(key), data, { merge }); };
        const pad = (n) => String(n).padStart(2, '0');

        const IDB_STORE = 'hd_full_images';
        const openIDB = () => new Promise((res, rej) => {
            const req = indexedDB.open('QuadChunk_Gallery_DB_V2', 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
        });
        const idbSet = async (key, val) => {
            const dbInstance = await openIDB();
            return new Promise((res, rej) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(val, key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        };
        const idbGet = async (key) => {
            const dbInstance = await openIDB();
            return new Promise((res) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get(key);
                req.onsuccess = () => res(req.result);
                req.onerror = () => res(null);
            });
        };
        const idbDel = async (key) => {
            const dbInstance = await openIDB();
            return new Promise((res) => {
                const tx = dbInstance.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete(key);
                tx.oncomplete = () => res();
                tx.onerror = () => res();
            });
        };

        let dailyScheduleData = [], taskCompletionState = {}, subTaskCompletionState = {};
        let galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
        let galleryItems = getLocal('work_cache_gallery_items', []);
        let memoryImageCache = new Map();
        let currentGalleryCategory = '全部';
        window.pendingUploadImages = [];
        window.isUploading = false;
        window._isTogglingTask = false;

        const defaultTabVisibility = { timeline: true, memo: true, map: true, gallery: true, coldRoom: true, closing: true };
        let tabVisibilityState = getLocal('work_cache_tab_visibility', defaultTabVisibility);

        const tabMetadata = [
            { id: 'timeline', name: '動態', btnId: 'tabTimeline', pageId: 'timelinePage', icon: 'activity' },
            { id: 'memo', name: '備忘', btnId: 'tabMemo', pageId: 'memoPage', icon: 'calendar-clock' },
            { id: 'map', name: '地圖', btnId: 'tabMap', pageId: 'mapPage', icon: 'map' },
            { id: 'gallery', name: '圖庫', btnId: 'tabGallery', pageId: 'galleryPage', icon: 'image' },
            { id: 'coldRoom', name: '雪房', btnId: 'tabColdRoom', pageId: 'coldRoomPage', icon: 'snowflake' },
            { id: 'closing', name: '收工', btnId: 'tabClosing', pageId: 'closingPage', icon: 'store' }
        ];

        const defaultMapPoints = {
            'pt_1': { name: '客服室', x: 50, y: 16 }, 'pt_2': { name: '一樓大清點', x: 0, y: 0 },
            'pt_3': { name: '花園仔', x: 27.5, y: 64 }, 'pt_4': { name: '魚檔', x: 72.5, y: 64 },
            'pt_5': { name: '整體巡邏', x: 50, y: 88 }, 'pt_6': { name: '地面層 大清點', x: 0, y: 0 },
            'pt_7': { name: '休息中', x: 0, y: 0 }
        };
        let mapData = { points: JSON.parse(JSON.stringify(defaultMapPoints)) }, memberSchedules = [], teamMembers = [];
        let activeGridMember = null, isEditingMembers = false, isGridDragging = false, gridDragAction = null, splitHoursState = {};
        window.lastTouchedEl = null;

        const memberColorPalettes = [
            { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-300', activeBg: 'bg-rose-500' },
            { bg: 'bg-sky-100', text: 'text-sky-700', border: 'border-sky-300', activeBg: 'bg-sky-500' },
            { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-300', activeBg: 'bg-emerald-500' },
            { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', activeBg: 'bg-amber-500' },
            { bg: 'bg-violet-100', text: 'text-violet-700', border: 'border-violet-300', activeBg: 'bg-violet-500' },
            { bg: 'bg-teal-100', text: 'text-teal-700', border: 'border-teal-300', activeBg: 'bg-teal-500' },
            { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300', activeBg: 'bg-orange-500' },
            { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-300', activeBg: 'bg-indigo-500' },
            { bg: 'bg-pink-100', text: 'text-pink-700', border: 'border-pink-300', activeBg: 'bg-pink-500' },
            { bg: 'bg-lime-100', text: 'text-lime-800', border: 'border-lime-300', activeBg: 'bg-lime-500' },
            { bg: 'bg-cyan-100', text: 'text-cyan-800', border: 'border-cyan-300', activeBg: 'bg-cyan-500' },
            { bg: 'bg-fuchsia-100', text: 'text-fuchsia-700', border: 'border-fuchsia-300', activeBg: 'bg-fuchsia-500' }
        ];

        window.getMemberColorClass = (name) => {
            if (!name) return { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', activeBg: 'bg-blue-500' };
            let seed = 0; for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
            return memberColorPalettes[Math.abs(seed) % memberColorPalettes.length];
        };

        window.openAsPopout = () => {
            const w = 480, h = 950, l = Math.max(0, (window.screen.width - w) / 2), t = Math.max(0, (window.screen.height - h) / 2);
            window.open(window.location.href, 'WorkRecordPopup', `width=${w},height=${h},left=${l},top=${t},menubar=no,status=no,toolbar=no,location=no,scrollbars=no,resizable=yes`);
        };

        let crRecords = [], crItemTypes = ['海鮮', '肉類', '蔬果', '包裝冰', '其他'], crCurrentSelectedType = '', crCurrentTab = 'active';
        const CR_TIME_LIMIT_MS = 86400000;
        let actionHistory = [], futureMemos = [], timeOffset = 0, isFastForwarding = false, simInterval = null, timelineUpdateInterval;
        window.getNow = () => new Date(Date.now() + timeOffset);

        function parseTime(tStr) {
            const d = window.getNow();
            if (!tStr || typeof tStr !== 'string' || !tStr.includes(':')) { d.setHours(0, 0, 0, 0); return d; }
            const [h, m] = tStr.split(':').map(Number);
            d.setHours(isNaN(h) ? 0 : h, isNaN(m) ? 0 : m, 0, 0);
            return d;
        }

        function calculateTaskStatus(startStr, endStr) {
            const now = window.getNow(), s = parseTime(startStr), e = parseTime(endStr);
            const fmt = (diff) => `${Math.floor(diff/60) > 0 ? Math.floor(diff/60) + '小時' : ''}${diff % 60}分`;
            if (now < s) return { state: 'waiting', text: `未開始 (約 ${fmt(Math.floor((s - now) / 60000))}後)` };
            if (now >= s && now <= e) return { state: 'active', text: `進行中 (剩餘 ${fmt(Math.floor((e - now) / 60000))})` };
            return { state: 'overdue', text: `已結束 (超時 ${fmt(Math.floor((now - e) / 60000))})` };
        }

        window.crNotifiedSet = new Set(); window.memoNotifiedSet = new Set();
        let crAudioCtx = null, crSoundIntervalId = null, crBannerTimeoutId = null;

        window.playAlertSound = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
                const ctx = new AudioCtx(); crAudioCtx = ctx;
                const playDualBeep = () => {
                    if (!ctx || ctx.state === 'closed') return;
                    const now = ctx.currentTime;
                    const o1 = ctx.createOscillator(), g1 = ctx.createGain();
                    o1.type = 'sine'; o1.frequency.setValueAtTime(880, now);
                    g1.gain.setValueAtTime(0.3, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    o1.connect(g1); g1.connect(ctx.destination); o1.start(now); o1.stop(now + 0.18);
                    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
                    o2.type = 'sine'; o2.frequency.setValueAtTime(1174.66, now + 0.22);
                    g2.gain.setValueAtTime(0.3, now + 0.22); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
                    o2.connect(g2); g2.connect(ctx.destination); o2.start(now + 0.22); o2.stop(now + 0.48);
                };
                playDualBeep(); crSoundIntervalId = setInterval(playDualBeep, 1200);
                setTimeout(() => { if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; } }, 10000);
            } catch (e) {}
        };

        window.stopOverdueAlarm = () => {
            if (crSoundIntervalId) { clearInterval(crSoundIntervalId); crSoundIntervalId = null; }
            if (crBannerTimeoutId) { clearTimeout(crBannerTimeoutId); crBannerTimeoutId = null; }
            if (crAudioCtx && crAudioCtx.state !== 'closed') { try { crAudioCtx.close(); } catch(e){} }
            const banner = $('crOverdueAlertBanner');
            if (banner) { banner.style.opacity = '0'; banner.style.transform = 'translate(-50%, -20px)'; setTimeout(() => banner.classList.add('hidden'), 300); }
        };

        window.showOverdueAlertBanner = (itemsText, title = "⚠️ 雪房存貨超時警報！") => {
            let banner = $('crOverdueAlertBanner');
            if (!banner) {
                banner = document.createElement('div'); banner.id = 'crOverdueAlertBanner';
                banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[10000] w-[92%] max-w-[390px] bg-red-600 text-white p-3.5 rounded-2xl shadow-2xl flex items-center justify-between border-2 border-white/90 backdrop-blur-md transition-all duration-300 animate-bounce cursor-pointer';
                banner.onclick = window.stopOverdueAlarm; document.body.appendChild(banner);
            }
            banner.innerHTML = `<div class="flex items-center space-x-2.5 min-w-0 flex-1"><div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 animate-pulse"><i data-lucide="bell-ring" class="w-4 h-4 text-white"></i></div><div class="min-w-0 flex-1"><div class="text-xs font-black tracking-wide flex items-center space-x-1.5"><span>${title}</span><span class="bg-white text-red-600 text-[9px] px-1.5 py-0.2 rounded font-bold">10秒</span></div><div class="text-[11px] text-red-100 font-bold truncate mt-0.5">${itemsText}</div></div></div><button onclick="event.stopPropagation(); window.stopOverdueAlarm();" class="ml-2 bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-lg text-[10px] font-black shrink-0 border border-white/40 active:scale-95 transition-all">關閉/靜音</button>`;
            banner.style.opacity = '1'; banner.style.transform = 'translate(-50%, 0)'; banner.classList.remove('hidden');
            lucide.createIcons({ root: banner });
            if (crBannerTimeoutId) clearTimeout(crBannerTimeoutId);
            crBannerTimeoutId = setTimeout(window.stopOverdueAlarm, 10000);
        };

        window.toggleNotificationState = async () => {
            let isEnabled = getLocal('work_cache_cr_notify', false);
            if (!isEnabled) {
                if ("Notification" in window && await Notification.requestPermission() === "granted") {
                    safeSetLocal('work_cache_cr_notify', true); window.showToast("✅ 已開啟推播提醒！"); window.playAlertSound();
                } else {
                    safeSetLocal('work_cache_cr_notify', true); window.showToast("✅ 已開啟站內提示音！"); window.playAlertSound();
                }
            } else { safeSetLocal('work_cache_cr_notify', false); window.stopOverdueAlarm(); window.showToast("🔕 已關閉提醒"); }
            window.crUpdateNotificationBtn();
        };

        window.crUpdateNotificationBtn = () => {
            const isEnabled = getLocal('work_cache_cr_notify', false);
            ['crNotifyToggleBtn', 'memoNotifyToggleBtn'].forEach(btnId => {
                const btn = $(btnId); if (!btn) return;
                if (isEnabled) {
                    btn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-emerald-100 border border-emerald-300 text-emerald-700 shadow-xs hover:bg-emerald-200 transition-all active:scale-95 cursor-pointer";
                    btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span><i data-lucide="bell" class="w-3.5 h-3.5 text-emerald-600 pointer-events-none"></i><span class="text-[10px] font-black">提醒中</span>`;
                } else {
                    btn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-400 shadow-xs hover:bg-slate-200 transition-all active:scale-95 cursor-pointer";
                    btn.innerHTML = `<i data-lucide="bell-off" class="w-3.5 h-3.5 text-slate-400 pointer-events-none"></i><span class="text-[10px] font-bold">靜音</span>`;
                }
            });
            lucide.createIcons();
        };

        window.checkColdRoomOverdueAlerts = () => {
            if (!getLocal('work_cache_cr_notify', false)) return;
            const now = window.getNow().getTime(); let newOverdueList = [];
            crRecords.forEach(r => {
                if (r.status === 'active' && r.type !== '包裝冰' && now > (r.depositTime + CR_TIME_LIMIT_MS) && !window.crNotifiedSet.has(r.id)) {
                    window.crNotifiedSet.add(r.id); newOverdueList.push(r);
                }
            });
            if (newOverdueList.length > 0) { window.playAlertSound(); window.showOverdueAlertBanner(newOverdueList.map(x => `${x.tenant}(${x.type})`).join('、'), "⚠️ 雪房存貨超時警報！"); }
        };

        window.checkMemoAlerts = () => {
            if (!getLocal('work_cache_cr_notify', false)) return;
            const now = window.getNow().getTime(); let newDueMemos = [];
            futureMemos.forEach(m => {
                if (now >= new Date(`${m.date}T${m.time || '00:00'}`).getTime() && !window.memoNotifiedSet.has(m.id)) {
                    window.memoNotifiedSet.add(m.id); newDueMemos.push(m);
                }
            });
            if (newDueMemos.length > 0) { window.playAlertSound(); window.showOverdueAlertBanner(newDueMemos.map(x => x.title).join('、'), "📌 備忘任務到期提醒！"); }
        };

        window.toggleSettingsMenu = (e) => { if (e) e.stopPropagation(); $('settingsDropdown')?.classList.toggle('hidden'); };
        document.addEventListener('click', (e) => {
            const dropdown = $('settingsDropdown'), btn = $('settingsMenuBtn');
            if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && e.target !== btn) dropdown.classList.add('hidden');
        });

        window.applyTabVisibility = () => {
            tabMetadata.forEach(tab => {
                const btn = $(tab.btnId), isVisible = tabVisibilityState[tab.id] !== false;
                if (btn) { btn.style.display = isVisible ? '' : 'none'; btn.classList.toggle('hidden', !isVisible); }
            });
            const cur = localStorage.getItem('activeTab') || 'timeline';
            if (tabVisibilityState[cur] === false) {
                const first = tabMetadata.find(t => tabVisibilityState[t.id] !== false);
                if (first) { localStorage.setItem('activeTab', first.id); window.switchTab(first.id); }
            }
        };

        window.openTabVisibilityModal = () => {

        const splitImageTo4ChunksAsync = (file, maxDim = CONFIG.maxDim, quality = CONFIG.quality) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let { width: w, height: h } = img;
                    if (w > maxDim || h > maxDim) {
                        const scale = maxDim / Math.max(w, h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                    const chunkHeight = Math.floor(h / 4);
                    const chunks = Array.from({ length: 4 }, (_, i) => {
                        const sub = document.createElement('canvas');
                        const curH = (i === 3) ? (h - chunkHeight * 3) : chunkHeight;
                        sub.width = w; sub.height = curH;
                        sub.getContext('2d').drawImage(canvas, 0, i * chunkHeight, w, curH, 0, 0, w, curH);
                        return sub.toDataURL('image/webp', quality);
                    });
                    img.src = '';
                    resolve({ chunks, width: w, height: h });
                };
                img.onerror = () => reject(new Error("圖片載入失敗"));
            };
            r.onerror = () => reject(new Error("檔案讀取失敗"));
        });

        const merge4ChunksAsync = async (chunks) => {
            if (!chunks?.length) return '';
            if (chunks.length === 1) return chunks[0];
            const imgs = await Promise.all(chunks.map(src => new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = () => rej(new Error("切片載入失敗"));
                im.src = src;
            })));

            const totalW = imgs[0].naturalWidth;
            const totalH = imgs.reduce((sum, im) => sum + im.naturalHeight, 0);
            const canvas = document.createElement('canvas');
            canvas.width = totalW; canvas.height = totalH;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';

            let curY = 0;
            imgs.forEach(im => {
                ctx.drawImage(im, 0, curY);
                curY += im.naturalHeight;
            });
            return canvas.toDataURL('image/webp', CONFIG.quality);
        };

            if (item.src) {

                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'gallery_items', id, 'chunks'));
                    const chunkList = [];
                    snap.forEach(d => chunkList.push(d.data()));
                    chunkList.sort((a, b) => a.index - b.index);

                    if (chunkList.length) {
                        const mergedUrl = await merge4ChunksAsync(chunkList.map(c => c.data));
                        memoryImageCache.set(id, mergedUrl);
                        await idbSet(id, mergedUrl);
                        return mergedUrl;
                    }
                } catch (e) {
                    console.error("雲端載入失敗:", e);

            if (!modal) return;
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);
            if (show) renderDatabaseTable();
            else window.searchStall();
        };

        const renderDatabaseTable = () => {
            if ($('dbTotalCount')) $('dbTotalCount').textContent = (window.stallList || []).length;
            const tbody = $('dbTableBody');
            if (!tbody) return;

            tbody.innerHTML = (window.stallList || []).map((item, index) => `
                <tr class="border-b border-slate-100 text-[11px] hover:bg-slate-50">
                    <td class="p-1.5 font-bold text-slate-700">${item.floor}</td>
                    <td class="p-1.5 font-mono font-bold">${item.code}</td>
                    <td class="p-1.5 font-bold text-slate-800">${item.name || '<span class="text-slate-300">無</span>'}</td>
                    <td class="p-1.5 font-mono text-[10px] text-slate-600">${item.hours}</td>
                    <td class="p-1.5 text-right">
                        <button type="button" onclick="window.deleteStall(${index})" class="text-red-400 hover:text-red-600 p-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        };

        window.addNewStall = () => {
            const floor = $('newFloor')?.value.trim();
            const code = $('newCode')?.value.trim().replace(/^#/, '');
            const name = $('newName')?.value.trim() || '';
            const hours = $('newHours')?.value.trim();

            if (!floor || !code || !hours) {
                return window.showToast('請填寫完整樓層、檔號與營業時間！', true);
            }

            window.stallList.unshift({ id: Date.now().toString(), floor, code, hours, name });
            saveStallDatabase();
            renderDatabaseTable();

            if ($('newCode')) $('newCode').value = '';
            if ($('newName')) $('newName').value = '';
            if ($('newHours')) $('newHours').value = '';
            window.showToast('已新增攤位');
        };

        window.deleteStall = (index) => {
            window.showConfirm('刪除攤位', '確定要刪除此筆攤位資料嗎？', () => {
                window.stallList.splice(index, 1);
                saveStallDatabase();
                renderDatabaseTable();
                window.showToast('已刪除攤位');
            });
        };

        window.resetTo108Stalls = () => {
            window.showConfirm('還原數據', '確定要還原為初始 108 筆數據嗎？', () => {
                window.stallList = parseRawData();
                saveStallDatabase();
                renderDatabaseTable();
                window.showToast('✅ 已成功還原 108 筆原始數據！');
            });
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) { window.showToast("連線驗證失敗", true); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user; const dot = $('connectionDot'), st = $('connectionStatus');
            if (user) { dot?.classList.replace('bg-red-500', 'bg-green-500'); if (st) st.textContent = '系統已連線並同步'; setupPureRealtimeSync(); }
            else { dot?.classList.replace('bg-green-500', 'bg-red-500'); if (st) st.textContent = '連線中...'; }
        });

        loadLocalFastCache(); initAuth();
        if (getLocal('work_cache_dark_mode', false)) {
            document.body.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => { const icon = $('darkModeIcon'); if (icon) { icon.setAttribute('data-lucide', 'sun'); lucide.createIcons(); } });
        }
    </script>
</head>

                    <h2 class="text-sm font-bold text-slate-800 tracking-widest flex items-center z-10"><i data-lucide="snowflake" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i>雪房存貨</h2>
                    <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1 z-10">
                        <div class="sync-clock-display flex items-center justify-center tabular-nums px-3 py-1 font-mono text-sm sm:text-base font-black text-slate-800 bg-slate-100 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-200 transition-colors" onclick="window.promptChangeTime()" title="修改時間">--:--:--</div>
                        <button type="button" class="sim-restore-btn hidden bg-white border border-slate-200 text-slate-600 rounded-md w-6 h-6 shadow-sm active:scale-95 flex items-center justify-center" onclick="window.restoreRealTime()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                        <button type="button" class="sim-toggle-btn bg-white border border-slate-200 text-slate-600 rounded-md w-6 h-6 shadow-sm active:scale-95 flex items-center justify-center" onclick="window.toggleSimulation()"><i data-lucide="fast-forward" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                    </div>
                    <div class="flex items-center space-x-1.5 z-10">
                        <button id="crNotifyToggleBtn" onclick="window.toggleNotificationState()" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-400 shadow-xs hover:bg-slate-200 transition-all active:scale-95" title="切換提醒"><i data-lucide="bell-off" class="w-3.5 h-3.5 text-slate-400 pointer-events-none"></i><span class="text-[10px] font-bold">靜音</span></button>
                        <button onclick="window.crExportToCSV()" class="text-slate-500 hover:text-emerald-600 p-1.5 rounded-full active:scale-95 shadow-sm border border-transparent hover:border-emerald-200" title="匯出CSV"><i data-lucide="file-spreadsheet" class="w-4 h-4 pointer-events-none"></i></button>
                    </div>
                </div>
                <div class="flex bg-[#f0ebe1] rounded-lg p-0.5 shadow-inner border border-[#e5dfd3]">
                    <button id="crTabActive" onclick="window.crSwitchTab('active')" class="flex-1 py-1.5 px-0.5 text-xs rounded bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-bold transition-all tracking-widest text-center">存放中</button>
                    <button id="crTabHistory" onclick="window.crSwitchTab('history')" class="flex-1 py-1.5 px-0.5 text-xs text-slate-500 hover:text-slate-700 transition-all tracking-widest text-center font-medium">歷史紀錄</button>
                </div>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto p-2.5 scrollbar-hide relative" id="crMainContent">
                <div id="crActiveControls" class="mb-2 flex justify-between items-center px-0.5">
                    <div class="text-xs text-slate-500 font-bold tracking-widest">目前存放: <span id="crActiveCount" class="text-blue-600 text-sm sm:text-base">0</span> 筆</div>
                    <button onclick="window.crOpenAddModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-2.5 py-1.5 rounded-md text-xs font-bold transition-colors shadow-sm flex items-center active:scale-95"><i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i> 新增存放</button>
                </div>
                <div id="crRecordsContainer" class="space-y-2 pb-12"></div>
            </div>
        </main>

        <!-- 收工查核分頁 -->
        <main id="closingPage" class="hidden flex-1 min-h-0 flex-col relative z-10 bg-[#fdfbf7] overflow-hidden">
            <!-- 頂部功能子導航 -->
            <div class="bg-[#fdfbf7]/95 backdrop-blur-md p-3 border-b border-[#e5dfd3] shadow-xs shrink-0 flex items-center justify-between z-20">
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 rounded-lg bg-indigo-500 text-white flex items-center justify-center shadow-xs">
                        <i data-lucide="store" class="w-3.5 h-3.5"></i>
                    </div>
                    <h2 class="text-sm text-slate-800 tracking-wider font-black">收工查核</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" onclick="window.toggleDatabaseModal(true)" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 px-2 py-1 rounded-lg text-xs font-bold flex items-center transition-all shadow-xs active:scale-95">
                        <i data-lucide="database" class="w-3.5 h-3.5 mr-1"></i>數據庫
                    </button>
                    <div id="currentTimeBadge" class="text-[10.5px] font-mono font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200">
                        --:--
                    </div>
                </div>
            </div>

            <!-- 搜尋與比對呈現區域 -->
            <div class="flex-1 min-h-0 flex flex-col items-center p-3 relative z-10 overflow-hidden">
                <div class="w-full max-w-[390px] flex flex-col items-center pt-3 h-full">
                    <!-- 搜尋卡片 -->
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-xs p-2.5 w-full text-center shrink-0">
                        <div class="relative flex items-center">
                            <i data-lucide="search" class="absolute left-3 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="stallQueryInput" oninput="window.searchStall()" placeholder="輸入檔號 (例: 2、13、030)" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-8 py-2 text-sm font-bold text-slate-800 placeholder-slate-400 focus:border-indigo-500 focus:bg-white focus:outline-none tracking-wide text-center">
                            <button type="button" onclick="document.getElementById('stallQueryInput').value=''; window.searchStall();" class="absolute right-2 text-slate-400 hover:text-slate-600 p-1">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 引導說明 -->
                    <div id="placeholderInfo" class="text-center py-5 text-slate-400 text-xs">
                        請於上方輸入檔號，系統將自動比對各樓層狀況
                    </div>

                    <!-- 滾動結果清單 -->
                    <div id="stallResultList" class="w-full flex-1 min-h-0 overflow-y-auto space-y-2.5 scrollbar-hide hidden mt-2.5 pb-6"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 彈窗群 -->
    <div id="tabVisibilityModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[320px] shadow-2xl relative scrollbar-hide flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-2.5 mb-3 border-b border-slate-100">
                <h3 class="font-bold text-sm text-slate-800 flex items-center"><i data-lucide="layout-grid" class="w-4 h-4 mr-2 text-blue-500"></i> 自訂分頁顯示</h3>
                <button onclick="window.closeTabVisibilityModal()" class="text-slate-400 p-1 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </header>
            <div id="tabVisibilityList" class="space-y-2 mb-4"></div>
            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                <button onclick="window.closeTabVisibilityModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                <button onclick="window.saveTabVisibility()" class="px-4 py-1.5 bg-blue-500 text-white rounded-lg text-xs font-bold shadow-sm">儲存</button>
            </div>
        </div>
    </div>

    <!-- 彈窗：確認上傳圖片 -->
    <div id="uploadBatchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[260] hidden flex-col items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[400px] shadow-2xl relative max-h-[85vh] flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-2.5 mb-2 border-b border-slate-100 shrink-0">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="images" class="w-4 h-4"></i></div>
                    <h3 class="font-bold text-sm text-slate-800 tracking-wide">確認上傳圖片</h3>
                </div>
                <button onclick="window.closeUploadBatchModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            </header>
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-2 text-center text-xs font-bold text-blue-700 shrink-0 mb-2.5">
                📸 已選取 <span id="uploadBatchCount" class="text-blue-900 font-black">0</span> 張圖片
            </div>
            <div id="uploadBatchList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 scrollbar-hide mb-2.5"></div>
            <div class="flex justify-end space-x-2 pt-2.5 border-t border-slate-100 shrink-0">
                <button onclick="window.closeUploadBatchModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold active:scale-95">取消</button>
                <button onclick="window.confirmBatchUpload()" class="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95 flex items-center"><i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>確認發布</button>
            </div>
        </div>
    </div>

    <!-- 全螢幕圖片檢視器 -->
    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[350] hidden flex-col items-center justify-center p-4" onclick="window.closeFullscreenImg()">
        <button type="button" onclick="window.closeFullscreenImg()" class="absolute top-5 right-5 text-white bg-slate-800/80 p-2 rounded-full active:scale-95 shadow-lg border border-slate-600 hover:bg-red-600 transition-colors z-10">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" onclick="event.stopPropagation()" />
    </div>

    <!-- 分類管理彈窗 -->
    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-xs flex items-center"><i data-lucide="settings-2" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1 hover:bg-slate-200 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[50vh] bg-[#fdfbf7] space-y-2 scrollbar-hide"></div>
        </div>
    </div>

    <div id="customConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[10000] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[300px] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex items-center bg-slate-50"><h2 id="confirmModalTitle" class="text-slate-800 font-bold text-base flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> 確認</h2></header>
            <div class="p-5 text-sm text-slate-600 text-center" id="confirmModalMessage"></div>
            <div class="p-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/50">
                <button id="confirmBtnCancel" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-bold shadow-sm">取消</button>
                <button id="confirmBtnOk" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-bold shadow-sm">確定</button>
            </div>
        </div>
    </div>

    <div id="scheduleManageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-fit min-w-[96vw] max-w-[98vw] flex flex-col overflow-hidden relative">
            <header class="p-2.5 sm:p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h2 class="text-slate-800 font-bold text-sm flex items-center"><i data-lucide="users-round" class="w-4 h-4 mr-2 text-blue-500"></i> 成員排班表</h2><button onclick="window.closeScheduleManager()" class="text-slate-400 p-1.5 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button></header>
            <div id="scheduleManageList" class="p-1.5 sm:p-2.5 overflow-y-auto max-h-[90vh] bg-[#fdfbf7] scrollbar-hide"></div>
        </div>
    </div>

    <div id="crAddModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[300px] shadow-2xl relative max-h-[85vh] overflow-y-auto scrollbar-hide">
            <h3 class="font-bold text-base mb-3 text-slate-800 flex items-center border-b pb-2"><i data-lucide="package-plus" class="w-4 h-4 mr-2 text-blue-500"></i> 新增存放</h3>
            <div class="space-y-3">
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">檔主編號 / 名稱</label><input type="text" id="crInputTenant" placeholder="例如: R-099" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 text-center"></div>
                <div class="flex gap-2">
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">存入日期</label><input type="date" id="crInputDate" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs text-center"></div>
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="crInputTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs text-center"></div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">經手客服人員</label><select id="crInputStaff" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-bold text-slate-700 bg-slate-50 text-center"></select></div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">貨物類型</label>
                    <div id="crTypeContainer" class="flex flex-wrap gap-1 mb-1.5 justify-center"></div>
                    <div class="flex items-center mt-1 max-w-[160px] mx-auto">
                        <input type="text" id="crInputNewType" placeholder="新類型..." class="w-20 border border-slate-300 rounded-l-lg px-2 py-1 text-[10px] font-bold text-slate-700 bg-slate-50 text-center">
                        <button onclick="window.crAddNewType()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded-r-lg border-y border-r border-slate-300 text-[10px] font-bold shrink-0">新增</button>
                    </div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">存放數量 (件/箱)</label><input type="number" id="crInputQuantity" placeholder="數量" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-bold text-slate-700 bg-slate-50 text-center"></div>
            </div>
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseAddModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                <button onclick="window.crSubmitAddRecord()" class="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-xs font-bold shadow-sm">確認存入</button>
            </div>
        </div>
    </div>

    <div id="crWithdrawModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[300px] shadow-2xl relative scrollbar-hide">
            <h3 class="font-bold text-base mb-3 text-slate-800 flex items-center border-b pb-2"><i data-lucide="package-minus" class="w-4 h-4 mr-2 text-amber-500"></i> 取出貨物</h3>
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 mb-3 shadow-inner">
                <div class="text-[10px] text-slate-500 mb-0.5">檔主: <span id="crWithdrawTenantDisplay" class="font-bold text-slate-700 text-xs"></span></div>
                <div class="text-[10px] text-slate-500">目前剩餘數量: <span id="crWithdrawRemainDisplay" class="font-bold text-blue-600 text-xs"></span></div>
            </div>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">提取日期</label><input type="date" id="crInputWithdrawDate" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs text-center"></div>
                    <div class="flex-1"><label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="crInputWithdrawTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs text-center"></div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-500 block mb-1">本次取出數量</label><input type="number" id="crInputWithdrawQty" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-lg font-bold text-slate-700 text-center bg-white shadow-inner"></div>
            </div>
            <input type="hidden" id="crCurrentActionId">
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseWithdrawModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                <button onclick="window.crSubmitWithdraw()" class="px-3 py-1.5 bg-amber-500 text-white rounded-lg text-xs font-bold shadow-sm">確認取出</button>
            </div>
        </div>
    </div>

    <!-- 攤位數據庫管理 Modal -->
    <div id="dbModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[1200] hidden flex-col items-center justify-center p-3">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[390px] h-[82vh] shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="flex justify-between items-center pb-2.5 border-b border-slate-100 shrink-0">
                <div class="flex items-center space-x-2">
                    <i data-lucide="database" class="w-4 h-4 text-indigo-500"></i>
                    <h3 class="font-black text-xs sm:text-sm text-slate-800">攤位數據庫管理 (<span id="dbTotalCount">0</span> 檔)</h3>
                </div>
                <button type="button" onclick="window.toggleDatabaseModal(false)" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </header>

            <!-- 手動新增 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 my-2.5 shrink-0 space-y-1.5">
                <div class="text-[11px] font-bold text-slate-600">手動新增攤位</div>
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="newFloor" placeholder="樓層 (例: 地下)" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs">
                    <input type="text" id="newCode" placeholder="檔號 (例: 002)" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono">
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="newName" placeholder="寶號 (例: 東興發)" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs">
                    <input type="text" id="newHours" placeholder="營業時間 (例: 07:00-14:00)" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono">
                </div>
                <button type="button" onclick="window.addNewStall()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg py-1.5 text-xs font-bold transition-all shadow-xs active:scale-95">確認新增</button>
            </div>

            <!-- 清單表格 -->
            <div class="flex-1 overflow-y-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-[10.5px] text-slate-600 sticky top-0 shadow-xs">
                        <tr>
                            <th class="p-1.5">樓層</th>
                            <th class="p-1.5">檔號</th>
                            <th class="p-1.5">寶號</th>
                            <th class="p-1.5">時間</th>
                            <th class="p-1.5 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dbTableBody"></tbody>
                </table>
            </div>

            <div class="pt-2.5 border-t border-slate-100 flex justify-between items-center shrink-0 mt-2">
                <button type="button" onclick="window.resetTo108Stalls()" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1"></i>還原108筆數據
                </button>
                <button type="button" onclick="window.toggleDatabaseModal(false)" class="px-3.5 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-bold active:scale-95 shadow-xs">完成並關閉</button>
            </div>
        </div>
    </div>
</body>
</html>
