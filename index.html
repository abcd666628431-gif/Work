    <style>
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        
        html, body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0ebe1; color: #334155; overflow-x: hidden; width: 100%; position: relative; }
        .hud-ring { transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .marker-yellow { background: linear-gradient(104deg, transparent 0%, rgba(254, 240, 138, 0.8) 2%, rgba(253, 224, 71, 0.9) 98%, transparent 100%) no-repeat 0 85% / 100% 38%; padding: 0 2px; }
        .marker-pink { background: linear-gradient(104deg, transparent 0%, rgba(254, 205, 211, 0.8) 2%, rgba(253, 164, 175, 0.9) 98%, transparent 100%) no-repeat 0 85% / 100% 38%; padding: 0 2px; }
        .marker-blue { background: linear-gradient(104deg, transparent 0%, rgba(186, 230, 253, 0.8) 2%, rgba(125, 211, 252, 0.9) 98%, transparent 100%) no-repeat 0 85% / 100% 38%; padding: 0 2px; }
        .marker-green { background: linear-gradient(104deg, transparent 0%, rgba(187, 247, 208, 0.8) 2%, rgba(134, 239, 172, 0.9) 98%, transparent 100%) no-repeat 0 85% / 100% 38%; padding: 0 2px; }

        .sticky-note-1 { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-left: 3px solid #fbbf24; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }
        .sticky-note-2 { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-left: 3px solid #4ade80; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }
        .sticky-note-3 { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-left: 3px solid #60a5fa; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }

        .tape-strip { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 12px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 1px 2px rgba(0,0,0,0.05); backdrop-filter: blur(2px); z-index: 5; border-radius: 1px; }
        .tape-strip-blue { background-color: rgba(186, 230, 253, 0.5); }
        .tape-strip-red { background-color: rgba(254, 205, 211, 0.5); }

        .daily-task-card { transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .timeline-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .bring-to-front { z-index: 9999 !important; }
        .bring-to-front .timeline-card { transform: translateY(-20px) scale(1.03) !important; box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.25), 0 15px 15px -5px rgba(0, 0, 0, 0.1) !important; opacity: 1 !important; }

        .timer-pulse { animation: pulse-red 2s infinite; }

        @keyframes flag-fade-in { 0% { opacity: 0; transform: scale(0.5) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .animate-flag-in { animation: flag-fade-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        body.dark-mode { background-color: #0f172a !important; color: #cbd5e1 !important; color-scheme: dark; }
        .dark-mode .bg-\[\#fdfbf7\] { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .bg-\[\#f0ebe1\] { background-color: #0f172a !important; }
        .dark-mode header.bg-\[\#fdfbf7\]\/95 { background-color: rgba(30, 41, 59, 0.95) !important; border-color: #334155 !important;}
        .dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .bg-slate-50, .dark-mode .bg-slate-100 { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode .text-slate-800 { color: #cbd5e1 !important; }
        .dark-mode .text-slate-700 { color: #94a3b8 !important; }
        .dark-mode .text-slate-600 { color: #64748b !important; }
        .dark-mode .text-slate-500 { color: #475569 !important; }

        .dark-mode .active-task .absolute.bg-green-400 { opacity: 0.2 !important; box-shadow: none !important; }
        .dark-mode .active-task .shadow-\[0_0_8px_rgba\(74\,222\,128\,1\)\] { box-shadow: none !important; background-color: #4ade80 !important; opacity: 0.5; }
        
        .dark-mode .marker-yellow, .dark-mode .marker-pink, .dark-mode .marker-blue, .dark-mode .marker-green { filter: brightness(0.6) opacity(0.7); }
        .dark-mode .sticky-note-1, .dark-mode .sticky-note-2, .dark-mode .sticky-note-3 { background: #0f172a !important; border-color: #475569 !important; box-shadow: none !important; }
        .dark-mode .tape-strip { background-color: rgba(255,255,255,0.1) !important; border-color: rgba(255,255,255,0.05) !important; }
        
        .dark-mode #timelineStickyHeader { background: linear-gradient(to bottom, #1e293b, rgba(30,41,59,0.95), transparent) !important; }
        .dark-mode #tlBigClock { background-color: rgba(30, 41, 59, 0.9) !important; color: #f8fafc !important; border-color: #334155 !important; }
        .dark-mode #tlBigDate { color: #94a3b8 !important; }
        .dark-mode .timeline-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .dark-mode .active-task .timeline-card { background-color: #172554 !important; border-color: #1e3a8a !important; }
        .dark-mode .active-task .timeline-card .bg-slate-100\/50, .dark-mode .timeline-card .bg-slate-100\/50 { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode input, .dark-mode textarea, .dark-mode select { background-color: #334155 !important; color: #f8fafc !important; border-color: #475569 !important; }
        .dark-mode header .bg-white\/70 { background-color: #1e293b !important; border-color: #475569 !important; }

        .dark-mode #mapWrapper { background-color: #0f172a !important; border-color: #334155 !important; }
        .dark-mode .bg-blue-50\/60 { background-color: rgba(30, 58, 138, 0.2) !important; border-color: #334155 !important; }
        .dark-mode .bg-emerald-50\/60 { background-color: rgba(6, 78, 59, 0.2) !important; border-color: #334155 !important; }
        .dark-mode .text-blue-300\/80 { color: rgba(96, 165, 250, 0.4) !important; }
        .dark-mode .text-emerald-300\/80 { color: rgba(52, 211, 153, 0.4) !important; }
        .dark-mode .bg-\[\#f4f1eb\] { background-color: #1e293b !important; border-color: #334155 !important; }

        @keyframes room-walk-a { 0%, 100% { transform: translate3d(0, 0, 0); } 33% { transform: translate3d(-25px, 12px, 0); } 66% { transform: translate3d(20px, 18px, 0); } }
        @keyframes room-walk-b { 0%, 100% { transform: translate3d(0, 0, 0); } 25% { transform: translate3d(22px, 8px, 0); } 50% { transform: translate3d(-15px, 20px, 0); } 75% { transform: translate3d(-22px, 5px, 0); } }
        @keyframes room-walk-c { 0%, 100% { transform: translate3d(0, 0, 0); } 33% { transform: translate3d(12px, 15px, 0); } 66% { transform: translate3d(-18px, 8px, 0); } }
        .animate-float-a { animation: room-walk-a 14s linear infinite; will-change: transform; }
        .animate-float-b { animation: room-walk-b 16s linear infinite; will-change: transform; }
        .animate-float-c { animation: room-walk-c 12s linear infinite; will-change: transform; }
    </style>

    <script type="module">
        import { initializeApp } from "https://gs.jurieo.com/gemini/gstatic/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://gs.jurieo.com/gemini/gstatic/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://gs.jurieo.com/gemini/gstatic/firebasejs/11.6.1/firebase-firestore.js";

        const userFirebaseConfig = {
            apiKey: "AIzaSyBsdBYBeJYqgeDDxF39lZ0pr785SMnwvJs",
            authDomain: "work-eb62f.firebaseapp.com",
            databaseURL: "https://work-eb62f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "work-eb62f",
            storageBucket: "work-eb62f.firebasestorage.app",
            messagingSenderId: "428210130706",
            appId: "1:428210130706:web:142207595423bdf661adcb"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let currentUser = null;
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionDot = document.getElementById('connectionDot');

        let dailyScheduleData = [];
        let taskCompletionState = {};
        let taskExtrasState = {}; 
        let taskArchiveState = {}; 
        let subTaskCompletionState = {}; 
        let expandedTasksState = {}; 
        let galleryCategories = ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他'];
        let galleryItems = [];
        let futureMemos = []; 
        
        const defaultMapPoints = {
            'pt_1': { name: '客服室', x: 50, y: 18 },
            'pt_2': { name: '一樓大清點', x: 0, y: 0 },
            'pt_3': { name: '花園仔', x: 27.5, y: 62 },
            'pt_4': { name: '魚檔', x: 72.5, y: 62 },
            'pt_5': { name: '整體巡邏', x: 50, y: 88 },
            'pt_6': { name: '地面層 大清點', x: 0, y: 0 },
            'pt_7': { name: '休息中', x: 0, y: 0 }
        };
        let mapData = { points: JSON.parse(JSON.stringify(defaultMapPoints)) }; 
        let memberSchedules = []; 
        let teamMembers = [];
        
        let activeGridMember = null;
        let isEditingMembers = false;
        let isGridDragging = false;
        let gridDragAction = null; 
        window.lastTouchedEl = null;
        let splitHoursState = {};

        const memberColorPalettes = [
            { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-300', activeBg: 'bg-rose-500' },
            { bg: 'bg-sky-100', text: 'text-sky-700', border: 'border-sky-300', activeBg: 'bg-sky-500' },
            { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-300', activeBg: 'bg-emerald-500' },
            { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', activeBg: 'bg-amber-500' },
            { bg: 'bg-violet-100', text: 'text-violet-700', border: 'border-violet-300', activeBg: 'bg-violet-500' },
            { bg: 'bg-teal-100', text: 'text-teal-700', border: 'border-teal-300', activeBg: 'bg-teal-500' },
            { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300', activeBg: 'bg-orange-500' },
            { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-300', activeBg: 'bg-indigo-500' },
            { bg: 'bg-pink-100', text: 'text-pink-700', border: 'border-pink-300', activeBg: 'bg-pink-500' },
            { bg: 'bg-lime-100', text: 'text-lime-800', border: 'border-lime-300', activeBg: 'bg-lime-500' },
            { bg: 'bg-cyan-100', text: 'text-cyan-800', border: 'border-cyan-300', activeBg: 'bg-cyan-500' },
            { bg: 'bg-fuchsia-100', text: 'text-fuchsia-700', border: 'border-fuchsia-300', activeBg: 'bg-fuchsia-500' }
        ];

        window.getMemberColorClass = (name) => {
            if (!name) return { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', activeBg: 'bg-blue-500' };
            let seed = 0;
            for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
            return memberColorPalettes[Math.abs(seed) % memberColorPalettes.length];
        };

        window.openAsPopout = () => {
            const width = 450, height = 900;
            const left = Math.max(0, (window.screen.width - width) / 2);
            const top = Math.max(0, (window.screen.height - height) / 2);
            window.open(window.location.href, 'WorkRecordPopup', `width=${width},height=${height},left=${left},top=${top},menubar=no,status=no,toolbar=no,location=no,scrollbars=no,resizable=yes`);
        };

        let crRecords = [];
        let crItemTypes = ['海鮮', '肉類', '蔬果', '包裝冰', '其他'];
        let crCurrentSelectedType = '';
        let crCurrentTab = 'active'; 
        const CR_TIME_LIMIT_MS = 24 * 60 * 60 * 1000;

        let actionHistory = [];
        window.saveStateSnapshot = () => {
            actionHistory.push({
                tasks: JSON.parse(JSON.stringify(taskCompletionState || {})),
                subtasks: JSON.parse(JSON.stringify(subTaskCompletionState || {}))
            });
            if (actionHistory.length > 30) actionHistory.shift(); 
        };

        let currentGalleryCategory = '全部';
        window.isEditMode = false;
        let timelineUpdateInterval; 
        
        let timeOffset = 0; 
        let isFastForwarding = false; 
        let simInterval = null;
        window.getNow = () => new Date(Date.now() + timeOffset);

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('work_cache_dark_mode', isDark);
            const icon = document.getElementById('darkModeIcon');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        };

        window.showToast = (message, isError = false) => {
            const toast = document.createElement('div');
            toast.className = `fixed top-16 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-full shadow-lg text-sm font-bold z-[9999] transition-all duration-300 ${isError ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.showConfirm = (title, message, onConfirmCallback) => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmModalTitle').innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> ${title}`;
            document.getElementById('confirmModalMessage').innerHTML = message;
            
            const cancelBtn = document.getElementById('confirmBtnCancel');
            const okBtn = document.getElementById('confirmBtnOk');
            
            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                okBtn.removeEventListener('click', okHandler);
                cancelBtn.removeEventListener('click', cleanup);
            };
            const okHandler = () => {
                cleanup();
                if (typeof onConfirmCallback === 'function') onConfirmCallback();
            };
            okBtn.addEventListener('click', okHandler);
            cancelBtn.addEventListener('click', cleanup);
            lucide.createIcons();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        const getLocal = (key, defaultVal) => {
            try { const val = localStorage.getItem(key); return val ? JSON.parse(val) : defaultVal; } catch(e) { return defaultVal; }
        };
        const safeSetLocal = (key, data) => {
            try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
        };

        window.renderDailySchedule = () => {
            const container = document.getElementById('scheduleContainer');
            if (!container) return;
            const totalTasks = dailyScheduleData.length;
            const completedTasks = dailyScheduleData.filter(t => taskCompletionState[t.id]).length;
            const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            const pctEl = document.getElementById('hudPercentage');
            const cntEl = document.getElementById('hudTaskCount');
            const ringEl = document.getElementById('hudProgressRing');
            if (pctEl) pctEl.textContent = `${percentage}%`;
            if (cntEl) cntEl.textContent = `${completedTasks}/${totalTasks}`;
            if (ringEl) {
                const offset = 251.2 - (251.2 * percentage) / 100;
                ringEl.style.strokeDashoffset = offset;
            }

            container.innerHTML = dailyScheduleData.map(task => {
                const isCompleted = !!taskCompletionState[task.id];
                const groupBadge = task.group ? `<span class="text-[10px] px-1.5 py-0.5 rounded border font-bold mr-1.5 ${window.getGroupColor(task.group)}">${task.group}組</span>` : '';
                return `
                <div class="daily-task-card bg-white rounded-xl p-3 border border-slate-200 shadow-sm relative transition-all ${isCompleted ? 'opacity-60 bg-slate-50' : ''}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 flex-1 min-w-0">
                            <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="window.toggleTask('${task.id}')" class="w-4 h-4 rounded text-blue-600 focus:ring-0 cursor-pointer">
                            <span class="font-mono text-xs font-bold text-slate-500">${task.start} - ${task.end}</span>
                            ${groupBadge}
                            <span class="font-bold text-sm text-slate-800 truncate ${isCompleted ? 'line-through text-slate-400' : ''}">${task.title}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        function loadLocalFastCache() {
            dailyScheduleData = getLocal('work_cache_schedule', []);
            taskCompletionState = getLocal('work_cache_task_states', {});
            taskExtrasState = getLocal('work_cache_daily_extras', {});
            taskArchiveState = getLocal('work_cache_daily_archive', {});
            subTaskCompletionState = getLocal('work_cache_subtask_states', {});
            galleryCategories = getLocal('work_cache_gallery_categories', ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他']);
            galleryItems = getLocal('work_cache_gallery_items', []);
            splitHoursState = getLocal('work_cache_split_hours', {});
            futureMemos = getLocal('work_cache_future_memos', []);
            mapData = getLocal('work_cache_map_data', { points: {} });
            teamMembers = getLocal('work_cache_team_members', ['周靜儀', '蔣開紅', '何雪芬', '黃美濃', '林浩霆', '黃永超', '李頌瑤', '譚建安', '甘永寧', '陳麗嬋', '姚桂菊', '嚴飛菲']);
            
            crRecords = getLocal('coldRoomRecords', []);
            crItemTypes = getLocal('coldRoomTypes', ['海鮮', '肉類', '蔬果', '包裝冰', '其他']);
            if(!crItemTypes.includes('包裝冰')) crItemTypes.push('包裝冰');

            if(!mapData.points || Object.keys(mapData.points).length === 0) {
                mapData.points = JSON.parse(JSON.stringify(defaultMapPoints));
            } else {
                Object.keys(defaultMapPoints).forEach(k => {
                    if (mapData.points[k]) {
                        mapData.points[k].x = defaultMapPoints[k].x;
                        mapData.points[k].y = defaultMapPoints[k].y;
                    }
                });
            }
            memberSchedules = getLocal('work_cache_member_schedules', []);
            if (!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');

            if(document.getElementById('dailySchedulePage') && !document.getElementById('dailySchedulePage').classList.contains('hidden')) window.renderDailySchedule();
            if(document.getElementById('galleryPage') && !document.getElementById('galleryPage').classList.contains('hidden')) window.renderGallery();
            if(document.getElementById('timelinePage') && !document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
            if(document.getElementById('mapPage') && !document.getElementById('mapPage').classList.contains('hidden')) window.renderMap();
            if(document.getElementById('coldRoomPage') && !document.getElementById('coldRoomPage').classList.contains('hidden')) window.crRenderList();
        }

        function setupPureRealtimeSync() {
            if (!currentUser) return;
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), (docSnap) => {
                if(docSnap.exists() && docSnap.data().tasks) { 
                    const newData = docSnap.data().tasks;
                    if (JSON.stringify(dailyScheduleData) !== JSON.stringify(newData)) {
                        dailyScheduleData = newData;
                        safeSetLocal('work_cache_schedule', dailyScheduleData);
                        window.renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, console.error);
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().states || {};
                    if (JSON.stringify(taskCompletionState) !== JSON.stringify(newData)) {
                        taskCompletionState = newData;
                        safeSetLocal('work_cache_task_states', taskCompletionState);
                        window.renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, console.error);
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().states || {};
                    if (JSON.stringify(subTaskCompletionState) !== JSON.stringify(newData)) {
                        subTaskCompletionState = newData;
                        safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
                        window.renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, console.error);

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_extras'), (docSnap) => {
                if(docSnap.exists()) { 
                    const newData = docSnap.data().extras || {};
                    if (JSON.stringify(taskExtrasState) !== JSON.stringify(newData)) {
                        taskExtrasState = newData;
                        safeSetLocal('work_cache_daily_extras', taskExtrasState);
                        window.renderDailySchedule(); 
                        if(!document.getElementById('timelinePage')?.classList.contains('hidden')) window.renderTimeline(false);
                    }
                }
            }, console.error);

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'gallery_categories'), (docSnap) => {
                if(docSnap.exists()) { 
                    galleryCategories = docSnap.data().categories || ['全部', '任務附件', '未分類', '街市檔口', '鮮風機', '價格表', '其他'];
                    if(!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');

        window.renderMap = () => {
            const pointsContainer = document.getElementById('mapPointsContainer');
            if(pointsContainer) pointsContainer.innerHTML = '';
            window.updateMapSimulation(); 
        };

        window.updateMapSimulation = () => {
            if(document.getElementById('mapPage')?.classList.contains('hidden')) return;
            const container = document.getElementById('mapPointsContainer');
            if(!container) return;

            const now = window.getNow();
            const nowTime = now.getTime();
            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
            const isMobile = window.innerWidth < 640;
            
            let activeMembers = {}, incomingMembers = {}; 

            memberSchedules.forEach(sched => {
                const start = parseTime(sched.start).getTime();
                const end = parseTime(sched.end).getTime();
                
                if(nowTime >= start && nowTime <= end) {
                    activeMembers[sched.name] = sched.locationId;
                    const [endH, endM] = sched.end.split(':').map(Number);
                    const minsBeforeEnd = (endH * 60 + endM) - currentTimeMinutes;
                    
                    if (minsBeforeEnd > 0 && minsBeforeEnd <= 10) {
                        const nextSched = memberSchedules.find(ns => ns.locationId === sched.locationId && ns.name !== sched.name && ns.start === sched.end);
                        if (nextSched) {
                            incomingMembers[sched.locationId] = incomingMembers[sched.locationId] || [];
                            if (!incomingMembers[sched.locationId].includes(nextSched.name)) {
                                incomingMembers[sched.locationId].push(nextSched.name);
                            }
                        }
                    }
                }
            });

            let locGroups = {};
            for (let [name, locId] of Object.entries(activeMembers)) {
                locGroups[locId] = locGroups[locId] || [];
                locGroups[locId].push(name);
            }
            
            ['pt_2', 'pt_6', 'pt_7'].forEach(locId => {
                const names = locGroups[locId] || [];
                const incomingNames = incomingMembers[locId] || [];
                const stationCard = document.getElementById(`station-${locId}`);
                
                if (stationCard) {
                    let membersBox = stationCard.querySelector('.ext-members-box');
                    if (!membersBox) {
                        membersBox = document.createElement('div');
                        membersBox.className = 'ext-members-box flex flex-wrap items-center justify-center gap-1.5 -mt-1.5 pt-0';
                        stationCard.appendChild(membersBox);
                    } else {
                        membersBox.innerHTML = ''; 
                    }

                    names.forEach((name) => {
                        const memberDiv = document.createElement('div');
                        memberDiv.className = 'flex flex-col items-center justify-center m-0.5 scale-90';
                        memberDiv.innerHTML = `
                            <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center">
                                <i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${name}
                            </div>
                            <div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center">
                                <i data-lucide="user" class="w-3 h-3 text-white"></i>
                            </div>
                        `;
                        membersBox.appendChild(memberDiv);
                    });

                    incomingNames.forEach((nextName) => {
                        const incomingDiv = document.createElement('div');
                        incomingDiv.className = 'flex flex-col items-center justify-center m-0.5 scale-90 animate-flag-in';
                        incomingDiv.innerHTML = `
                            <div class="bg-amber-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-sm whitespace-nowrap mb-1 tracking-wider border border-white/80 flex items-center">
                                <i data-lucide="user-plus" class="w-3 h-3 mr-1 text-white"></i>待:${nextName}
                            </div>
                            <div class="w-5 h-5 bg-amber-500 rounded-full border-[2px] border-white shadow-md flex items-center justify-center">
                                <i data-lucide="user" class="w-3 h-3 text-white"></i>
                            </div>
                        `;
                        membersBox.appendChild(incomingDiv);
                    });
                }
            });

            document.querySelectorAll('.member-dynamic-marker').forEach(el => el.dataset.active = "false");
            
            for (let [locId, names] of Object.entries(locGroups)) {
                if (locId === 'pt_2' || locId === 'pt_6' || locId === 'pt_7') continue; 
                const loc = mapData.points[locId];
                if(!loc) continue;

                const incomingNames = incomingMembers[locId] || [];

                names.forEach((name, idx) => {
                    let markerId = `dyn-marker-${name}-${locId}-current`;
                    let marker = document.getElementById(markerId);
                    if(!marker) {
                        marker = document.createElement('div');
                        marker.id = markerId;
                    }
                    marker.innerHTML = `
                        <div class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-lg whitespace-nowrap mb-1 tracking-wider border border-white/80 antialiased flex items-center">
                            <i data-lucide="user" class="w-3 h-3 mr-1 text-white"></i>${name}
                        </div>
                        <div class="relative flex items-center justify-center">
                            <div class="w-5 h-5 bg-blue-500 rounded-full border-[2px] border-white shadow-md z-10 relative flex items-center justify-center">
                                <i data-lucide="user" class="w-3 h-3 text-white"></i>
                            </div>
                            <div class="absolute w-8 h-8 bg-blue-400/40 rounded-full radar-slow z-0"></div>
                        </div>
                    `;

                    if (marker.parentNode !== container) container.appendChild(marker);
                    const offset = names.length > 1 ? (idx - (names.length - 1) / 2) * 75 : 0;
                    marker.style.left = `calc(${loc.x}% + ${offset}px - 20px)`;
                    marker.style.top = `calc(${loc.y}% - 55px)`; 
                    
                    let seed = 0;
                    for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
                    const animClasses = ['animate-float-a', 'animate-float-b', 'animate-float-c'];
                    marker.className = `member-dynamic-marker absolute flex flex-col items-center justify-center transform -translate-x-1/2 pointer-events-none z-30 drop-shadow-xl ${animClasses[seed % animClasses.length]}`;
                    marker.style.animationDelay = `${(seed % 5) * -3}s`;
                    marker.dataset.active = "true";
                });

                incomingNames.forEach((name, idx) => {
                    let markerId = `dyn-marker-${name}-${locId}-incoming`;
                    let marker = document.getElementById(markerId);
                    if(!marker) {
                        marker = document.createElement('div');
                        marker.id = markerId;
                    }
                    marker.innerHTML = `
                        <div class="bg-amber-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-lg whitespace-nowrap mb-1 tracking-wider border border-white/90 antialiased flex items-center shadow-amber-500/30">
                            <i data-lucide="user-plus" class="w-3 h-3 mr-1 text-white"></i>待: ${name}
                        </div>
                        <div class="relative flex items-center justify-center">
                            <div class="w-5 h-5 bg-amber-500 rounded-full border-[2px] border-white shadow-md z-10 relative flex items-center justify-center">
                                <i data-lucide="user" class="w-3 h-3 text-white"></i>
                            </div>
                            <div class="absolute w-8 h-8 bg-amber-400/40 rounded-full radar-slow z-0"></div>
                        </div>
                    `;

                    if (marker.parentNode !== container) container.appendChild(marker);
                    const offset = incomingNames.length > 1 ? (idx - (incomingNames.length - 1) / 2) * 55 : 0;
                    marker.style.left = `calc(${loc.x}% + ${offset}px - 35px)`;

                    let topOffset = isMobile ? '-75px' : '-110px';
                    if (locId === 'pt_1') topOffset = isMobile ? '-45px' : '-65px';
                    else if (locId === 'pt_3' || locId === 'pt_4') topOffset = isMobile ? '-85px' : '-115px';
                    else if (locId === 'pt_5') topOffset = isMobile ? '-70px' : '-95px';
                    marker.style.top = `calc(${loc.y}% + ${topOffset})`; 
                    marker.className = `member-dynamic-marker absolute flex flex-col items-center justify-center transform -translate-x-1/2 pointer-events-none z-[60] drop-shadow-xl animate-flag-in`;
                    marker.dataset.active = "true";
                });
            }

            lucide.createIcons();
            document.querySelectorAll('.member-dynamic-marker').forEach(el => {
                if(el.dataset.active === "false") el.remove();
            });
        };

        window.openScheduleManager = () => {
            window.renderScheduleManager();
            const modal = document.getElementById('scheduleManageModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };
        
        window.closeScheduleManager = () => {
            const modal = document.getElementById('scheduleManageModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.updateMapSimulation(); 
        };

        window.toggleEditMembers = () => { isEditingMembers = !isEditingMembers; activeGridMember = null; window.renderScheduleManager(); };
        window.addTeamMember = () => {
            const name = prompt("請輸入新成員名字：");
            if (name && name.trim()) {
                teamMembers.push(name.trim());
                safeSetLocal('work_cache_team_members', teamMembers);
                if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'team_members'), { members: teamMembers });
                window.renderScheduleManager();
            }
        };
        window.removeTeamMember = (idx) => {
            teamMembers.splice(idx, 1);
            safeSetLocal('work_cache_team_members', teamMembers);
            if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'team_members'), { members: teamMembers });
            window.renderScheduleManager();
        };

        window.selectGridMember = (name) => {
            activeGridMember = (activeGridMember === name) ? null : name;
            
            document.querySelectorAll('.member-btn-container').forEach(container => {
                const cName = container.dataset.name;
                const isSelected = cName === activeGridMember;
                const isEraser = cName === 'ERASER';
                const innerDiv = container.querySelector('div');
                if(!innerDiv) return;
                
                if (isEraser) {
                    innerDiv.className = isSelected 
                        ? 'px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-all flex items-center bg-pink-500 text-white border-pink-600 shadow-md scale-105 justify-center' 
                        : 'px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-all flex items-center bg-white text-pink-600 border-pink-200 hover:border-pink-400 hover:text-pink-600 shadow-sm justify-center';
                } else {
                    const color = window.getMemberColorClass(cName);
                    innerDiv.className = isSelected 
                        ? `px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-all ${color.activeBg} text-white border-transparent shadow-md scale-105 justify-center` 
                        : `px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-all ${color.bg} ${color.text} ${color.border} hover:opacity-80 shadow-sm justify-center`;
                }
            });

            const hint = document.getElementById('grid-hint-text');
            if (hint) {
                if (activeGridMember === 'ERASER') {
                    hint.className = 'mt-2.5 text-[10px] text-pink-600 font-bold animate-pulse px-1 block text-center';
                    hint.innerHTML = '👉 橡皮擦模式：點擊或拖曳表格以清除整格內容。';
                } else if (activeGridMember) {
                    hint.className = 'mt-2.5 text-[10px] text-blue-600 font-bold animate-pulse px-1 block text-center';
                    hint.innerHTML = `👉 已選取「${activeGridMember}」，請點擊或拖曳下方表格填入。`;
                } else {
                    hint.className = 'hidden';
                    hint.innerHTML = '';
                }
            }
            
            document.querySelectorAll('.grid-input').forEach(ta => {
                ta.classList.toggle('cursor-pointer', !!activeGridMember);
                ta.classList.toggle('select-none', !!activeGridMember);
            });
        };

        window.startGridDrag = (el) => {
            if (!activeGridMember) return;
            el.blur(); 
            isGridDragging = true;
            
            if (activeGridMember === 'ERASER') {
                gridDragAction = 'erase';
                el.value = '';
            } else {
                let names = (el.value || '').split(/[\n\s]+/).filter(n => n);
                if (names.includes(activeGridMember)) {
                    gridDragAction = 'remove';
                    names = names.filter(n => n !== activeGridMember);
                } else {
                    gridDragAction = 'add';
                    names.push(activeGridMember);
                }
                el.value = names.join('\n');
            }
        };

        window.onGridDragEnter = (el) => {
            if (!isGridDragging || !activeGridMember) return;
            el.blur();
            if (gridDragAction === 'erase') {
                el.value = '';
            } else {
                let names = (el.value || '').split(/[\n\s]+/).filter(n => n);
                if (gridDragAction === 'add' && !names.includes(activeGridMember)) {
                    names.push(activeGridMember);
                } else if (gridDragAction === 'remove' && names.includes(activeGridMember)) {
                    names = names.filter(n => n !== activeGridMember);
                }
                el.value = names.join('\n');
            }
        };

        window.onGridTouchMove = (event) => {
            if (!isGridDragging || !activeGridMember) return;
            event.preventDefault(); 
            const touch = event.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (el && el.classList.contains('grid-input') && el !== window.lastTouchedEl) {
                window.lastTouchedEl = el;
                window.onGridDragEnter(el);
            }
        };

        window.stopGridDrag = () => {
            isGridDragging = false;
            gridDragAction = null;
            window.lastTouchedEl = null;
        };

        document.addEventListener('mouseup', window.stopGridDrag);
        document.addEventListener('touchend', window.stopGridDrag);

        window.toggleSplitHour = (locId, hourStr) => {
            const [startH] = hourStr.split(':');
            const endH = String(parseInt(startH, 10) + 1).padStart(2, '0');
            const hourEndStr = `${endH}:00`;
            const stateKey = `${locId}_${hourStr}`;
            const willBeSplit = !splitHoursState[stateKey];

            window._tempGridValues = window._tempGridValues || {};
            document.querySelectorAll('.grid-input').forEach(input => {
                const key = `${input.dataset.loc}_${input.dataset.start}_${input.dataset.end}`;
                window._tempGridValues[key] = input.value;
            });

            const fullKey = `${locId}_${hourStr}_${hourEndStr}`;
            const halfKeyA = `${locId}_${startH}:00_${startH}:30`;
            const halfKeyB = `${locId}_${startH}:30_${hourEndStr}`;

            if (willBeSplit) {
                const fullValue = window._tempGridValues[fullKey] || '';
                window._tempGridValues[halfKeyA] = fullValue;
                window._tempGridValues[halfKeyB] = fullValue;
                delete window._tempGridValues[fullKey];
            } else {
                const valA = window._tempGridValues[halfKeyA] || '';
                const valB = window._tempGridValues[halfKeyB] || '';
                const combinedNames = Array.from(new Set([...valA.split(/[\n\s]+/), ...valB.split(/[\n\s]+/)]))
                    .map(n => n.trim())
                    .filter(Boolean);
                window._tempGridValues[fullKey] = combinedNames.join('\n');
                delete window._tempGridValues[halfKeyA];
                delete window._tempGridValues[halfKeyB];
            }

            splitHoursState[stateKey] = willBeSplit;
            safeSetLocal('work_cache_split_hours', splitHoursState);
            window.renderScheduleManager();
        };

        window.saveGridSchedule = () => {
            let newSchedules = [], locKeys = Object.keys(mapData.points);

            document.querySelectorAll('.grid-input').forEach(inputEl => {
                const locId = inputEl.dataset.loc;
                const tStart = inputEl.dataset.start;
                const tEnd = inputEl.dataset.end;
                const text = inputEl.value.trim();

                if (text && tStart && tEnd) {
                    text.split(/[\n\s]+/).forEach(rawName => {
                        let cleanName = rawName.replace(/\(.*?\)/g, '').trim();
                        if (cleanName.includes('休')) return;
                        if (cleanName.includes('頂')) cleanName = cleanName.replace('頂', '').trim();
                        if (cleanName) {
                            newSchedules.push({
                                id: 'sch_grid_' + Date.now() + Math.random().toString(36).substr(2, 5),
                                name: cleanName,
                                locationId: locId,
                                start: tStart,
                                end: tEnd
                            });
                        }
                    });
                }
            });

            let mergedSchedules = [];
            locKeys.forEach(locId => {
                teamMembers.forEach(name => {
                    let userSlots = newSchedules.filter(s => s.locationId === locId && s.name === name);
                    userSlots.sort((a, b) => a.start.localeCompare(b.start));

                    let currentSlot = null;
                    userSlots.forEach(s => {
                        if (!currentSlot) currentSlot = { ...s };
                        else if (currentSlot.end === s.start) currentSlot.end = s.end;
                        else {
                            mergedSchedules.push(currentSlot);
                            currentSlot = { ...s };
                        }
                    });
                    if (currentSlot) mergedSchedules.push(currentSlot);
                });
            });

            memberSchedules = memberSchedules.filter(s => !s.id.startsWith('sch_grid_'));
            memberSchedules = [...memberSchedules, ...mergedSchedules];
            
            if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'member_schedules'), { schedules: memberSchedules });
            window._tempGridValues = null; 
            window.renderScheduleManager();
            window.showToast(`成功儲存表格排班！共生效 ${mergedSchedules.length} 筆時段。`);
        };

        window.clearAllSchedules = () => {
            window.showConfirm('清空排班', '確定要清空當前所有的排班資料嗎？', () => {
                memberSchedules = [];
                if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'member_schedules'), { schedules: memberSchedules });
                window.renderScheduleManager();
                window.showToast('已清空所有排班');
            });
        };

        const getLocColorClass = (locId) => {
            switch(locId) {
                case 'pt_1': return 'bg-blue-50 text-blue-700 border-r border-blue-200';
                case 'pt_3': return 'bg-emerald-50 text-emerald-700 border-r border-emerald-200';
                case 'pt_4': return 'bg-cyan-50 text-cyan-700 border-r border-cyan-200';
                case 'pt_5': return 'bg-purple-50 text-purple-700 border-r border-purple-200';
                case 'pt_2': return 'bg-amber-50 text-amber-800 border-r border-amber-200';
                case 'pt_6': return 'bg-amber-100 text-amber-900 border-r border-amber-300';
                case 'pt_7': return 'bg-slate-100 text-slate-700 border-r border-slate-200';
                default: return 'bg-white text-slate-700';
            }
        };

        window.renderScheduleManager = () => {
            const list = document.getElementById('scheduleManageList');
            let currentDOMGridValues = window._tempGridValues || {};
            if (!window._tempGridValues) {
                document.querySelectorAll('.grid-input').forEach(input => {
                    currentDOMGridValues[`${input.dataset.loc}_${input.dataset.start}_${input.dataset.end}`] = input.value;
                });
            }

            const timeSlots = ['07:00-08:00', '08:00-09:00', '09:00-10:00', '10:00-11:00', '11:00-12:00', '12:00-13:00', '13:00-14:00', '14:00-15:00', '15:00-16:00', '16:00-17:00', '17:00-18:00', '18:00-19:00', '19:00-20:00', '20:00-21:00', '21:00-22:00'];
            const validCountingSlots = ['13:00-14:00', '14:00-15:00', '19:00-20:00', '20:00-21:00', '21:00-22:00'];
            
            let tableHeader = `<th class="sticky left-0 bg-slate-100 p-1 z-10 w-[52px] min-w-[52px] max-w-[52px] border border-slate-200 text-slate-600 font-black text-[9px] text-center align-middle">崗位 \\ 時間</th>`;
            timeSlots.forEach(ts => { tableHeader += `<th class="p-0.5 border border-slate-200 w-[50px] min-w-[50px] text-[8px] font-bold text-slate-500 whitespace-nowrap bg-slate-50 text-center align-middle">${ts}</th>`; });

            const customOrder = ['pt_3', 'pt_4', 'pt_5', 'pt_1', 'pt_2', 'pt_6', 'pt_7'];
            let sortedLocs = Object.entries(mapData.points).sort(([idA], [idB]) => {
                let idxA = customOrder.indexOf(idA), idxB = customOrder.indexOf(idB);
                return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
            });

            let tableRows = '';
            sortedLocs.forEach(([locId, pt]) => {
                let displayName = pt.name.replace(/\s*大清點/, '<br>大清點');
                const locColorClass = getLocColorClass(locId);
                const isRestRow = locId === 'pt_7'; 
                let minHeightClass = (locId === 'pt_1') ? "min-h-[65px]" : "min-h-[30px]";
                
                tableRows += `<tr><td class="sticky left-0 ${locColorClass} font-black text-[9.5px] p-0.5 z-10 border border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] text-center align-middle break-words leading-tight w-[52px] min-w-[52px] max-w-[52px]">${displayName}</td>`;
                
                timeSlots.forEach(ts => {
                    const [tStart, tEnd] = ts.split('-');
                    let isDisabled = (locId === 'pt_2' || locId === 'pt_6') && !validCountingSlots.includes(ts);
                    
                    if (isDisabled) {
                        tableRows += `<td class="p-0 border border-slate-200 bg-slate-200/60 pointer-events-none align-middle"><div class="w-full h-full ${minHeightClass}"></div></td>`;
                    } else {
                        const [startH] = tStart.split(':'), [endH] = tEnd.split(':');

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; 
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }

                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.onerror = () => reject(new Error("圖片解析失敗"));
                };
                reader.onerror = () => reject(new Error("檔案讀取失敗"));
            });
        }

            const tenant = document.getElementById('crInputTenant').value.trim();
            const qty = parseInt(document.getElementById('crInputQuantity').value, 10);
            const staff = document.getElementById('crInputStaff')?.value || '';
            const dateStr = document.getElementById('crInputDate').value;
            const timeStr = document.getElementById('crInputTime').value;

            if (!tenant) return window.showToast('請輸入檔主編號', true);
            if (!qty || qty <= 0) return window.showToast('請輸入有效的數量', true);

            const depositTimestamp = (dateStr && timeStr) ? new Date(`${dateStr}T${timeStr}`).getTime() : window.getNow().getTime();

            crRecords.unshift({
                id: 'cr_' + window.getNow().getTime(),
                tenant: tenant,
                type: crCurrentSelectedType || '未指定',
                staff: staff || '未指定',
                depositQuantity: qty,
                remainingQuantity: qty,
                depositTime: depositTimestamp,
                withdrawHistory: [], 
                status: 'active'
            }); 
            window.crSaveData();
            window.crCloseAddModal();
            window.crRenderList();
            window.showToast('已成功新增存放紀錄');
        };

        window.crOpenWithdrawModal = (id) => {
            const record = crRecords.find(r => r.id === id);
            if (!record) return;

            document.getElementById('crCurrentActionId').value = id;
            document.getElementById('crWithdrawTenantDisplay').textContent = record.tenant;
            document.getElementById('crWithdrawRemainDisplay').textContent = record.remainingQuantity;
            document.getElementById('crInputWithdrawQty').value = record.remainingQuantity; 

            const now = window.getNow();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');

            const dateInput = document.getElementById('crInputWithdrawDate');
            const timeInput = document.getElementById('crInputWithdrawTime');
            if (dateInput) dateInput.value = `${year}-${month}-${day}`;
            if (timeInput) timeInput.value = `${hours}:${mins}`;

            const modal = document.getElementById('crWithdrawModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        };

        window.crCloseWithdrawModal = () => {
            const modal = document.getElementById('crWithdrawModal');
            modal.classList.add('hidden'); modal.classList.remove('flex');

        window.crSubmitWithdraw = () => {
            const id = document.getElementById('crCurrentActionId').value;
            const withdrawQty = parseInt(document.getElementById('crInputWithdrawQty').value, 10);
            const dateStr = document.getElementById('crInputWithdrawDate')?.value;
            const timeStr = document.getElementById('crInputWithdrawTime')?.value;

            const record = crRecords.find(r => r.id === id);
            if (!record) return;

            if (!withdrawQty || withdrawQty <= 0) return window.showToast('請輸入有效的取出數量', true);
            if (withdrawQty > record.remainingQuantity) return window.showToast(`數量錯誤！目前僅剩 ${record.remainingQuantity} 件`, true);

            const withdrawTimestamp = (dateStr && timeStr) ? new Date(`${dateStr}T${timeStr}`).getTime() : window.getNow().getTime();

            record.remainingQuantity -= withdrawQty;
            record.withdrawHistory.push({ time: withdrawTimestamp, qty: withdrawQty });

            if (record.remainingQuantity === 0) record.status = 'history';
            window.crSaveData();
            window.crCloseWithdrawModal();
            window.crRenderList();

                container.insertAdjacentHTML('beforeend', `
                    <div onclick="window.crOpenEditModal('${record.id}')" title="點擊可修改內容" class="daily-task-card ${bgColor} rounded-xl p-2.5 sm:p-3 border ${borderColor} relative shadow-sm transition-all flex flex-col group cursor-pointer hover:border-blue-300">

        window.exportData = async () => {
            window.showToast("準備導出資料...");

                const blob = new Blob([JSON.stringify({
                    version: "5.0", exportDate: new Date().toISOString(),
                    dailyScheduleData, taskCompletionState, taskExtrasState, subTaskCompletionState,

                try {
                    window.showToast("正在讀取並導入資料...");
                    const imported = JSON.parse(e.target.result);
                    dailyScheduleData = imported.dailyScheduleData || dailyScheduleData;
                    taskCompletionState = imported.taskCompletionState || taskCompletionState;
                    taskExtrasState = imported.taskExtrasState || taskExtrasState;
                    subTaskCompletionState = imported.subTaskCompletionState || subTaskCompletionState;
                    galleryCategories = imported.galleryCategories || galleryCategories;
                    galleryItems = imported.galleryItems || galleryItems;
                    crRecords = imported.crRecords || crRecords;
                    crItemTypes = imported.crItemTypes || crItemTypes;
                    if(!galleryCategories.includes('任務附件')) galleryCategories.push('任務附件');

                    safeSetLocal('work_cache_schedule', dailyScheduleData);
                    safeSetLocal('work_cache_task_states', taskCompletionState);
                    safeSetLocal('work_cache_daily_extras', taskExtrasState);
                    safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
                    safeSetLocal('work_cache_gallery_categories', galleryCategories);
                    safeSetLocal('work_cache_gallery_items', galleryItems);
                    safeSetLocal('coldRoomRecords', crRecords);
                    safeSetLocal('coldRoomTypes', crItemTypes);

                    if (currentUser) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), { tasks: dailyScheduleData });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), { states: taskCompletionState });
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), { states: subTaskCompletionState });

                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'coldRoom'), { records: crRecords, types: crItemTypes });

                    window.showToast("導入全部成功！");

        window.completeTimelineTask = (taskId, event) => {
            if (event) {
                event.stopPropagation();
                const cardEl = event.currentTarget.closest('.timeline-card');
                if (cardEl) {
                    cardEl.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease';
                    cardEl.style.transform = 'translateY(-20px) scale(0.95)';
                    cardEl.style.opacity = '0';

            }
            setTimeout(() => {
                window.toggleTask(taskId); 
                if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false); 
            }, 300);
        };

        window.addTimelineTask = () => {
            const now = window.getNow();
            const startH = String(now.getHours()).padStart(2, '0');
            const startM = String(now.getMinutes()).padStart(2, '0');
            const startStr = `${startH}:${startM}`;
            
            const later = new Date(now.getTime() + 30 * 60000);
            const endH = String(later.getHours()).padStart(2, '0');
            const endM = String(later.getMinutes()).padStart(2, '0');
            const endStr = `${endH}:${endM}`;

            const newId = 't_' + Date.now();
            dailyScheduleData.push({ id: newId, start: startStr, end: endStr, title: '新動態任務', content: '點擊編輯內容...', note: '', group: '', subSteps: [] });
            
            safeSetLocal('work_cache_schedule', dailyScheduleData);
            if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), { tasks: dailyScheduleData }, { merge: true });
            
            if(!document.getElementById('dailySchedulePage').classList.contains('hidden')) window.renderDailySchedule();
            if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
            window.editTimelineTask(newId, true); 
        };

        window.updateConveyorBelt = () => {
            if(document.getElementById('timelinePage').classList.contains('hidden')) return;
            const now = window.getNow();
            let previousTime = now;
            
            document.querySelectorAll('.active-task').forEach(wrapper => {
                 const status = calculateTaskStatus(wrapper.dataset.start, wrapper.dataset.end);
                 if (status.state !== 'active') { window.renderTimeline(false); return; }
                 
                 const startTime = parseTime(wrapper.dataset.start), endTime = parseTime(wrapper.dataset.end);
                 const progress = Math.min(1, Math.max(0, (now - startTime) / (endTime - startTime)));

            let timelineTasks = [...dailyScheduleData].sort((a, b) => parseTime(a.start) - parseTime(b.start));

            const topY = firstWrapper.offsetTop + (firstWrapper.offsetHeight / 2);
            const bottomY = lastWrapper.offsetTop + (lastWrapper.offsetHeight / 2);

            let currentY = topY;
            if (lastEnd > firstStart) {
