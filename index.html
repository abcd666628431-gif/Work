                            <div class="space-x-2 flex">
                                <button onclick="${cancelAction}" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-bold transition-colors active:scale-95">取消</button>
                                <button onclick="window.saveTimelineTask('${taskId}')" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-bold shadow-sm transition-colors active:scale-95">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();

            if (isNew) {
                const titleInput = document.getElementById('dyEditTitle');
                if (titleInput) { titleInput.focus(); titleInput.select(); }
            }
        };

        window.cancelNewTimelineTask = (taskId) => {
            document.getElementById('dynamicEditModal')?.remove();
            dailyScheduleData = dailyScheduleData.filter(t => t.id !== taskId);
            if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), { tasks: dailyScheduleData });
            window.renderDailySchedule();
            if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
        };

        window.saveTimelineTask = (taskId) => {
            const title = document.getElementById('dyEditTitle').value.trim();
            const start = document.getElementById('dyEditStart').value;
            const end = document.getElementById('dyEditEnd').value;
            const groupEl = document.querySelector('input[name="dyEditGroup"]:checked');
            const group = groupEl ? groupEl.value : '';
            
            const task = dailyScheduleData.find(t => t.id === taskId);
            if (task && title) {
                task.title = title; task.start = start; task.end = end; task.group = group;
                if (currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'schedule'), { tasks: dailyScheduleData }, { merge: true });
                document.getElementById('dynamicEditModal').remove();
                window.showToast("卡片資料已儲存");
                window.renderDailySchedule(); 
                if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
            }
        };

        window.deleteTimelineTask = (taskId) => {
            window.showConfirm('刪除確認', '確定要永久刪除這張任務卡片嗎？', () => {
                document.getElementById('dynamicEditModal').remove();
                window.deleteTaskCard(taskId); 
            });
        };

        window.toggleSimulation = () => {
            isFastForwarding = !isFastForwarding;
            document.querySelectorAll('.sim-toggle-btn').forEach(btn => {
                btn.classList.toggle('bg-white', !isFastForwarding); btn.classList.toggle('text-slate-600', !isFastForwarding);
                btn.classList.toggle('bg-amber-500', isFastForwarding); btn.classList.toggle('text-white', isFastForwarding);
                btn.classList.toggle('animate-pulse', isFastForwarding);
            });

            if (isFastForwarding) {
                window.showToast("🚀 模擬模式：時間推進中");
                document.querySelectorAll('.sim-restore-btn').forEach(btn => btn.classList.remove('hidden'));
                simInterval = setInterval(() => {
                    timeOffset += 60000; 
                    window.updateClockUI(); 
                    if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false); 
                    if(!document.getElementById('mapPage').classList.contains('hidden')) window.updateMapSimulation();
                    if(!document.getElementById('coldRoomPage').classList.contains('hidden')) window.crRenderList();
                }, 200); 
            } else {
                clearInterval(simInterval);
                window.showToast("⏸️ 暫停加速，時間恢復平穩流逝");
            }
            if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
        };

        window.restoreRealTime = () => {
            isFastForwarding = false;
            clearInterval(simInterval);
            timeOffset = 0; 
            document.querySelectorAll('.sim-toggle-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-white', 'border-transparent', 'animate-pulse');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            });
            document.querySelectorAll('.sim-restore-btn').forEach(btn => btn.classList.add('hidden')); 
            window.showToast("🌍 已回到現實時間");
            window.updateClockUI();
            if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(true);
            if(!document.getElementById('mapPage').classList.contains('hidden')) window.updateMapSimulation();
            if(!document.getElementById('coldRoomPage').classList.contains('hidden')) window.crRenderList();
        };

        window.promptResetOptions = () => {
            const modalHtml = `
                <div id="resetOptionsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-4" onmousedown="if(event.target === this) this.isBg = true;" onmouseup="if(event.target === this && this.isBg) { this.remove(); this.isBg = false; }">
                    <div class="bg-white rounded-2xl p-5 w-full max-w-[280px] shadow-2xl relative" onmousedown="event.stopPropagation()">
                        <h3 class="font-bold text-lg mb-2 text-slate-800 flex items-center"><i data-lucide="list-restart" class="w-5 h-5 mr-2 text-red-500"></i>狀態還原</h3>
                        <p class="text-[11px] text-slate-500 mb-4 leading-relaxed tracking-wide text-center">選擇您要執行的還原動作，系統已啟動時光機備份。</p>
                        <div class="space-y-3">
                            <button onclick="window.undoLastAction()" class="w-full flex items-center justify-center p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold active:scale-95 transition-all shadow-sm">
                                <i data-lucide="undo-2" class="w-4 h-4 mr-2 text-slate-500"></i>還原上一步 (Undo)
                            </button>
                            <button onclick="window.resetToNewDay()" class="w-full flex items-center justify-center p-3 rounded-xl border-2 border-red-100 bg-red-50 hover:bg-red-100 text-red-600 font-bold active:scale-95 transition-all shadow-sm">
                                <i data-lucide="sun" class="w-4 h-4 mr-2 text-red-500"></i>清除狀態 (新的一天)
                            </button>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100">
                            <button onclick="document.getElementById('resetOptionsModal').remove()" class="w-full p-2.5 bg-white border border-slate-200 text-slate-500 hover:text-slate-800 rounded-xl text-sm font-bold transition-colors active:scale-95">取消</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        };

        window.undoLastAction = () => {
            if (actionHistory.length > 0) {
                const prevState = actionHistory.pop();
                taskCompletionState = prevState.tasks || {};
                subTaskCompletionState = prevState.subtasks || {};
                if (currentUser) {
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), { states: taskCompletionState });
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), { states: subTaskCompletionState });
                }
                safeSetLocal('work_cache_task_states', taskCompletionState);
                safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
                document.getElementById('resetOptionsModal')?.remove();
                window.showToast("↩️ 已還原至上一個狀態");
                window.renderDailySchedule();
                if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(false);
            } else {
                window.showToast("已經是最初狀態，無法再還原", true);
            }
        };

        window.resetToNewDay = () => {
            window.saveStateSnapshot();
            taskCompletionState = {};
            subTaskCompletionState = {};
            safeSetLocal('work_cache_task_states', taskCompletionState);
            safeSetLocal('work_cache_subtask_states', subTaskCompletionState);
            
            if (currentUser) {
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'task_states'), { states: {} });
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'subtask_states'), { states: {} });
            }
            document.getElementById('resetOptionsModal')?.remove();
            window.showToast("🌅 已清空任務狀態，新的一天開始！");
            window.renderDailySchedule();
            if(!document.getElementById('timelinePage').classList.contains('hidden')) window.renderTimeline(true);
        };

        setInterval(() => { if(!isFastForwarding) window.updateClockUI(); }, 1000);
        setInterval(() => {
            if(!document.getElementById('mapPage')?.classList.contains('hidden')) window.updateMapSimulation();
            if(!document.getElementById('memoPage')?.classList.contains('hidden')) window.updateMemoCountdowns();
            if(!document.getElementById('coldRoomPage')?.classList.contains('hidden')) window.crRenderList();
        }, 60000);

        function parseTime(timeStr) { const [h, m] = timeStr.split(':').map(Number); const d = window.getNow(); d.setHours(h, m, 0, 0); return d; }
        function calculateTaskStatus(startStr, endStr) {
            const now = window.getNow(), start = parseTime(startStr), end = parseTime(endStr);
            if (now < start) {
                const diffMins = Math.floor((start - now) / 60000);
                return { state: 'waiting', text: `未開始 (約 ${Math.floor(diffMins/60)>0?Math.floor(diffMins/60)+'小時':''}${diffMins%60}分後)` };
            } else if (now >= start && now <= end) {
                const diffMins = Math.floor((end - now) / 60000);
                return { state: 'active', text: `進行中 (剩餘 ${Math.floor(diffMins/60)>0?Math.floor(diffMins/60)+'小時':''}${diffMins%60}分)` };
            } else {
                const diffMins = Math.floor((now - end) / 60000);
                return { state: 'overdue', text: `已結束 (超時 ${Math.floor(diffMins/60)>0?Math.floor(diffMins/60)+'小時':''}${diffMins%60}分)` };
            }
        }

        window.closeArchive = () => {
            const modal = document.getElementById('archiveModal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
        };
        
        window.openFullscreenImg = (src) => {
            const viewer = document.getElementById('imageViewer');
            document.getElementById('imageViewerImg').src = src;
            viewer.classList.remove('hidden'); viewer.classList.add('flex');
        };

        window.switchTab = (tab) => {
            const pages = {
                'daily': document.getElementById('dailySchedulePage'),
                'gallery': document.getElementById('galleryPage'),
                'timeline': document.getElementById('timelinePage'),
                'memo': document.getElementById('memoPage'),
                'map': document.getElementById('mapPage'),
                'coldRoom': document.getElementById('coldRoomPage')
            };
            const btns = {
                'daily': document.getElementById('tabDaily'),
                'timeline': document.getElementById('tabTimeline'),
                'memo': document.getElementById('tabMemo'),
                'map': document.getElementById('tabMap'),
                'gallery': document.getElementById('tabGallery'),
                'coldRoom': document.getElementById('tabColdRoom')
            };
            
            const activeClass = "flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all uppercase tracking-widest text-center whitespace-nowrap";
            const inactiveClass = "flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap";

            Object.values(pages).forEach(p => { if (p) { p.classList.add('hidden'); p.classList.remove('flex', 'block'); } });
            Object.entries(btns).forEach(([k, b]) => { if(b) b.className = inactiveClass; });

            if(pages[tab]) { 
                pages[tab].classList.remove('hidden'); 
                pages[tab].classList.add(tab === 'map' || tab === 'gallery' || tab === 'coldRoom' ? 'flex' : 'block');
            }
            if(btns[tab]) btns[tab].className = activeClass;

            if (tab === 'daily') window.renderDailySchedule(); 
            else if (tab === 'gallery') window.renderGallery();
            else if (tab === 'timeline') window.renderTimeline(true);
            else if (tab === 'memo') window.renderMemos();
            else if (tab === 'map') window.renderMap();
            else if (tab === 'coldRoom') window.crRenderList();
            
            localStorage.setItem('activeTab', tab);
        };

        window.renderMemos = () => {
            const container = document.getElementById('memoContainer');
            if(!container) return;
            
            let sortedMemos = [...futureMemos].sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`) - new Date(`${b.date}T${b.time || '00:00'}`));

            if(sortedMemos.length === 0) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-slate-400"><i data-lucide="inbox" class="w-12 h-12 mb-3 opacity-30"></i><span class="text-xs font-bold tracking-widest text-center">目前沒有未來的備忘任務</span></div>';
                lucide.createIcons();
                return;
            }

            container.innerHTML = sortedMemos.map(memo => `
                <div onclick="window.openMemoEditorForEdit('${memo.id}')" title="點擊可修改備忘" class="memo-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative overflow-hidden cursor-pointer hover:border-blue-300 transition-colors" data-datetime="${memo.date}T${memo.time || '00:00'}">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-400 opacity-80"></div>
                    <div class="flex justify-between items-start pl-2">
                        <div class="flex-1">
                            <h3 class="text-sm font-bold text-slate-800 mb-1">${memo.title}</h3>
                            <p class="text-xs text-slate-600 leading-relaxed mb-3 break-words whitespace-pre-wrap">${memo.content || ''}</p>
                            <div class="inline-flex items-center bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-[10px] font-bold border border-indigo-100">
                                <i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${memo.date} ${memo.time || ''}
                            </div>
                        </div>
                        <div class="flex flex-col items-end shrink-0 ml-3">
                            <button onclick="window.deleteMemo('${memo.id}'); event.stopPropagation();" class="text-slate-400 hover:text-red-500 p-1.5 rounded active:scale-95 transition-all bg-slate-50 hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            <div class="memo-countdown text-[11px] font-bold text-amber-600 mt-3 text-right whitespace-nowrap">計算中...</div>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
            window.updateMemoCountdowns();
        };

        window.updateMemoCountdowns = () => {
            const now = window.getNow();
            document.querySelectorAll('.memo-card').forEach(card => {
                const diffMs = new Date(card.dataset.datetime) - now;
                const cdEl = card.querySelector('.memo-countdown');
                if(!cdEl) return;

                if (diffMs <= 0) {
                    cdEl.textContent = '已過期 / 進行中';
                    cdEl.className = 'memo-countdown text-[11px] font-bold text-red-500 mt-3 text-right animate-pulse whitespace-nowrap';
                } else {
                    const days = Math.floor(diffMs / 86400000), hours = Math.floor((diffMs % 86400000) / 3600000), mins = Math.floor((diffMs % 3600000) / 60000);
                    cdEl.textContent = `⏳ ${days>0 ? days+'天 ' : ''}${hours}小時 ${mins}分`;
                }
            });
        };

        window.openMemoEditor = () => {
            const now = window.getNow();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');

            const modalHtml = `
                <div id="memoEditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-4">
                    <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative">
                        <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center"><i data-lucide="calendar-plus" class="w-5 h-5 mr-2 text-blue-500"></i>新增備忘錄</h3>
                        <div class="space-y-3">
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">任務標題</label><input type="text" id="memoTitle" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">詳細內容 (選填)</label><textarea id="memoContent" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none h-20 resize-none"></textarea></div>
                            <div class="flex gap-2">
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">日期</label><input type="date" id="memoDate" value="${year}-${month}-${day}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="memoTime" value="${hours}:${mins}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-4">
                            <button onclick="document.getElementById('memoEditModal').remove()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold active:scale-95 transition-colors">取消</button>
                            <button onclick="window.saveMemo()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-colors">儲存</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        };

        window.openMemoEditorForEdit = (id) => {
            const memo = futureMemos.find(m => m.id === id);
            if (!memo) return;

            const modalHtml = `
                <div id="memoEditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-4">
                    <div class="bg-white rounded-2xl p-5 w-full max-w-[320px] shadow-2xl relative" onclick="event.stopPropagation()">
                        <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center"><i data-lucide="edit" class="w-5 h-5 mr-2 text-blue-500"></i>修改備忘錄</h3>
                        <div class="space-y-3">
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">任務標題</label><input type="text" id="memoTitle" value="${memo.title}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center font-bold"></div>
                            <div><label class="text-[11px] font-bold text-slate-500 block mb-1">詳細內容 (選填)</label><textarea id="memoContent" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none h-20 resize-none">${memo.content || ''}</textarea></div>
                            <div class="flex gap-2">
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">日期</label><input type="date" id="memoDate" value="${memo.date}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                                <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-1">時間</label><input type="time" id="memoTime" value="${memo.time || '09:00'}" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none text-center"></div>
                            </div>
                        </div>
                        <div class="mt-5 flex justify-between items-center border-t border-slate-100 pt-4">
                            <button onclick="window.deleteMemo('${memo.id}'); document.getElementById('memoEditModal').remove();" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg text-xs font-bold transition-colors">刪除</button>
                            <div class="space-x-2 flex">
                                <button onclick="document.getElementById('memoEditModal').remove()" class="px-3 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">取消</button>
                                <button onclick="window.saveEditMemo('${memo.id}')" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm">儲存</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        };

        window.saveMemo = () => {
            const title = document.getElementById('memoTitle').value.trim();
            const content = document.getElementById('memoContent').value.trim();
            const date = document.getElementById('memoDate').value;
            const time = document.getElementById('memoTime').value;
            if(!title || !date) return window.showToast('請填寫標題與日期', true);

            futureMemos.push({ id: 'm_'+Date.now(), title, content, date, time });
            if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'future_memos'), { memos: futureMemos });
            document.getElementById('memoEditModal').remove();
            window.renderMemos();
            window.showToast('已新增備忘錄');
        };

        window.saveEditMemo = (id) => {
            const memo = futureMemos.find(m => m.id === id);
            if (!memo) return;
            const title = document.getElementById('memoTitle').value.trim();
            const content = document.getElementById('memoContent').value.trim();
            const date = document.getElementById('memoDate').value;
            const time = document.getElementById('memoTime').value;
            if(!title || !date) return window.showToast('請填寫標題與日期', true);

            memo.title = title; memo.content = content; memo.date = date; memo.time = time;
            if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'future_memos'), { memos: futureMemos });
            document.getElementById('memoEditModal').remove();
            window.renderMemos();
            window.showToast('已更新備忘錄');
        };

        window.deleteMemo = (id) => {
            window.showConfirm('刪除備忘', '確定要刪除這筆未來備忘任務嗎？', () => {
                futureMemos = futureMemos.filter(m => m.id !== id);
                if(currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'future_memos'), { memos: futureMemos });
                window.renderMemos();
            });
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch (error) { window.showToast("連線驗證失敗", true); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                connectionDot.classList.replace('bg-red-500', 'bg-green-500');
                connectionStatus.textContent = '系統已連線並同步';
                setupPureRealtimeSync();
            } else {
                connectionDot.classList.replace('bg-green-500', 'bg-red-500');
                connectionStatus.textContent = '連線中或驗證失敗...';
            }
        });

        loadLocalFastCache();
        initAuth();
        window.switchTab(localStorage.getItem('activeTab') || 'daily');

        if (getLocal('work_cache_dark_mode', false)) {
            document.body.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                const icon = document.getElementById('darkModeIcon');
                if (icon) {
                    icon.setAttribute('data-lucide', 'sun');
                    lucide.createIcons();
                }
            });
        }
    </script>
</head>

<body class="sm:px-4 sm:py-8 flex justify-center relative min-h-screen">
    <div class="w-full max-w-[430px] bg-[#fdfbf7] sm:rounded-[2.5rem] sm:shadow-2xl sm:border-[6px] border-[#d6d0c4] overflow-hidden relative min-h-screen sm:min-h-[932px] pb-10 flex flex-col">
        
        <header class="bg-[#fdfbf7]/95 backdrop-blur-md sticky top-0 z-10 border-b border-[#e5dfd3] p-5 pt-8 sm:pt-12 shadow-sm shrink-0">
            <div class="flex items-center justify-between relative">
                <div class="w-1 sm:w-8"></div>
                
                <div class="flex items-center justify-center space-x-2 shrink-0">
                    <h1 class="text-lg sm:text-xl text-slate-800 tracking-widest font-black">工作記錄本</h1>
                    <div class="flex items-center space-x-1.5 bg-white/70 px-2 py-0.5 rounded-full border border-slate-200 shadow-sm">
                        <span id="connectionDot" class="w-2 h-2 rounded-full bg-red-500 transition-colors duration-300 shadow-inner"></span>
                        <span id="connectionStatus" class="text-[9px] font-bold text-slate-500 tracking-wider">連線中...</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                    <button type="button" onclick="window.openAsPopout()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 flex items-center justify-center transition-colors active:scale-95 shadow-sm" title="以獨立視窗開啟">
                        <i data-lucide="external-link" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                    <button type="button" onclick="window.toggleDarkMode()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 flex items-center justify-center transition-colors active:scale-95 shadow-sm" title="切換深色模式">
                        <i id="darkModeIcon" data-lucide="moon" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="window.importData(event)">
                    <button type="button" onclick="document.getElementById('importInput').click()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 flex items-center justify-center transition-colors active:scale-95 shadow-sm" title="導入舊資料 (自動轉檔)">
                        <i data-lucide="upload" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                    <button type="button" onclick="window.exportData()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 flex items-center justify-center transition-colors active:scale-95 shadow-sm" title="導出備份資料">
                        <i data-lucide="download" class="w-4 h-4 pointer-events-none"></i>
                    </button>
                </div>
            </div>

            <div class="mt-4 flex bg-[#f0ebe1] rounded-lg p-1 shadow-inner border border-[#e5dfd3] relative z-20 overflow-x-auto scrollbar-hide">
                <button id="tabDaily" onclick="window.switchTab('daily')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm rounded-md bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all uppercase tracking-widest text-center whitespace-nowrap">排程</button>
                <button id="tabTimeline" onclick="window.switchTab('timeline')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">動態</button>
                <button id="tabMemo" onclick="window.switchTab('memo')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">備忘</button>
                <button id="tabMap" onclick="window.switchTab('map')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">地圖</button>
                <button id="tabGallery" onclick="window.switchTab('gallery')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">圖庫</button>
                <button id="tabColdRoom" onclick="window.switchTab('coldRoom')" class="flex-1 py-1.5 px-2 sm:px-0.5 text-[11px] sm:text-sm text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest text-center whitespace-nowrap">雪房</button>
            </div>
        </header>
        
        <main id="dailySchedulePage" class="p-5 space-y-2 block transition-opacity relative z-10 h-[calc(100vh-140px)] sm:h-[750px] overflow-y-auto scrollbar-hide">
            <div class="flex justify-end mb-2 px-1">
                <label class="flex items-center cursor-pointer space-x-2 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-sm active:scale-95 transition-transform">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest transition-colors duration-300" id="editModeLabel">一般檢視模式</span>
                    <div class="relative flex items-center">
                        <input type="checkbox" id="editModeToggle" class="sr-only" onchange="window.toggleEditMode(this.checked)">
                        <div class="block bg-slate-300 w-9 h-5 rounded-full border border-slate-300 transition-colors duration-300 shadow-inner" id="editToggleBg"></div>
                        <div class="dot absolute left-1 bg-white w-3 h-3 rounded-full transition-transform duration-300 shadow-sm" id="editToggleDot"></div>
                    </div>
                </label>
            </div>

            <div id="hudContainer" class="flex flex-col items-center justify-center mb-6 p-5 bg-white rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                <div class="relative w-32 h-32 mb-2 z-10">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" class="text-slate-100" stroke-width="8"></circle>
                        <circle id="hudProgressRing" cx="50" cy="50" r="40" fill="none" stroke="currentColor" class="text-blue-500 hud-ring drop-shadow-sm" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span id="hudPercentage" class="text-2xl text-slate-800 font-black tracking-wider mt-1">0%</span>
                        <span class="text-[9px] text-slate-500 tracking-widest font-bold mt-0.5">達成率</span>
                    </div>
                </div>
                <div class="text-[11px] text-slate-600 tracking-wide flex items-center justify-center space-x-2 bg-slate-50 px-4 py-1.5 rounded-full border border-slate-200 z-10">
                    <i data-lucide="check-circle" class="w-4 h-4 text-blue-500"></i>
                    <span>已完成任務: <span id="hudTaskCount" class="text-blue-600 font-bold ml-1">0/14</span></span>
                </div>
            </div>

            <div id="scheduleContainer" class="space-y-4 pb-8"></div>
        </main>

        <main id="timelinePage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] overflow-y-auto relative z-10 bg-[#fdfbf7] scrollbar-hide scroll-smooth">
            <div id="timelineStickyHeader" class="sticky top-0 z-50 w-full bg-gradient-to-b from-[#fdfbf7] via-[#fdfbf7]/95 to-transparent pt-3 pb-8 px-4 flex flex-col items-center justify-center pointer-events-none transition-all">
                <div class="flex items-center justify-center gap-2 sm:gap-3 w-full max-w-[500px]">
                    <div class="flex items-center gap-1.5 sm:gap-2 justify-end flex-1">
                        <button type="button" onclick="window.promptResetOptions()" class="bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-full w-8 h-8 sm:w-9 sm:h-9 shadow-sm active:scale-95 transition-all flex items-center justify-center pointer-events-auto shrink-0" title="狀態還原選項">
                            <i data-lucide="list-restart" class="w-4 h-4 pointer-events-none"></i>
                        </button>
                        <button type="button" onclick="window.restoreRealTime()" class="sim-restore-btn hidden bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-full w-8 h-8 sm:w-9 sm:h-9 shadow-sm active:scale-95 transition-all flex items-center justify-center pointer-events-auto shrink-0" title="還原真實時間">
                            <i data-lucide="rotate-ccw" class="w-4 h-4 pointer-events-none"></i>
                        </button>
                        <button type="button" onclick="window.toggleSimulation()" class="sim-toggle-btn bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-full w-8 h-8 sm:w-9 sm:h-9 shadow-sm active:scale-95 transition-all flex items-center justify-center pointer-events-auto shrink-0" title="開啟時間加速模擬">
                            <i data-lucide="fast-forward" class="w-4 h-4 pointer-events-none"></i>
                        </button>
                    </div>

                    <div id="tlBigClock" onclick="window.promptChangeTime()" title="點擊設定指定時間" class="text-center min-w-[140px] cursor-pointer hover:scale-105 font-mono text-2xl sm:text-3xl font-black text-slate-800 tracking-tighter bg-white/90 backdrop-blur-md px-4 sm:px-5 py-1.5 rounded-[1.25rem] border border-slate-200 shadow-sm pointer-events-auto transition-all shrink-0">--:--:--</div>

                    <div class="flex items-center gap-1.5 sm:gap-2 justify-start flex-1">
                        <button type="button" onclick="window.renderTimeline(true)" class="bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-full w-8 h-8 sm:w-9 sm:h-9 shadow-sm active:scale-95 transition-all flex items-center justify-center pointer-events-auto shrink-0" title="對焦當前任務">
                            <i data-lucide="crosshair" class="w-4 h-4 pointer-events-none"></i>
                        </button>
                        <button type="button" onclick="window.addTimelineTask()" class="bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-full w-8 h-8 sm:w-9 sm:h-9 shadow-sm active:scale-95 transition-all flex items-center justify-center pointer-events-auto shrink-0" title="新增動態任務">
                            <i data-lucide="plus" class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none"></i>
                        </button>
                    </div>
                </div>
                <div id="tlBigDate" class="text-[10px] sm:text-[11px] font-bold text-slate-500 mt-2 tracking-widest pointer-events-auto">---</div>
            </div>
            <div id="timelineContainer" class="min-h-full"></div>
        </main>

        <main id="memoPage" class="hidden p-5 space-y-3 h-[calc(100vh-140px)] sm:h-[750px] overflow-y-auto relative z-10 bg-[#fdfbf7] scrollbar-hide">
            <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm sticky top-0 z-20">
                <h2 class="text-sm font-bold text-slate-800 tracking-widest flex items-center"><i data-lucide="calendar-clock" class="w-4 h-4 mr-2 text-blue-500"></i>未來任務備忘 (點擊卡片可修改)</h2>
                <button onclick="window.openMemoEditor()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center active:scale-95"><i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i>新增</button>
            </div>
            <div id="memoContainer" class="space-y-3 pb-10"></div>
        </main>

        <main id="mapPage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] flex-col relative z-10 bg-[#f0ebe1] overflow-hidden">
            <div class="p-2 border-b border-[#e6e2d6] flex justify-between items-center bg-white shrink-0 shadow-sm z-20 relative">
                <div class="w-24"></div>
                <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-10">
                    <div class="sync-clock-display flex items-center justify-center tabular-nums px-3 font-mono text-[13px] sm:text-sm font-black text-slate-800 bg-slate-100 py-1.5 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-200 transition-colors" onclick="window.promptChangeTime()" title="點擊修改時間">--:--:--</div>
                    <button type="button" class="sim-restore-btn hidden bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-md w-7 h-7 shadow-sm active:scale-95 transition-all flex items-center justify-center" onclick="window.restoreRealTime()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                    <button type="button" class="sim-toggle-btn bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-md w-7 h-7 shadow-sm active:scale-95 transition-all flex items-center justify-center" onclick="window.toggleSimulation()"><i data-lucide="fast-forward" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                </div>
                <button onclick="window.openScheduleManager()" class="bg-slate-50 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg flex items-center hover:bg-emerald-50 active:scale-95 text-[11px] font-bold tracking-wide transition-colors shrink-0 shadow-sm z-10">
                    <i data-lucide="users" class="w-3.5 h-3.5 mr-1.5 text-emerald-500"></i> 成員排班
                </button>
            </div>
            
            <div class="flex-1 flex overflow-hidden relative">
                <div class="flex-1 relative overflow-hidden" id="mapScrollContainer">
                    <div id="mapWrapper" class="absolute top-2 left-2 right-2 bottom-auto h-[380px] sm:top-3 sm:left-3 sm:right-3 sm:h-[500px] bg-[#fdfbf7] rounded-xl overflow-hidden shadow-inner border-2 border-slate-300 transition-colors">
                        <div class="absolute top-0 left-0 right-0 h-[25%] bg-blue-50/60 border-b-2 border-slate-300 pointer-events-none transition-colors">
                            <div class="absolute top-2 left-3 text-blue-300/80 font-black text-xl tracking-widest select-none transition-colors">1/F</div>
                        </div>
                        <div class="absolute top-[25%] left-0 right-0 bottom-0 bg-emerald-50/60 border-t-2 border-slate-300 pointer-events-none transition-colors">
                            <div class="absolute top-2 left-3 text-emerald-300/80 font-black text-xl tracking-widest select-none transition-colors">地面層</div>
                        </div>
                        <div class="absolute top-[5%] left-[50%] -translate-x-1/2 w-[35%] h-[15%] bg-blue-100/80 border-2 border-blue-400 rounded-lg flex flex-col justify-end pb-2 items-center shadow-inner pointer-events-none">
                            <div class="text-blue-600 font-bold text-[13px] sm:text-base tracking-wider flex items-center"><i data-lucide="headphones" class="w-4 h-4 mr-1"></i>客服室</div>
                        </div>
                        <div class="absolute top-[45%] left-[10%] w-[35%] h-[20%] bg-green-100/80 border-2 border-green-500 rounded-lg overflow-hidden flex flex-col justify-end pb-2.5 items-center shadow-inner pointer-events-none">
                            <i data-lucide="flower-2" class="w-10 h-10 text-green-500/20 absolute top-2"></i>
                            <div class="text-green-700 font-bold text-[13px] sm:text-base tracking-wider relative z-10 flex items-center"><i data-lucide="leaf" class="w-4 h-4 mr-1"></i>花園仔</div>
                        </div>
                        <div class="absolute top-[45%] right-[10%] w-[35%] h-[20%] bg-cyan-100/80 border-2 border-cyan-500 rounded-lg overflow-hidden flex flex-col justify-end pb-2.5 items-center shadow-inner pointer-events-none">
                            <i data-lucide="fish" class="w-10 h-10 text-cyan-500/20 absolute top-2"></i>
                            <div class="text-cyan-700 font-bold text-[13px] sm:text-base tracking-wider relative z-10 flex items-center"><i data-lucide="droplets" class="w-4 h-4 mr-1"></i>魚檔</div>
                        </div>
                        <div class="absolute top-[75%] left-[50%] -translate-x-1/2 w-[70%] h-[15%] bg-purple-100/80 border-2 border-purple-400 rounded-lg flex flex-col justify-end pb-2 items-center shadow-inner pointer-events-none">
                            <div class="text-purple-600 font-bold text-[13px] sm:text-base tracking-wider flex items-center"><i data-lucide="shield" class="w-4 h-4 mr-1"></i>整體巡邏</div>
                        </div>
                        <div id="mapPointsContainer" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>
                    </div>
                </div>

                <div class="w-24 sm:w-28 shrink-0 border-l border-[#e6e2d6] bg-[#f4f1eb] p-2 flex flex-col space-y-3 overflow-y-auto scrollbar-hide z-10 shadow-inner pt-3">
                    <div class="text-[11px] sm:text-xs font-black tracking-widest text-slate-400 text-center mb-1">外圍站點</div>
                    <div id="station-pt_2" class="relative w-full min-h-[105px] bg-amber-50/80 border-2 border-amber-400/60 rounded-lg p-2 flex flex-col items-center justify-start shadow-sm">
                        <i data-lucide="clipboard-list" class="w-5 h-5 text-amber-500 mb-1"></i>
                        <span class="text-amber-700 font-bold text-[10px] sm:text-[11px] text-center leading-tight tracking-wider">一樓<br>大清點</span>
                        <div class="ext-members-box w-full flex flex-wrap items-center justify-center gap-1.5 -mt-1.5 pt-0"></div>
                    </div>
                    <div id="station-pt_6" class="relative w-full min-h-[105px] bg-amber-50/80 border-2 border-amber-400/60 rounded-lg p-2 flex flex-col items-center justify-start shadow-sm">
                        <i data-lucide="clipboard-list" class="w-5 h-5 text-amber-500 mb-1"></i>
                        <span class="text-amber-700 font-bold text-[10px] sm:text-[11px] text-center leading-tight tracking-wider">地面層<br>大清點</span>
                        <div class="ext-members-box w-full flex flex-wrap items-center justify-center gap-1.5 -mt-1.5 pt-0"></div>
                    </div>
                    <div id="station-pt_7" class="relative w-full min-h-[105px] bg-slate-50/80 border-2 border-slate-300 rounded-lg p-2 flex flex-col items-center justify-start shadow-sm">
                        <i data-lucide="coffee" class="w-5 h-5 text-slate-400 mb-1"></i>
                        <span class="text-slate-600 font-bold text-[10px] sm:text-[11px] text-center leading-tight tracking-wider">人員<br>休息中</span>
                        <div class="ext-members-box w-full flex flex-wrap items-center justify-center gap-1.5 -mt-1.5 pt-0"></div>
                    </div>
                </div>
            </div>
        </main>

        <main id="galleryPage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] flex-col relative z-10 bg-[#fdfbf7]">
            <div class="p-3 border-b border-[#e6e2d6] flex space-x-2 bg-white shrink-0 shadow-sm z-20 relative">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="gallerySearchInput" placeholder="搜尋圖片標題或日期..." oninput="window.renderGallery()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-2 text-xs text-slate-700 placeholder-slate-400 focus:border-blue-400 focus:bg-white focus:outline-none tracking-wide text-center">
                </div>
                <label class="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-2 rounded-lg flex items-center justify-center cursor-pointer active:bg-blue-100 text-[11px] font-bold tracking-wide transition-colors shadow-sm">
                    <i data-lucide="upload" class="w-4 h-4 mr-1"></i> 上傳
                    <input type="file" accept="image/*" multiple class="hidden" onchange="window.handleGalleryUpload(this)">
                </label>
            </div>
            <div class="flex flex-1 overflow-hidden relative z-10">
                <div class="w-[75px] shrink-0 border-r border-[#e6e2d6] bg-[#f4f1eb] overflow-y-auto flex flex-col items-center space-y-2 scrollbar-hide" id="gallerySidebar"></div>
                <div class="flex-1 p-3 overflow-y-auto bg-[#fdfbf7] relative scrollbar-hide" id="galleryGrid"></div>
            </div>
        </main>

        <main id="coldRoomPage" class="hidden h-[calc(100vh-140px)] sm:h-[750px] flex-col relative z-10 bg-[#fdfbf7] overflow-hidden">
            <div class="p-2 sm:p-2.5 border-b border-[#e6e2d6] bg-white shrink-0 shadow-sm z-20 relative flex flex-col space-y-1.5">
                <div class="flex justify-between items-center relative">
                    <h2 class="text-sm font-bold text-slate-800 tracking-widest flex items-center z-10"><i data-lucide="snowflake" class="w-4 h-4 mr-1.5 text-blue-500"></i>雪房存貨</h2>
                    <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1 z-10">
                        <div class="sync-clock-display flex items-center justify-center tabular-nums px-2.5 font-mono text-xs sm:text-sm font-black text-slate-800 bg-slate-100 py-1 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-200 transition-colors" onclick="window.promptChangeTime()" title="點擊修改時間">--:--:--</div>
                        <button type="button" class="sim-restore-btn hidden bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-md w-6 h-6 shadow-sm active:scale-95 transition-all flex items-center justify-center" onclick="window.restoreRealTime()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                        <button type="button" class="sim-toggle-btn bg-white border border-slate-200 text-slate-600 hover:text-blue-600 rounded-md w-6 h-6 shadow-sm active:scale-95 transition-all flex items-center justify-center" onclick="window.toggleSimulation()"><i data-lucide="fast-forward" class="w-3.5 h-3.5 pointer-events-none"></i></button>
                    </div>
                    <button onclick="window.crExportToCSV()" class="text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 p-1.5 rounded-full active:scale-95 transition-all shadow-sm border border-transparent hover:border-emerald-200 z-10"><i data-lucide="file-spreadsheet" class="w-4 h-4 pointer-events-none"></i></button>
                </div>
                <div class="flex bg-[#f0ebe1] rounded-lg p-0.5 shadow-inner border border-[#e5dfd3]">
                    <button id="crTabActive" onclick="window.crSwitchTab('active')" class="flex-1 py-1 px-0.5 text-[11px] sm:text-xs rounded bg-white text-blue-600 shadow-sm border border-[#d6d0c4] font-semibold transition-all tracking-widest text-center">存放中</button>
                    <button id="crTabHistory" onclick="window.crSwitchTab('history')" class="flex-1 py-1 px-0.5 text-[11px] sm:text-xs text-slate-500 hover:text-slate-700 transition-all tracking-widest text-center">已清空/歷史</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2.5 scrollbar-hide relative" id="crMainContent">
                <div id="crActiveControls" class="mb-2 flex justify-between items-center px-0.5">
                    <div class="text-[11px] text-slate-500 font-bold tracking-widest">目前存放: <span id="crActiveCount" class="text-blue-600 text-sm">0</span> 筆</div>
                    <button onclick="window.crOpenAddModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded-md text-[11px] font-bold transition-colors shadow-sm flex items-center active:scale-95">
                        <i data-lucide="plus" class="w-3 h-3 mr-1"></i> 新增存放
                    </button>
                </div>
                <div id="crRecordsContainer" class="space-y-2 pb-16"></div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="archiveModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[400px] max-h-[80vh] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-base flex items-center"><i data-lucide="images" class="w-5 h-5 mr-2 text-blue-500"></i> 歷史圖庫</h2>
                <button onclick="window.closeArchive()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-6 h-6"></i></button>
            </header>
            <div id="archiveContent" class="flex-1 overflow-y-auto p-4 pb-6 scrollbar-hide bg-[#fdfbf7]"></div>
        </div>
    </div>

    <div id="imageViewer" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col items-center justify-center p-4">
        <button onclick="document.getElementById('imageViewer').classList.add('hidden'); document.getElementById('imageViewer').classList.remove('flex');" class="absolute top-6 right-6 text-white bg-slate-800/80 p-2 rounded-full active:scale-95 shadow-lg border border-slate-600">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="imageViewerImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-slate-700" />
    </div>

    <div id="categoryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[320px] flex flex-col overflow-hidden relative">
            <header class="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="settings-2" class="w-4 h-4 mr-2 text-blue-500"></i> 管理圖庫分類</h2>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="categoryManageList" class="p-3 overflow-y-auto max-h-[55vh] bg-[#fdfbf7] space-y-2 scrollbar-hide"></div>
        </div>
    </div>

    <div id="customConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[10000] hidden flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[300px] flex flex-col overflow-hidden relative">
            <header class="p-4 border-b border-slate-100 flex items-center bg-slate-50">
                <h2 id="confirmModalTitle" class="text-slate-800 font-bold tracking-widest text-base flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2 text-amber-500"></i> 確認</h2>
            </header>
            <div class="p-5 text-sm text-slate-600 tracking-wide leading-relaxed text-center" id="confirmModalMessage"></div>
            <div class="p-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/50">
                <button id="confirmBtnCancel" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-bold transition-colors active:scale-95 shadow-sm">取消</button>
                <button id="confirmBtnOk" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-bold transition-colors active:scale-95 shadow-sm">確定</button>
            </div>
        </div>
    </div>

    <div id="scheduleManageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-1 sm:p-2">
        <div class="bg-white border border-slate-200 shadow-2xl rounded-2xl w-full max-w-[99vw] sm:max-w-[1400px] flex flex-col overflow-hidden relative">
            <header class="p-2.5 sm:p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-slate-800 font-bold tracking-widest text-sm flex items-center"><i data-lucide="users-round" class="w-4 h-4 mr-2 text-blue-500"></i> 成員排班表 (點擊儲存格輸入)</h2>
                <button onclick="window.closeScheduleManager()" class="text-slate-400 p-1.5 rounded-full hover:bg-slate-200 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </header>
            <div id="scheduleManageList" class="p-1 sm:p-2 overflow-y-auto max-h-[90vh] bg-[#fdfbf7] scrollbar-hide"></div>
        </div>
    </div>

    <div id="crAddModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[300px] shadow-2xl relative max-h-[85vh] overflow-y-auto scrollbar-hide">
            <h3 class="font-bold text-base mb-3 text-slate-800 flex items-center border-b pb-2">
                <i data-lucide="package-plus" class="w-4 h-4 mr-2 text-blue-500"></i> 新增存放
            </h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">檔主編號 / 名稱</label>
                    <input type="text" id="crInputTenant" placeholder="例如: R-099" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">存入日期</label>
                        <input type="date" id="crInputDate" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-blue-500 focus:outline-none text-center">
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label>
                        <input type="time" id="crInputTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-blue-500 focus:outline-none text-center">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">經手客服人員</label>
                    <select id="crInputStaff" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center">
                        <option value="">請選擇經手客服人員...</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">貨物類型</label>
                    <div id="crTypeContainer" class="flex flex-wrap gap-1 mb-1.5 justify-center"></div>
                    <div class="flex items-center mt-1 max-w-[160px] mx-auto">
                        <input type="text" id="crInputNewType" placeholder="新類型..." class="w-20 border border-slate-300 rounded-l-lg px-2 py-1 text-[10px] focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center">
                        <button onclick="window.crAddNewType()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded-r-lg border-y border-r border-slate-300 transition-colors shadow-sm text-[10px] font-bold shrink-0">新增</button>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">存放數量 (件/箱)</label>
                    <input type="number" id="crInputQuantity" placeholder="請輸入數量" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-500 focus:outline-none font-bold text-slate-700 bg-slate-50 shadow-inner text-center">
                </div>
            </div>
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseAddModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitAddRecord()" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm active:scale-95 transition-colors">確認存入</button>
            </div>
        </div>
    </div>

    <div id="crWithdrawModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-[300px] shadow-2xl relative scrollbar-hide">
            <h3 class="font-bold text-base mb-3 text-slate-800 flex items-center border-b pb-2">
                <i data-lucide="package-minus" class="w-4 h-4 mr-2 text-amber-500"></i> 取出貨物
            </h3>
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 mb-3 shadow-inner">
                <div class="text-[10px] text-slate-500 mb-0.5">檔主: <span id="crWithdrawTenantDisplay" class="font-bold text-slate-700 text-xs"></span></div>
                <div class="text-[10px] text-slate-500">目前剩餘數量: <span id="crWithdrawRemainDisplay" class="font-bold text-blue-600 text-xs"></span></div>
            </div>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">提取日期</label>
                        <input type="date" id="crInputWithdrawDate" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-amber-500 focus:outline-none text-center">
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">時間</label>
                        <input type="time" id="crInputWithdrawTime" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs focus:border-amber-500 focus:outline-none text-center">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">本次取出數量</label>
                    <input type="number" id="crInputWithdrawQty" min="1" class="w-full border border-slate-300 rounded-lg p-2 text-lg focus:border-amber-500 focus:outline-none font-bold text-slate-700 text-center bg-white shadow-inner">
                </div>
            </div>
            <input type="hidden" id="crCurrentActionId">
            <div class="mt-5 flex justify-end space-x-2 border-t border-slate-100 pt-3">
                <button onclick="window.crCloseWithdrawModal()" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold active:scale-95 transition-colors shadow-sm border border-slate-200">取消</button>
                <button onclick="window.crSubmitWithdraw()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold shadow-sm active:scale-95 transition-colors">確認取出</button>
            </div>
        </div>
    </div>
</body>
</html>
